function fmtDur(ms){
  const s=Math.max(0,Math.round(ms/1000)), m=Math.floor(s/60);
  return m+':'+String(s%60).padStart(2,'0');
}
function restGaps(sets){
  const ts=sets.filter(x=>x.t).map(x=>x.t);
  const out=[];
  for(let i=1;i<ts.length;i++){
    const g=ts[i]-ts[i-1];
    out.push(g>20*60000? 'break' : fmtDur(g));
  }
  return out;
}
function restSecs(str){ if(!str) return 90; const p=String(str).split(':');
  var base=(+p[0])*60+(+p[1]||0);
  return Math.max(30, base+(S.restAdj||0));   // athlete's global adjustment, never under 30s
}
// ===== TRANSITION GAUGE =====
// Two ambient bars down the screen edges during the walk between exercises. No numbers —
// a glance tells you whether you're in the window. The rest chip already handles between-SET rest;
// this covers the gap the clock never watched: finishing one lift and starting the next.
// Thresholds scale off the NEXT exercise's prescribed rest, because a heavy squat needs a settled
// brace and a lateral raise does not. Going too soon is a real error, not just going too late.
const TB_SETTLE=0.50, TB_DRIFT=1.20, TB_COLD=2.00;
const PH_ORD={settle:0, ready:1, drift:2, cold:3};
let TR={key:null, tgt:null, ph:null};   // latched transition: survives browsing, never runs backwards
function inProgressIdx(){
  try{ var d=(typeof effDay==='function')? effDay():dayObj();
    for(var i=0;i<d.exercises.length;i++){
      if(isOut(d.exercises[i].name)) continue;
      if(exStarted(i)&&!exDone(i)) return i; }
  }catch(e){}
  return -1;
}
function nextPendingIdx(){
  try{ var d=(typeof effDay==='function')? effDay():dayObj();
    for(var i=0;i<d.exercises.length;i++){
      if(isOut(d.exercises[i].name)) continue;
      if(!exStarted(i)) return i; }
  }catch(e){}
  return -1;
}
function transitionState(){
  try{
    if(S.bars===false) return null;
    var last=lastCompletion(); if(!last) return null;
    var el=Date.now()-last.t;
    if(el>30*60000) return null;                    // they left the gym, not a transition
    if(inProgressIdx()>-1) return null;             // mid-exercise: the rest chip owns this
    var i=nextPendingIdx(); if(i<0) return null;    // nothing left to walk to
    if(last.exi===i) return null;                   // same lift, not a transition
    var d=(typeof effDay==='function')? effDay():dayObj();
    var ex=d.exercises[i];
    // Anchored to what's actually UP NEXT, not to whatever they're scrolling past. Browsing the
    // deck used to swap the denominator mid-transition and send the colour backwards.
    var tgt=restSecs(exRest(ex))*1000;
    var ratio=el/tgt, phase;
    if(ratio<TB_SETTLE) phase='settle';
    else if(ratio<TB_DRIFT) phase='ready';
    else if(ratio<TB_COLD) phase='drift';
    else phase='cold';
    // Elapsed time only ever grows, so the gauge must only ever advance within one transition.
    if(TR.key===last.t && TR.tgt===tgt && TR.ph && PH_ORD[phase]<PH_ORD[TR.ph]) phase=TR.ph;
    TR={key:last.t, tgt:tgt, ph:phase};
    var st=null; try{ st=S.data[exKey(i)]; }catch(e){}
    return {phase:phase, el:el, tgt:tgt, ratio:ratio, exi:i,
      pct:Math.max(4,Math.min(100,Math.round((ratio/TB_COLD)*100))),
      name:(st&&st.sub)||ex.name};
  }catch(e){ return null; }
}
function paintBars(){
  try{
    var L=document.getElementById('tbarL'), R=document.getElementById('tbarR');
    if(!L){ L=document.createElement('div'); L.id='tbarL'; L.className='tbar l';
      L.innerHTML='<div class="fl"></div>'; document.body.appendChild(L); }
    if(!R){ R=document.createElement('div'); R.id='tbarR'; R.className='tbar r';
      R.innerHTML='<div class="fl"></div>'; document.body.appendChild(R); }
    var t=transitionState();
    var chip=document.getElementById('restTick');
    var chipUp=chip&&chip.style.display!=='none'&&!chip.className.includes('mini');
    if(!t||chipUp){ L.className='tbar l'; R.className='tbar r'; return; }
    var cls='tbar on ph-'+t.phase;
    L.className=cls+' l'; R.className=cls+' r';
    [L,R].forEach(function(b){ var f=b.querySelector('.fl'); if(f) f.style.height=t.pct+'%'; });
    L.setAttribute('aria-label','Transition to '+t.name+': '+
      ({settle:'still settling',ready:'good to start',drift:'running long',cold:'going cold'})[t.phase]);
  }catch(e){}
}
function lastCompletion(){
  const d=dayObj(); let best=null;
  d.exercises.forEach((ex,i)=>{
    const st=S.data[exKey(i)]; if(!st) return;
    st.sets.forEach((s,j)=>{ if(s.t && (!best || s.t>best.t)) best={t:s.t, label:(st.sub||ex.name), exi:i, j:j, target:restSecs(exRest(ex))}; });
  });
  // "just this one" extension - distinct from the global rest preference; keyed to this exact
  // rest so it evaporates the moment the next set is logged
  if(best && S.restExt && S.restExt.t===best.t) best.target+=S.restExt.add;
  return best;
}
function wlSorted(){ return (S.weightLog||[]).slice().sort((a,b)=>a.d<b.d?-1:1); }
function wlAvg(arr){ if(!arr.length) return null; return arr.reduce((s,x)=>s+x.w,0)/arr.length; }
function wlStats(){
  const L=wlSorted(); if(!L.length) return null;
  const last=L[L.length-1];
  const a7=wlAvg(L.slice(-7)), b7=wlAvg(L.slice(-14,-7));
  return {last:last, a7:a7, b7:b7, delta:(a7!=null&&b7!=null)?(a7-b7):null, n:L.length};
}
function wlSpark(){
  const L=wlSorted().slice(-30); if(L.length<2) return '';
  const ws=L.map(x=>x.w); const mn=Math.min.apply(null,ws), mx=Math.max.apply(null,ws);
  const span=(mx-mn)||1; const W=260,H=40;
  const pts=L.map((x,i)=>{ const px=(i/(L.length-1))*W; const py=H-4-((x.w-mn)/span)*(H-8); return px.toFixed(1)+','+py.toFixed(1); }).join(' ');
  return '<svg width="100%" height="'+H+'" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="display:block;margin-top:6px"><polyline points="'+pts+'" fill="none" stroke="var(--amber)" stroke-width="2"/></svg>';
}
// ===== PROGRESS CHARTS =====
// Time-true by design: the x axis is real elapsed days, never session index. Three sessions in
// one week and three across a month are different stories, and an index-spaced line tells the
// same one for both - which is how a chart lies about progress.
// Readability rules learned the hard way: big type (11px axis), labelled round-number
// gridlines, an area fill so the line reads at arm's length, the latest value called out
// large at the line's end, and reference lines for the numbers that give the trend meaning.
var CHART_UID=0;
function niceTicks(mn,mx,n){
  var span=(mx-mn)||1, step0=span/Math.max(1,n), mag=Math.pow(10,Math.floor(Math.log10(step0)));
  var step=[1,2,2.5,5,10].map(function(m){return m*mag;}).filter(function(s2){return s2>=step0;})[0]||10*mag;
  var t0=Math.ceil(mn/step)*step, out=[];
  for(var v=t0; v<=mx+1e-9; v+=step) out.push(Math.round(v*100)/100);
  return out;
}
function chartSVG(series, opts){
  opts=opts||{};
  var SS=(Array.isArray(series)&&series.length&&series[0]&&series[0].pts)? series : [{pts:series}];
  SS=SS.map(function(s2){ return {name:s2.name||'', color:s2.color||'var(--amber)', fill:s2.fill!==false,
    pts:(s2.pts||[]).filter(function(x){return x&&isFinite(x.t)&&isFinite(x.v);}).sort(function(a,b){return a.t-b.t;})}; });
  var all=[].concat.apply([],SS.map(function(s2){return s2.pts;}));
  if(all.length<2 || !SS.some(function(s2){return s2.pts.length>=2;}))
    return '<div class="exnote" style="padding:6px 0 0">'+(opts.empty||'Two or more entries and the trend draws itself.')+'</div>';
  var W=360,H=opts.h||170,L=46,R=52,T=14,B=26,uid=++CHART_UID;
  var t0=Math.min.apply(null,all.map(function(p){return p.t;}));
  var t1=Math.max.apply(null,all.map(function(p){return p.t;}))||t0+1;
  var mn=Math.min.apply(null,all.map(function(p){return p.v;}));
  var mx=Math.max.apply(null,all.map(function(p){return p.v;}));
  if(opts.ref&&isFinite(opts.ref.v)){ mn=Math.min(mn,opts.ref.v); mx=Math.max(mx,opts.ref.v); }
  if(mn===mx){ mn-=2; mx+=2; }
  var pad=(mx-mn)*0.14; mn-=pad; mx+=pad;
  function X(t){ return L+((t-t0)/Math.max(1,(t1-t0)))*(W-L-R); }
  function Y(v){ return T+(1-(v-mn)/(mx-mn))*(H-T-B); }
  function fd(t){ var d=new Date(t); return (d.getMonth()+1)+'/'+d.getDate(); }
  function f1(v){ return Math.abs(v)>=100? Math.round(v) : Math.round(v*10)/10; }
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="'+(opts.label||'trend')+'" style="display:block">';
  s+='<defs>'+SS.map(function(s2,si){
    return '<linearGradient id="cg'+uid+'_'+si+'" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0" stop-color="'+s2.color+'" stop-opacity="0.28"/>'
      +'<stop offset="1" stop-color="'+s2.color+'" stop-opacity="0"/></linearGradient>'; }).join('')+'</defs>';
  niceTicks(mn+pad*0.3, mx-pad*0.3, 3).forEach(function(tv){
    var y=Y(tv);
    s+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
    s+='<text x="'+(L-6)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--dim)">'+f1(tv)+'</text>';
  });
  if(opts.ref&&isFinite(opts.ref.v)){
    var ry=Y(opts.ref.v);
    s+='<line x1="'+L+'" y1="'+ry.toFixed(1)+'" x2="'+(W-R)+'" y2="'+ry.toFixed(1)+'" stroke="var(--dim)" stroke-width="1.5" stroke-dasharray="5 4"/>';
    s+='<text x="'+(W-R+4)+'" y="'+(ry+4).toFixed(1)+'" font-size="10" fill="var(--dim)">'+(opts.ref.label||f1(opts.ref.v))+'</text>';
  }
  s+='<text x="'+L+'" y="'+(H-8)+'" font-size="11" fill="var(--dim)">'+fd(t0)+'</text>';
  s+='<text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" font-size="11" fill="var(--dim)">'+fd(t1)+'</text>';
  SS.forEach(function(s2,si){
    if(s2.pts.length<2) return;
    var line=s2.pts.map(function(p){return X(p.t).toFixed(1)+','+Y(p.v).toFixed(1);}).join(' ');
    if(s2.fill){
      s+='<polygon points="'+X(s2.pts[0].t).toFixed(1)+','+(H-B)+' '+line+' '+X(s2.pts[s2.pts.length-1].t).toFixed(1)+','+(H-B)+'" fill="url(#cg'+uid+'_'+si+')"/>';
    }
    s+='<polyline points="'+line+'" fill="none" stroke="'+s2.color+'" stroke-width="2.5" stroke-linejoin="round"/>';
    var peak=-Infinity;
    s2.pts.forEach(function(p,pi){
      var isPR = si===0 && opts.prs && p.v>peak && pi>0; peak=Math.max(peak,p.v);
      s+='<circle cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(isPR?5:3.2)+'" fill="'+(isPR?'none':s2.color)+'"'+(isPR?' stroke="'+s2.color+'" stroke-width="2"':'')+'/>';
    });
    var last=s2.pts[s2.pts.length-1];
    s+='<text x="'+(W-R+4)+'" y="'+(Y(last.v)+(si?14:-6)).toFixed(1)+'" font-size="'+(si?11:15)+'" font-weight="800" fill="'+s2.color+'">'+f1(last.v)+'</text>';
  });
  if(SS.length>1){
    var lx=L;
    SS.forEach(function(s2){
      if(!s2.name) return;
      s+='<rect x="'+lx+'" y="4" width="10" height="4" rx="2" fill="'+s2.color+'"/>';
      s+='<text x="'+(lx+14)+'" y="10" font-size="10" fill="var(--dim)">'+s2.name+'</text>';
      lx+=14+s2.name.length*6+14;
    });
  }
  return s+'</svg>';
}
function dpts(arr, dk, vk){ return (arr||[]).map(function(x){ return {t:new Date(x[dk]+'T12:00:00').getTime(), v:+x[vk]}; }).filter(function(p){ return isFinite(p.v); }); }
function volBars(){
  // hard sets per block-week, most recent 8 weeks - the cause behind every trend line.
  // Deload weeks draw hollow on purpose: low bars there are the plan working, not slacking.
  var out=[]; var cyc0=(typeof cyc==='function')?cyc():1;
  for(var c=1;c<=cyc0;c++) for(var w=1;w<=PLAN.weeks;w++){
    var n=weekSets(c,w); if(n>0||c===cyc0) out.push({lbl:(cyc0>1?('B'+c+' '):'')+'W'+w, n:n, dl:(w===PLAN.weeks)});
  }
  var V=out.slice(-8);
  if(!V.some(function(x){return x.n>0;})) return '<div class="exnote" style="padding:6px 0 0">Log sets and the weekly work bars appear here.</div>';
  var W=360,H=128,B=22,T=18,gap=8;
  var bw=(W-20-(V.length-1)*gap)/V.length;
  var mx=Math.max.apply(null,V.map(function(x){return x.n;}))||1;
  var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="weekly sets" style="display:block">';
  V.forEach(function(x,i){
    var bx=10+i*(bw+gap), bh=Math.max(3,(x.n/mx)*(H-T-B)), by=H-B-bh;
    if(x.dl) s+='<rect x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="3" fill="none" stroke="var(--amber)" stroke-width="2"'+(x.n?'':' opacity="0.25"')+'/>';
    else s+='<rect x="'+bx.toFixed(1)+'" y="'+by.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="3" fill="var(--amber)"'+(x.n?'':' opacity="0.2"')+'/>';
    if(x.n) s+='<text x="'+(bx+bw/2).toFixed(1)+'" y="'+(by-5).toFixed(1)+'" text-anchor="middle" font-size="12" font-weight="800" fill="var(--chalk)">'+x.n+'</text>';
    s+='<text x="'+(bx+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="var(--dim)">'+x.lbl+'</text>';
  });
  return s+'</svg>';
}
function e1Spark(k){  // per-lift strength chart: the trend AND the number it is chasing
  var L=((S.e1rmH||{})[k]||[]);
  var mx0=(S.maxes||{})[k];
  return chartSVG([{pts:dpts(L,'d','v').map(function(p){ return {t:p.t, v:CV(p.v)}; }), name:'', color:'var(--amber)'}],
    {label:'e1RM trend', prs:true, ref:{v:CV(mx0), label:'max '+(mx0!=null? WV(mx0):'')},
     empty:'Log working sets on this lift and the trend appears on its own.'});

// ===== RATE TAB =====
// The accuracy checks make every logged set a usable estimate; this screen turns those
// estimates into the one number a training block is really about: pounds per week, per lift.
// Least-squares slope over the recent window - a single good day cannot fake a trend.
const RATE_WINDOW=56, RATE_MIN_PTS=3, RATE_MIN_SPAN=14;
function rateFor(k){
  var H=((S.e1rmH||{})[k]||[]).filter(function(x){
    var a=daysAgo(x.d); return a>=0 && a<=RATE_WINDOW; });
  if(!H.length) return {n:0};
  var t0=new Date(H[0].d+'T12:00:00').getTime();
  var pts=H.map(function(x){ return {t:(new Date(x.d+'T12:00:00').getTime()-t0)/86400000, v:x.v}; });
  var span=pts[pts.length-1].t-pts[0].t;
  var out={n:H.length, span:Math.round(span), latest:H[H.length-1]};
  if(H.length<RATE_MIN_PTS || span<RATE_MIN_SPAN) return out;   // not enough to call it a trend
  var n=pts.length, sx=0,sy=0,sxx=0,sxy=0;
  pts.forEach(function(p){ sx+=p.t; sy+=p.v; sxx+=p.t*p.t; sxy+=p.t*p.v; });
  var denom=n*sxx-sx*sx; if(!denom) return out;
  out.rate=Math.round(((n*sxy-sx*sy)/denom)*7*10)/10;          // lb per week, one decimal
  return out;
}
function rateWord(r){ return r>=1? 'building' : (r<=-1? 'sliding' : 'holding'); }
// ===== AD-HOC ACCURACY CHECK =====
// Athlete-initiated, any exercise in the gym, run from the RATE tab. Same measurement as the
// scheduled drill (mark the rep where two felt left, then go to true failure) so every check
// sharpens the personal RIR correction regardless of the movement chosen. What ELSE the result
// may touch is gated:
//   - programming maxes: only a barbell lift the library rates equivalent to the main lift
//     (factor 1.0), only when run fresh, only at 10 reps or fewer - the table's validated range.
//   - anything else: updates that exercise's own anchor, never a max.
// A set run at the end of a full session measures fatigue, not fitness, so "end of session"
// checks are skill data only. Rep-at-2-left vs total stays honest under fatigue because both
// numbers come from the same tired set.

function adhocLift(name){
  var n=String(name||'').trim().toLowerCase(); if(!n) return null;
  var row=null;
  try{ EXLIB.forEach(function(r){ if(!row && String(r[0]).toLowerCase()===n) row=r; }); }catch(e){}
  if(!row) return {name:name, known:false, eligible:false, k:null};
  var elig=(row[2]==='barbell' && row[4]===1.0 && row[3] && S.maxes && S.maxes[row[3]]!=null);
  return {name:row[0], known:true, eligible:!!elig, k:elig?row[3]:null, fam:row[3]||null};

function adhocDays(name){
  var L=adhocLift(name); if(!L) return [];
  var out=[];
  try{ PLAN.days.forEach(function(d){
    var hit=d.exercises.some(function(ex){
      if(String(ex.name).toLowerCase()===String(L.name).toLowerCase()) return true;
      return !!(L.fam && ex.maxKey && ex.maxKey===L.fam); });
    if(hit) out.push(d.code); }); }catch(e){}
  return out;
}
// Proximity-aware interference: with a weekday map, warn hard at 1 day, gently at 2, and stay
// quiet at 3+ - a to-failure set is recovered by then, and a warning that fires when nothing is
// at stake teaches people to ignore the one that matters. Without a map, name the day codes.
function adhocWarn(name){
  var days=adhocDays(name); if(!days.length) return null;
  var m=schedMap();
  if(!m) return {kind:'codes', days:days};
  var WD=['SU','MO','TU','WE','TH','FR','SA'];
  var t0=new Date(shiftDate()+'T12:00:00');
  var soon=null, soonCode=null;
  for(var off=1; off<=7; off++){
    var idx=new Date(t0.getTime()+off*86400000).getDay();
    var code=m[WD[idx]];
    if(code && days.indexOf(code)>-1){ soon=off; soonCode=code; break; }
  }
  if(soon==null || soon>=3) return null;
  var day=PLAN.days.filter(function(x){ return x.code===soonCode; })[0];
  return {kind:soon===1?'tomorrow':'twodays', title:(day&&day.title)||('Day '+soonCode)};
}
function adhocWarnHTML(name){
  var W=adhocWarn(name); if(!W) return '';
  if(W.kind==='tomorrow')
    return '<div class="cue" style="padding:0 0 8px;color:var(--amber)">Heads up: <b>'+esc(W.title)+' is tomorrow</b> on your schedule, and this movement feeds it. '
      +'A set to failure now will cost you that session and muddy the reading. Your call \u2014 the card just wants you to know.</div>';
  if(W.kind==='twodays')

    +'If one of those sessions is coming in the next day or two, a set to failure now will cost you the session and muddy the reading. '
    +'Your call \u2014 the card just wants you to know.</div>';
}

function adhocSave(){

    var e=e1rmFrom(C.load, C.total, 0);

async function backupAll(){ try{ markBackedUp(); }catch(e){}
  const logs={};
  if(storageOK){ for(const k of logKeys){ try{ const r={value:await stGet(k)};
logs[k]=r.value; }catch(e){} } }
  const payload=JSON.stringify({v:1, exported:localDate(), S:S, logs:logs});
  const fname='training-card-backup-'+localDate()+'.json';
  // Path 1 - the share sheet with a REAL file (on iPhone: "Save to Files" makes it a file).
  // If the person opens the sheet and cancels, that is an answer - stop, never cascade
  // into fallbacks that look like an error.
  try{ const f=new File([payload], fname, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[f]})){
      try{ await navigator.share({files:[f], title:'Training Card backup'}); alertToast('Backup saved \u2713'); }
      catch(shErr){ if(shErr && shErr.name==='AbortError') alertToast('Backup cancelled'); else throw shErr; }
      return; } }catch(e){}
  // Path 2 - a plain download link. Known-broken inside an iPhone home-screen app
  // (iOS ignores the download attribute in standalone mode), so skip straight past it there.
  const iosStandalone=(navigator.standalone===true);
  if(!iosStandalone){
    try{ const url=URL.createObjectURL(new Blob([payload],{type:'application/json'}));
      const a=document.createElement('a'); a.href=url; a.download=fname; document.body.appendChild(a); a.click(); a.remove(); alertToast('Backup downloaded \u2014 check your Downloads'); return; }catch(e){}
  }
  // Path 3 - last resort, and it now explains itself instead of dumping code:
  const ok=await tryCopy(payload);
  showOverlay(ok? 'Backup copied \u2014 open Notes or Files, paste, and save it as '+fname
               : 'Copy this backup, then paste it into Notes or Files and save as '+fname, payload, ok);
}

function firstInt(s,def){ const m=String(s==null?'':s).match(/\d+/); return m? +m[0]:def; }

// A 4x10 @68% RIR-2 volume day is NOT a max test - feeding it in drags the estimate
// far below true single-rep strength. E1_MAXREPS gates that out.
// ============================================================
// LOAD-INTENSITY REFERENCE
// Zourdos MC et al. (2016) "Novel Resistance Training-Specific Rating of Perceived Exertion
//   Scale Measuring Repetitions in Reserve." J Strength Cond Res 30(1):267-275.
// Helms ER et al. (2016) "Application of the Repetitions in Reserve-Based RPE Scale for
//   Resistance Training." Strength Cond J 38(4):42-49.
// Reported accuracy is roughly +/-3-5% for trained lifters; wider for novices, which is why
// E1_CONF widens the band and why novices get a lower training-max multiplier below.
//
// Rows are RIR (reps left in the tank), columns are reps performed, values are % of 1RM.
// This replaces the Epley formula, which drifts high off low-rep sets and was previously
// being corrected with a fudge factor tuned against a simulation rather than data.
// ============================================================
var RIR_PCT={
 0:[100.0,95.5,92.2,89.2,86.3,83.7,81.1,78.6,76.2,74.4],
 1:[ 95.5,92.2,89.2,86.3,83.7,81.1,78.6,76.2,74.4,71.0],
 2:[ 92.2,89.2,86.3,83.7,81.1,78.6,76.2,74.4,71.0,68.0],
 3:[ 89.2,86.3,83.7,81.1,78.6,76.2,74.4,71.0,68.0,65.3],
 4:[ 86.3,83.7,81.1,78.6,76.2,74.4,71.0,68.0,65.3,62.6]
};
// Estimate 1RM from a completed set. Returns null outside the table's validated range -
// the chart is defined for 1-10 reps at 0-4 RIR and should not be extrapolated past it.
function e1rmFrom(weight, reps, rir){
  if(!(weight>0)) return null;
  reps=Math.round(reps); rir=Math.round(rir);
  if(reps<1||reps>10) return null;
  if(rir<0) rir=0;
  if(rir>4) return null;                       // too far from failure to estimate honestly
  var pct=RIR_PCT[rir][reps-1];
  if(!pct) return null;
  return Math.round(weight/(pct/100));

// Confidence band on that estimate. Trained lifters sit around +/-4%; novices are wider
// because RIR accuracy is a trained skill (Helms 2016 advises novices not to base
// progression on RIR alone until accuracy is established).
function e1rmBand(est, experienced){
  var f=experienced?0.05:0.12;
  return {lo:Math.round(est*(1-f)), hi:Math.round(est*(1+f))};
}

const E1_MAXREPS=10, E1_MAXRIR=4, E1_WINDOW=84;   // bounds now match the validated chart
function e1Window(k, asOf){
  const H=(S.e1rmH&&S.e1rmH[k])||[]; if(!H.length) return null;
  const ref=new Date((asOf||S.when.date||localDate())+'T12:00:00').getTime();
  let best=null;
  H.forEach(x=>{ const t=new Date(x.d+'T12:00:00').getTime();
    const age=(ref-t)/86400000;

function report(){
  const d=dayObj();
  const lines=['SESSION REPORT · Block '+cyc()+' · Day '+S.day+' W'+S.week+' · '+S.when.date+(S.when.time?' '+fmtTime(S.when.time):'')];
  const RL2=readyLabel();
  if(RL2 && S.ready && S.ready.date===S.when.date) lines.push('Readiness: '+readyScore()+'/6 ('+RL2[0]+')'+(readyMult()!==1?' \u2014 barbell loads auto-adjusted':''));
  if(S.ready && S.ready.date!==S.when.date && S.ready.date===shiftDate()) lines.push('Readiness (entered today; session date mismatch): '+readyScore()+'/6');
  const bwT=(S.weightLog||[]).find(x=>x.d===S.when.date);
  if(bwT){ const wsR=wlStats(); lines.push('Bodyweight: '+bwT.w.toFixed(1)+' lb'+((wsR&&wsR.a7!=null)?' (7d avg '+wsR.a7.toFixed(1)+')':'')); }
  if(S.profile){ const gl=goalDef(); lines.push('Profile: '+S.profile.hFt+"'"+S.profile.hIn+'\" \u00b7 '+S.profile.wt+' lb \u00b7 Goal: '+(gl? gl.label:'Block 1 \u2014 Squat Priority')); }
  const prA=(S.pairs&&S.pairs[S.day])||[];
  if(prA.length){ const pn=prA.map(x=>{ const a=d.exercises[x], b2=d.exercises[x+1]; return (a&&b2)? (a.name+' + '+b2.name):null; }).filter(Boolean); if(pn.length) lines.push('Supersets: '+pn.join('; ')); }
  d.exercises.forEach((ex,i)=>{
    const st=S.data[exKey(i)];
    const untouched = !st || st.sets.every(s=>s.st==='pend');
    if(isOut(ex.name) && untouched) return;
    if(untouched){ lines.push(ex.name+': not done'); return; }
    const numeric = st.sub? true : ex.loadNum!=null;
    const w = st.sub? (st.w!=null? st.w:'?') : (numeric? curLoad(ex,st): ex.load);
    const nm = st.sub? st.sub : ex.name;
    const parts=st.sets.filter(s=>!(s.added&&s.st==='pend')).map(s=>{
      if(s.st==='pend') return '·';
      if(s.st==='hit') return '✓'+(s.g?'!':'');
      return (s.reps!=null?s.reps:'?')+(s.rir!=null?'@'+s.rir:'')+(s.g?'!':'');
    });
    let line=nm+' '+w+(!st.sub&&ex.perHand?'/hand':'')+': '+parts.join(', ');
    if(st.sets.some(s=>s.w!=null)){ const base=(typeof w==='number')? w:null;
      line+=' | wts '+st.sets.filter(s=>!(s.added&&s.st==='pend')).map(s=>s.w!=null? s.w : (base!=null? base:'-')).join('/'); }
    const gaps=restGaps(st.sets);
    if(gaps.length) line+=' | rest '+gaps.join(', ');
    const myFirst=st.sets.filter(x=>x.t).map(x=>x.t)[0];
    if(myFirst){
      let prevLast=null;
      for(let p=i-1;p>=0;p--){
        const pst=S.data[exKey(p)]; if(!pst) continue;
        const ts=pst.sets.filter(x=>x.t).map(x=>x.t);
        if(ts.length){ prevLast=ts[ts.length-1]; break; }
      }
      if(prevLast!=null){
        const g=myFirst-prevLast;
        line+=' | switch '+(g>20*60000? 'break' : fmtDur(g));
      }
    }
    const tags=[];
    if(st.sub) tags.push('sub for '+ex.name);
    if(numeric && st.w!=null && st.w!==baseLoad(ex)) tags.push('adjusted from '+baseLoad(ex));
    if(st.feel!=null) tags.push(FEELS[st.feel].toLowerCase());
    if(isOut(ex.name)) tags.push('removed');
    if(ex.custom) tags.push('custom');
    if(tags.length) line+=' ['+tags.join(' — ')+']';
    lines.push(line);
  });
  const allT=[];
  d.exercises.forEach((ex,i)=>{ const st=S.data[exKey(i)]; if(st) st.sets.forEach(s=>{ if(s.t) allT.push(s.t); }); });
  if(allT.length>=2){ allT.sort((a,b)=>a-b); lines.push('Session length: '+fmtDur(allT[allT.length-1]-allT[0])); }
  const gAll=[]; d.exercises.forEach((ex,i)=>{ const st=S.data[exKey(i)]; if(st){ restGaps(st.sets).forEach(g=>gAll.push(g)); } });
  if(gAll.length>=2 && gAll.every(g=>{ const p=g.split(':'); return (parseInt(p[0],10)*60+parseInt(p[1],10))<20; })) lines.push('Rest data: batch-logged after the fact (gaps are tap times, not real rests)');
  const VCr=volCaution(); if(VCr) lines.push((VCr.lv===2?'VOLUME WARNING: ':'VOLUME CAUTION: ')+VCr.v.ex+' exercises / '+VCr.v.sets+' sets this day');
  const ctimed = S.cardio.tacc + (S.cardio.tstart? Date.now()-S.cardio.tstart : 0);
  const todaysPain=S.painLog.filter(p=>p.date===S.when.date);
  if(todaysPain.length) lines.push('PAIN FLAGS: '+todaysPain.map(p=>p.ex+' ('+p.lv+'+/10)').join(', '));
  lines.push('Cardio: '+((S.cardio.on||ctimed>60000)? cardioLabel()+(ctimed>60000? ' (timed '+fmtDur(ctimed)+')':'') : 'none'));
  if(S.cardio.zone==='z3') lines.push('Cardio intensity: tempo '+(S.cardio.tempoZ==='z4'?'(zone 4 threshold)':'(zone 3 steady)'));
  if(S.cardio.zone==='hiit'){ const v=S.cardio.iv||{}; lines.push('Cardio intensity: intervals '+fmtIv(v.work||30)+'/'+fmtIv(v.rest||90)+' x '+(v.rounds||8)); }
  if((S.cardio.extra||[]).length) lines.push('Cardio extras: '+S.cardio.extra.map(function(x){ const md=CMODES.find(m=>m.id===x.mode); const v=S.cardio.iv||{}; return (md?md.name:x.mode)+' '+x.min+'m'+(x.zone==='z3'?' tempo Z3':x.zone==='z4'?' tempo Z4':(x.zone==='hiit'?' intervals '+fmtIv(v.work||30)+'/'+fmtIv(v.rest||90):'')); }).join('; '));
  if(S.condSel && S.condSel!=='none'){ const P=runPaces(); const lbl=(CONDS.find(c=>c.id===S.condSel)||{}).label||S.condSel;
    const lbl2=(S.condSel==='track')? (lbl+' - '+((S.trk&&S.trk.reps)||6)+' x '+((S.trk&&S.trk.dist)||400)+'m'+(P? ' @ '+fmtT(trkTgt(P,(S.trk&&S.trk.dist)||400).t):'')) : lbl;
    lines.push('Conditioning session: '+lbl2+(P? ' - paces from '+BENCH.short+' '+fmtPace(P.t2)+' (tempo '+fmtPace(P.tempo)+'/mi, 400m '+P.i400+'s)' : ' - by feel (no '+BENCH.short+' logged)')); }
  if(S.notes.trim()) lines.push('Notes: '+S.notes.trim());
  lines.push('(✓ = as prescribed at target RIR \u00b7 ! = grindy bar speed)');
  return lines.join('\n');
}

async function tryCopy(t){
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(t); return true; } }catch(e){}
  try{ if(typeof document.execCommand==='function'){
      const ta=document.createElement('textarea'); ta.value=t;
      ta.style.cssText='position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok=document.execCommand('copy'); ta.remove(); if(ok) return true; } }catch(e){}
  return false;
}

  if(goal==='strength') return {reps:'5', rir:'2, last set 1', pct:[.75,.75,.80,.80,.85,.45], sets:isPriority?4:3};
  if(goal==='muscle')   return {reps:'8', rir:'2, last set 1', pct:[.67,.67,.70,.72,.75,.42], sets:isPriority?4:3};
  if(goal==='lean')     return {reps:'8', rir:'2 throughout',  pct:[.65,.65,.68,.70,.72,.40], sets:3};

// The split itself stays fixed - what varies between people is which days they can actually get

// spaces the demanding work best, rather than assuming A-B-C-D-E on consecutive days.

    return e.maxKey && (e.maxKey==='bench'||e.maxKey==='ohp') && !/Second exposure/.test(e.note||''); });

    var next=(i+1)%wd.length;
    var gap=PG_gap(wd[i], wd[next]);
    var a=PG_dayLoad(plan.days[order[i]]), b=PG_dayLoad(plan.days[order[next]]);
    if(gap===1){                       // trained on back-to-back calendar days
      if(a===2&&b===2) pen+=6;         // two heavy lower sessions with no day between them
      else if(a===2&&b===1) pen+=1;    // heavy lower then heavy upper is tolerable
      else if(a===1&&b===1) pen+=2;    // two heavy pressing days back to back

  if(!wd.length || wd.length!==plan.days.length) return null;
  var best=null;
  for(var r=0;r<plan.days.length;r++){
    var order=[];
    for(var i=0;i<plan.days.length;i++) order.push((i+r)%plan.days.length);
    var sc=PG_schedScore(order, wd, plan);

function generatePlan(cfg){
  // cfg: {maxes:{squat,bench,dead,ohp}, goal, days, limits:[], name}
  var maxes={}; ['squat','bench','dead','ohp'].forEach(function(k){ maxes[k]=PG_r5(cfg.maxes[k]||95); });
  var diag=PG_diagnose(maxes);
  // the athlete's answer to the priority question outranks the automatic diagnosis:
  // maybe the "weak" lift is weak because of an injury they are managing, or maybe they
  // simply want a different fight this block. 'auto' keeps the diagnosis; a lift name
  // forces it; 'none' declines priority entirely.
  if(cfg.weak==='none'){ diag.weak=null; }
  else if(cfg.weak && cfg.weak!=='auto'){ diag.weak=cfg.weak; diag.forced=true; }
  var tpl=PG_TEMPLATES[cfg.days] || PG_TEMPLATES[4];
  var goal=cfg.goal||'general';
  var today=new Date(); var iso=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);
  var days=tpl.map(function(t){
    var list=[];
    t.mains.forEach(function(m){
      var spec=PG_mainSpec(m), mk=spec.l;
      var sub=(PG_belowBar(cfg.res, mk) || PG_underBar(maxes, mk, PG_pct(goal, false)))
               ? PG_BELOWBAR[mk] : null;
      // a stated preference wins over the default, but never over "you cannot lift the bar"
      var pref=sub? null : PG_prefName(cfg, mk);
      var nm=sub? sub.name : (pref || PG_pick(PG_MAINNAME[mk], cfg.limits));
      // an injury flag still gets the last word: run the preference past the same filter
      if(pref){ var safe=PG_pick(pref, cfg.limits); if(safe && safe!==pref){ nm=safe; pref=null; } }
      var prefSwapped=!!(pref && pref!==PG_MAINNAME[mk]);
      var sch=PG_pct(goal, diag.weak===mk && !spec.light);
      if(spec.light){
        sch={reps:(goal==='strength'?'8':'10'), rir:'2 throughout',
             pct:sch.pct.map(function(p){ return p*PG_LIGHT; }), sets:3};
      }
      if(prefSwapped){
        // Their choice, prescribed honestly: the tested max belongs to the barbell lift, so this
        // runs on sets and reps and the card raises it from logged work instead.
        list.push(PG_ex(nm, maxes, {sch:{reps:(goal==='strength'?'6-8':'8-12'), rir:'2 throughout',
          pct:null, sets:(sch.sets||3)}, limits:cfg.limits||[],
          note:'Your pick for the '+PG_PREFS[mk].label.toLowerCase()+'. Sets and reps rather than a '
              +'percentage \u2014 your tested max describes the barbell version.'}));
      } else if(sub){
        // No maxKey: a percentage of a max they do not have is meaningless. Straight sets and
        // reps, and they pick a weight they can control.
        list.push(PG_ex(nm, maxes, {sch:{reps:'8-10', rir:'2-3 throughout', pct:null, sets:3},
          limits:cfg.limits||[],
          note:'Swapped in for the barbell '+PG_MAINNAME[mk].toLowerCase()+' \u2014 '+sub.why
              +'. Start light enough to finish every rep clean; the card will build you up.'}));
      } else {
      list.push(PG_ex(nm, maxes, {maxKey:mk, sch:sch, limits:cfg.limits||[],
        note: spec.light ? 'Second exposure this week - lighter on purpose. Own the pattern, do not chase the weight.'
             : (diag.weak===mk? 'Priority lift this block - extra set, same loads.' : '')}));
      }
    });
    t.acc.forEach(function(an){
      var nm=PG_pick(an, cfg.limits);
      var sch=PG_pct(goal,false);
      list.push(PG_ex(nm, maxes, {limits:cfg.limits||[],
        sch:{reps:(goal==='strength'?'8':'10-12'), rir:'2, last set 1', pct:null, sets:3}}));
    });
    var heavyMains=t.mains.map(PG_mainSpec).filter(function(x){ return !x.light; }).map(function(x){ return x.l; });
    return {code:t.code, title:t.title + (diag.weak && heavyMains.indexOf(diag.weak)>-1 ? ' \u2605' : ''), exercises:list};
  });
  days=PG_applyEmphasis(days, cfg.emphasis||'balanced', maxes);
  var out={
    block:'Starter Block - '+({strength:'Strength',muscle:'Muscle',lean:'Lean Out',general:'General Fitness'}[goal]||'General')
      +(diag.weak? ' \u00b7 '+({squat:'Squat',bench:'Bench',dead:'Deadlift',ohp:'Press'}[diag.weak])+' Priority':''),
    start:iso, builtOn:iso, weeks:6, v:1,
    maxes:maxes, days:days, diag:diag, limits:(cfg.limits||[]),
    medical:((cfg.limits||[]).indexOf('bp')>-1)? 'Cleared-by-doctor training only. Effort stays conversational, no breath-holding grinds.' : null
  };
  out.sched=PG_schedule(out, (cfg.weekdays&&cfg.weekdays.length===days.length)? cfg.weekdays : PG_defaultDays(days.length));
  return out;
}

// ============================================================
// ONBOARDING - first run only
// Goals first, then the body, then three calibration sessions of guided ramps.
// Never asks for a max. The ramp stops at a hard set of 5 and the math does the rest.
// ============================================================
var ONB_GOALS=[
 {id:'strength', t:'Get stronger', why:'Bigger numbers on the bar. Low reps, long rests.'},
 {id:'muscle',   t:'Build muscle', why:'Add size. Moderate loads, more volume.'},
 {id:'lean',     t:'Lose fat',     why:'Keep the muscle, drop the rest. Lifting protects it.'},
 {id:'general',  t:'General fitness', why:'Strong, conditioned, durable. Balanced work.'}
];
var ONB_LIMITS=[
 {id:'shoulder',t:'Shoulder issues'},{id:'knee',t:'Knee issues'},
 {id:'back',t:'Lower-back issues'},{id:'bp',t:'High blood pressure / heart condition'}
];
var ONB_LIFTS={
 squat:{n:'Back Squat',  cue:'Big air, brace, knees out. Depth before load.'},
 bench:{n:'Bench Press', cue:'Shoulder blades pinned, feet planted.'},
 dead: {n:'Deadlift',    cue:'Wedge in, pull the slack out, push the floor away.'},
 ohp:  {n:'Overhead Press', cue:'Glutes tight, ribs down, finish behind your ears.'}
};
var ONB_EXP=[
 {id:'new',  t:'New to these lifts', why:'Never trained them, or only occasionally'},
 {id:'some', t:'Some experience',    why:'Trained them on and off, comfortable with the movement'},
 {id:'vet',  t:'Trained consistently', why:'These have been in my program for a year or more'}
];
// A starting hypothesis for each lift, as a multiple of bodyweight. The ramp tests the hypothesis
// and corrects it as it goes - it is a starting point, not a prediction we are stuck with.
var ONB_BWM={squat:{new:.75,some:1.25,vet:1.75}, bench:{new:.50,some:.90,vet:1.30},
             dead:{new:1.00,some:1.50,vet:2.10}, ohp:{new:.35,some:.55,vet:.80}};
// Descending reps as the load climbs - the way any lifter actually works up to something heavy.
// Five reps only while it is genuinely light; singles near the top. Total work stays about 14 reps.
var ONB_SCHED=[{p:.40,r:5},{p:.60,r:3},{p:.75,r:2},{p:.85,r:1},{p:.92,r:1}];
var ONB_ORDER=['squat','bench','dead','ohp'];
var ONB_STEPS=['welcome','goal','body','experience','schedule','emphasis','limits','prefs','calibrate','priority','review'];

// The card's founding move, offered to everyone: it was built because a coach looked at one
// lifter's numbers and said "your squat is behind - we fix that first." After calibration
// the card can say the same thing, out loud, and let the athlete answer.
function ONB_priorityDiag(){
  var o=ONB(), maxes={};
  ONB_ORDER.forEach(function(l){ maxes[l]=(o.res[l]&&o.res[l].pm)||Math.round(o.wt*({squat:.6,bench:.45,dead:.8,ohp:.3})[l]); });
  var d=PG_diagnose(maxes);
  var gap=(d.weak!=null)? d.gaps[d.weak] : 0;
  return {weak:d.weak, gap:gap, meaningful:(d.weak!=null && gap<=-8)};
}


function ONB(){ if(!S.onb) S.onb={step:0, goal:null, sex:null, age:30, wt:180, days:null, exp:null, weak:'auto',
  limits:[], ramp:null, res:{}, done:false}; return S.onb; }
function ONB_ACTIVE(){ try{
  var o=ONB();
  if(o.done) return false;
  // a plan that arrived some other way (restore, import) should not drag anyone through setup,
  // but the review screen still gets its moment right after a build
  if(S.genPlan && S.genPlan.days && ONB_STEPS[o.step]!=='review') return false;
  return true;
}catch(e){ return false; } }
function ONB_r5(x){
  // Snap to something that can actually go on the bar. Loads are held in pounds internally and
  // converted for display, so a kg lifter needs the snapping done in KILOS - otherwise the pound
  // grid lands on numbers like 20.4 kg that no plate set can make.
  // Round UP rather than to nearest, so the coarser grid never makes a ramp step SMALLER than
  // intended - rounding down cost an extra set on lifters whose seed was far too low.
  try{
    if(isKg()){
      var LB=2.2046226218;
      var kg=x/LB;
      if(kg<=20) return 20*LB;                    // the bar alone
      var snap=Math.max(20, Math.ceil((kg-20)/5)*5+20);   // 20 + pairs of 2.5s
      return snap*LB;
    }
  }catch(e){}
  if(x<=45) return 45;
  return Math.max(45, Math.ceil((x-45)/10)*10+45);
}

function ONB_seed(l){ var o=ONB();
  return o.wt*(ONB_BWM[l][o.exp||'some'])*((o.sex==='f')?0.72:1); }
function ONB_step(){ var R=ONB().ramp; return ONB_SCHED[Math.min(R.idx||0, ONB_SCHED.length-1)]; }
function ONB_next(l){ var R=ONB().ramp; if(!R) return ONB_r5(ONB_seed(l)*ONB_SCHED[0].p);
  if(R.next) return R.next;
  var w=ONB_r5(R.est*ONB_step().p);
  // Weights snap to what a bar can actually hold, which is a 10lb grid. Two rungs of the ramp can
  // therefore round to the SAME weight - and repeating a set teaches nothing and costs the lifter
  // a set. Always move up at least one notch.
  try{
    var last=R.sets.length? R.sets[R.sets.length-1].w : 0;
    if(last && w<=last) w=last+10;
  }catch(e){}
  return w; }
function ONB_reps(){ var R=ONB().ramp; return R? ONB_step().r : 5; }
function ONB_feedback(fb){
  var o=ONB(), R=o.ramp; if(!R) return;
  var st=ONB_step(), w=ONB_next(R.lift), reps=st.r;
  R.sets.push({w:w, r:reps, fb:fb});
  if(fb==='nobar'){
    // They cannot move the empty bar on this pattern. That is not a small max - it means the
    // barbell version is the wrong exercise today, and the plan has to pick something scalable.
    o.res[R.lift]={belowBar:true, top:null, e1:null, pm:null};
    o.ramp=null; save(); render(); return;
  }
  if(fb==='stop'){ ONB_finish(); return; }

  // Answers are reps-in-reserve, not feelings. "Moderate" used to end the test, which is why a
  // genuinely submaximal single could be reported as a max: a set 8-10 reps from failure tells you
  // almost nothing about a 1RM, and sits outside the range where the RIR chart is valid.
  // Only a set within 2 reps of failure ends the test now.
  if(fb==='r2'||fb==='r1'){ ONB_finish(); return; }

  if(fb==='r34'){
    R.run=0;
    // close enough to estimate: let the chart set the target, then take one more step up
    var implied=e1rmFrom(w, reps, 4);
    if(implied) R.est=implied;
    R.idx=Math.max(R.idx,3);
    R.next=ONB_r5(R.est*0.92);
  } else {                       // "5 or more left" - still well short, keep climbing
    if(R.idx<2){ R.idx++; R.next=null; }
    else {
      // a single that leaves 5+ reps is at most ~80% of a true max, so the estimate must be higher
      var floor=Math.round(w/0.80);
      if(floor>R.est) R.est=floor;
      R.idx=Math.max(R.idx,3);
      // 12% steps, accelerating slightly while the answer stays "5 or more" so a badly wrong
      // starting guess converges without the 30% leap that used to sail past the real number
      R.run=(R.run||0)+1;
      R.next=ONB_r5(w*Math.min(1.25, 1.12+0.03*(R.run-1)));
    }
  }
  if(R.sets.length>=12){ ONB_finish(); return; }
  save(); render();
}
function ONB_finish(){
  var o=ONB(), R=o.ramp, top=null;
  // only a set within a couple of reps of failure is valid evidence of a maximum
  for(var i=R.sets.length-1;i>=0;i--){ var s2=R.sets[i];
    if(s2.fb==='r1'||s2.fb==='r2'){ top=s2; break; } }
  if(!top){ for(var j=R.sets.length-1;j>=0;j--){ if(R.sets[j].fb==='r34'){ top=R.sets[j]; break; } } }
  var approx=false;
  if(!top){ var ok=R.sets.filter(function(x){ return x.fb!=='stop'; });
    top=ok.length?ok[ok.length-1]:null; approx=true; }
  if(top){
    var rir=({r1:1, r2:2, r34:4, r5:4})[top.fb];
    if(rir==null) rir=4;
    var e1=e1rmFrom(top.w, top.r, rir);
    if(e1==null) e1=top.w;                        // outside the chart - fall back to the load itself
    var exp=(o.exp==='vet');
    var band=e1rmBand(e1, exp);
    // Training max. 90% of 1RM is the long-standing convention for percentage-based programming.
    // Novices sit lower because RIR accuracy is a trained skill and Helms (2016) advises against
    // basing progression on RIR alone until that accuracy is established - so we start under
    // the estimate and let the first weeks of real sets raise it.
    var tmFactor = exp?0.90 : (o.exp==='some'?0.87:0.85);

    o.res[R.lift]={top:top.w, reps:top.r, rir:rir, e1:e1, lo:band.lo, hi:band.hi,

}

  if(st==='limits'){ h+='<div class="block">'+ONB_LIMITS.map(function(l){
      return '<div class="onb-opt'+(o.limits.indexOf(l.id)>-1?' on':'')+'" data-onblim="'+l.id+'">'+l.t+'</div>'; }).join('')
    +(o.limits.indexOf('bp')>-1? '<div class="cue" style="padding:10px 0 0;color:var(--red)"><b>Get a doctor\u2019s clearance before starting.</b> The card will keep effort conversational and avoid breath-holding grinds, but it is a training aid, not medical advice.</div>':'')
    +'<div class="cue" style="padding:8px 0 0">Flagged joints get friendlier movements automatically. Nothing here stops you training.</div></div>'
    +'<div class="daybtn onb-go" data-onbnext="1">Continue</div>'; }

  if(st==='prefs'){
    o.prefs=o.prefs||{};
    h+='<div class="cue" style="padding:0 0 10px">Pick the version of each pattern you actually want '
      +'to do. The card still decides your sets, reps and weights \u2014 this just decides which movement '
      +'carries the load. Leave anything on the standard choice if you have no preference.</div>';
    Object.keys(PG_PREFS).forEach(function(mk){
      var g=PG_PREFS[mk];
      var chosen=o.prefs[mk]||g.opts[0];
      h+='<div class="block"><h3>'+g.label+'</h3>'
        +g.opts.map(function(nm,i){
            return '<div class="onb-opt'+(chosen===nm?' on':'')+'" data-onbpref="'+mk+'" data-prefname="'+esc(nm)+'">'
              +esc(nm)+(i===0?'<span class="onb-why">the standard choice</span>':'')
              +'</div>'; }).join('')
        +'</div>';
    });
    h+='<div class="cue" style="padding:0 0 8px">Anything other than the standard barbell lift is '
      +'prescribed as sets and reps rather than a percentage \u2014 your tested max describes the barbell '
      +'version, not a machine or a dumbbell.</div>'
      +'<div class="daybtn onb-go" data-onbnext="1">Continue</div>'; }

  if(st==='calibrate'){
    if(o.ramp){
      var L=ONB_LIFTS[o.ramp.lift], w=ONB_next(o.ramp.lift), rp=ONB_reps();
      var heavy=(w/o.ramp.est)>=0.70;
      h+='<div class="block" style="text-align:center">'
       +'<div class="eyebrow">'+L.n+' \u00b7 set '+(o.ramp.sets.length+1)+'</div>'
       +'<div class="onb-load">'+WV(w)+'<span> '+uLbl()+' \u00d7 '+rp+'</span></div>'
       // Show the bar loaded. Being told "185 x 5" and being shown which plates to slide on are
       // different asks - the second one you can just copy, which is the point during setup.
       +(function(){
          try{
            if(!/squat|bench|dead|ohp/.test(o.ramp.lift)) return '';
            var r=wuBarSVG(w, 76);
            if(!r || !r.svg) return '';
            return '<div class="onb-bar">'+r.svg
              +'<div class="onb-bar-cap">'
              +(r.unmatched
                 ? 'closest you can load with standard plates'
                 : (r.plates && r.plates.length
                    ? 'each side: '+r.plates.join(' + ')
                    : 'just the bar'))
              +'</div></div>';
          }catch(e){ return ''; }
        })()
       +'<div class="cue" style="padding:2px 0 10px">'+L.cue+' Do '+({1:'one rep',2:'two reps',3:'three reps',5:'five reps'}[rp]||rp+' reps')+', rack it, then answer honestly.</div>'
       +'<div style="font-weight:800;font-size:15px;margin-bottom:6px">How many MORE reps could you have done?</div>'
       +(heavy? '<div class="cue" style="padding:0 0 10px;color:var(--amber)"><b>Rest 2-3 minutes before this one.</b> Rushing the heavy sets is what makes the number wrong.</div>':'')
       +'<div class="onb-fb">'
       +'<div class="onb-opt" data-onbfb="r5">5 or more<span class="onb-why">still comfortable</span></div>'
       +'<div class="onb-opt" data-onbfb="r34">3 or 4<span class="onb-why">working now</span></div>'
       +'<div class="onb-opt" data-onbfb="r2">2<span class="onb-why">getting hard</span></div>'
       +'<div class="onb-opt" data-onbfb="r1">1 or none<span class="onb-why">that was all of it</span></div>'
       +'</div>'
       +'<div class="daybtn" data-onbfb="stop" style="margin-top:10px">Form broke - stop here</div>'
       +(o.ramp.sets.length===0
          ? '<div class="onb-restore" data-onbfb="nobar" style="margin-top:8px">'
            +'I could not lift this &mdash; <b>it is too heavy for me right now</b></div>'
          : '');
      if(o.ramp.sets.length) h+='<div class="cue" style="padding:10px 0 0">'+o.ramp.sets.map(function(s){
        return WV(s.w)+' \u00d7'+s.r+' - '+({r5:'5+ left',r34:'3-4 left',r2:'2 left',r1:'all of it',stop:'stopped'})[s.fb]; }).join('<br>')+'</div>';
      h+='</div>';
    } else {
      h+='<div class="block"><div class="cue" style="padding:0 0 8px">Warm up first: five easy minutes, then some empty-bar reps. '
        +'Each lift works up in a few sets, dropping reps as the weight climbs, and stops as soon as a set feels hard. '
        +'Rest 2-3 minutes before the heavy ones. Answer honestly - your answer is the measurement.</div></div>';
      ONB_ORDER.forEach(function(l){
        var r=o.res[l];
        h+='<div class="block"><div style="font-weight:800">'+ONB_LIFTS[l].n+'</div>'
         +(r? '<div class="cue" style="padding:6px 0 0">Top set '+r.top+' \u00d7'+r.reps+' \u00b7 estimated max '+r.lo+'-'+r.hi+' lb'
              +'<br>Starting training weights from '+r.pm+'. This is an estimate, not a measurement \u2014 the card corrects it from your real sets over the first two weeks.'
              +(r.approx? '<br><b>The test did not settle</b>, so this starts deliberately low.':'')+'</div>'
            : '<div class="daybtn" data-onbramp="'+l+'" style="margin-top:8px">Test it</div>')
         +'</div>';
      });
      if(done===ONB_ORDER.length) h+='<div class="daybtn onb-go" data-onbnext="1">Build my program</div>';
      else h+='<div class="cue">'+done+' of 4 done. Spread these over two or three sessions if you need to.</div>';
    }
  }

  if(st==='review'){
    h+='<div class="block"><div class="cue" style="padding:0">Your program is built from your own numbers. '
      +'Every load is a percentage of what you just lifted, and it climbs for five weeks before a deload.</div></div>'
      +'<div class="daybtn onb-go" data-onbfinish="1">Open my first session</div>';
  }
  return h;
}
function ONB_WIRE(){
  var q=function(sel,fn){ document.querySelectorAll(sel).forEach(function(el){ el.onclick=function(){ fn(el); }; }); };
  var o=ONB();
  q('[data-onbnext]',function(el){ if(el.className.indexOf('onb-off')>-1) return;
    o.step=Math.min(ONB_STEPS.length-1,o.step+1);
    if(ONB_STEPS[o.step]==='review'){ ONB_build(); return; }
    save(); render(); });
  q('[data-onbback]',function(el){
    var st=ONB_STEPS[o.step];
    if(st==='calibrate' && o.ramp){ o.ramp=null; save(); render(); return; }  // step out of the active lift test first
    o.step=Math.max(0, o.step-1);
    o.ramp=null;                                                                // never resume a half-finished ramp after stepping back
    save(); render(); });
  q('[data-onbskip]',function(el){
    var m=el.dataset.onbskip;
    if(m==='peek'){ o.skipPeek=true; save(); render(); return; }               // show the trade-off, one tap from starting light
    if(m==='cancel'){ o.skipPeek=false; o.step=Math.min(ONB_STEPS.length-1,o.step+1); save(); render(); return; } // talked them into setup
    if(m==='go'){ ONB_buildRaw(); return; } });                                 // start light, straight into training
  // Returning clients (new phone, reinstall) land here with a backup file in hand -
  // this is their door straight back into their card. restoreBackup replaces state
  // wholesale, so onboarding's own escape hatch (plan exists -> step aside) does the rest.
  var oR=document.getElementById('onbRestore'), oF=document.getElementById('onbRestoreFile');
  if(oR&&oF){ oR.onclick=function(){ oF.click(); };
    oF.onchange=function(){ if(oF.files&&oF.files[0]) restoreBackup(oF.files[0]); }; }
  q('[data-onbgoal]',function(el){ o.goal=el.dataset.onbgoal; save(); render(); });
  q('[data-onbsex]',function(el){ o.sex=el.dataset.onbsex; save(); render(); });
  q('[data-onbexp]',function(el){ o.exp=el.dataset.onbexp; save(); render(); });
  q('[data-onbemph]',function(el){ o.emph=el.dataset.onbemph; save(); render(); });
  q('[data-onbweak]',function(el){ o.weak=el.dataset.onbweak; save(); render(); });
  q('[data-onbwd]',function(el){
    var d=el.dataset.onbwd; if(!o.wd) o.wd=PG_defaultDays(o.days||4).slice();
    var i=o.wd.indexOf(d);
    if(i>-1) o.wd.splice(i,1);
    else if(o.wd.length<(o.days||4)) o.wd.push(d);
    else { o.wd.shift(); o.wd.push(d); }          // replace the oldest pick rather than refusing
    save(); render(); });
  q('[data-onbdays]',function(el){ o.days=+el.dataset.onbdays; o.wd=PG_defaultDays(o.days).slice(); save(); render(); });
  q('[data-onbpref]',function(el){ o.prefs=o.prefs||{};
    o.prefs[el.dataset.onbpref]=el.dataset.prefname; save(); render(); });
  q('[data-onblim]',function(el){ var id=el.dataset.onblim, i=o.limits.indexOf(id);
    if(i>-1) o.limits.splice(i,1); else o.limits.push(id); save(); render(); });
  q('[data-onbn]',function(el){ var k=el.dataset.onbn, d=+el.dataset.d;
    o[k]=Math.max(k==='age'?13:60, Math.min(k==='age'?85:500, Math.round((o[k]+d)*10)/10)); save(); render(); });
  // Bodyweight is a MEASUREMENT: 122 means 122, never the nearest 5. Loads computed from it
  // still plate-round downstream - measurements exact, prescriptions rounded.
  var oW=document.getElementById('onbWt');
  if(oW){ oW.onchange=function(){ var v=parseFloat(oW.value);
    if(isFinite(v)) o.wt=Math.max(60, Math.min(500, Math.round(v*10)/10)); save(); render(); };
    oW.onclick=function(ev){ ev.stopPropagation(); }; }
  q('[data-onbramp]',function(el){ var l=el.dataset.onbramp;
    o.ramp={lift:l, sets:[], est:ONB_seed(l), idx:0, next:null}; save(); render(); });
  q('[data-onbfb]',function(el){ if(!o.ramp) return; ONB_feedback(el.dataset.onbfb); });
  q('[data-onbfinish]',function(){ o.done=true; save(); render(); });
}
var ONB_RAW_MAXES={squat:75, bench:55, dead:95, ohp:45};   // deliberately light training-max floor: below an average adult female's lifts, safe for essentially anyone. Auto-calibration climbs from real sets.
function ONB_buildRaw(){
  // The "just start lifting" path: no questions, no calibration. Build a balanced, general 3-day plan
  // on the light floor and drop straight into training. Loads self-correct upward from logged sets.
  var o=ONB();
  o.goal=o.goal||'general'; o.days=o.days||3; o.exp=o.exp||'new';
  o.emph=o.emph||'balanced'; o.weak='auto'; o.limits=o.limits||[]; o.res=o.res||{};
  var plan=generatePlan({maxes:Object.assign({}, ONB_RAW_MAXES), goal:o.goal, days:o.days,
    limits:o.limits, emphasis:o.emph, weak:'auto', weekdays:null,   // this path never asks
    res:o.res||{}, prefs:o.prefs||{}});
  S.genPlan=plan; PLAN=plan;
  S.maxes=Object.assign({}, plan.maxes);
  S.day=plan.days[0].code; S.week=1; S.data={};
  o.done=true; o.skipPeek=false;
  save(); render();
}
function ONB_build(){
  var o=ONB();
  var maxes={};
  ONB_ORDER.forEach(function(l){ maxes[l]=(o.res[l]&&o.res[l].pm)||Math.round(o.wt*({squat:.6,bench:.45,dead:.8,ohp:.3})[l]); });
  // Every field the generator reads is passed here, explicitly, even where the value is null.
  // Omitting one does not fail loudly - it silently discards an answer the athlete gave, which
  // is how the preference, the below-the-bar swaps AND the priority lift all went missing.
  var plan=generatePlan({maxes:maxes, goal:o.goal, days:o.days||4, limits:o.limits,
    emphasis:o.emph||'balanced', weekdays:(o.wd&&o.wd.length===(o.days||4))? o.wd : null,
    weak:o.weak||'auto', res:o.res||{}, prefs:o.prefs||{}});
  S.genPlan=plan; PLAN=plan;
  S.maxes=Object.assign({}, plan.maxes);
  S.day=plan.days[0].code; S.week=1; S.data={};
  o.step=ONB_STEPS.indexOf('review');
  save(); render();
}

</script>
