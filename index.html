<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Session Card">
<meta name="theme-color" content="#1F4FD8" id="themeColor">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='42' fill='%231F4FD8'/><rect x='34' y='86' width='124' height='20' rx='8' fill='%23fff'/><rect x='26' y='68' width='20' height='56' rx='7' fill='%23fff'/><rect x='146' y='68' width='20' height='56' rx='7' fill='%23fff'/><rect x='12' y='78' width='14' height='36' rx='5' fill='%23fff' opacity='.75'/><rect x='166' y='78' width='14' height='36' rx='5' fill='%23fff' opacity='.75'/></svg>">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='42' fill='%231F4FD8'/><rect x='34' y='86' width='124' height='20' rx='8' fill='%23fff'/><rect x='26' y='68' width='20' height='56' rx='7' fill='%23fff'/><rect x='146' y='68' width='20' height='56' rx='7' fill='%23fff'/><rect x='12' y='78' width='14' height='36' rx='5' fill='%23fff' opacity='.75'/><rect x='166' y='78' width='14' height='36' rx='5' fill='%23fff' opacity='.75'/></svg>">
<title>Training Card</title>
<style>
:root{
  --bg:#F1F2F0; --panel:#FFFFFF; --panel2:#E7E9E6; --line:#D5D8D3;
  --chalk:#14171A; --dim:#5C6570; --faint:#8B949E;
  --amber:#1F4FD8; --amber-ink:#FFFFFF;
  --green:#1E7A46; --red:#C0392B;
  --accent-soft:color-mix(in srgb,var(--amber) 12%,var(--panel));
  --green-soft:color-mix(in srgb,var(--green) 14%,var(--panel));
  --red-soft:color-mix(in srgb,var(--red) 12%,var(--panel));
  --r:20px; --r-sm:14px; --r-xs:10px;
  --shadow:0 1px 2px rgba(20,23,26,.05),0 12px 28px -18px rgba(20,23,26,.3);
  --p45:#2E5FA3; --p35:#E8C33A; --p25:#3E8E4F; --p10:#15181C; --p5:#CFD3D6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
/* the one place raw text is meant to be long-pressed and copied - the backup/export fallback */
textarea,input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--chalk);
  font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Nunito",
    -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.mono{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 150px;
  padding-bottom:calc(140px + env(safe-area-inset-bottom));}

/* ---------- header ---------- */
header{padding:6px 2px 4px;}
.eyebrow{font-size:12px;letter-spacing:.02em;color:var(--faint);font-weight:700;text-transform:none;}
h1{margin:3px 0 0;font-size:26px;font-weight:800;letter-spacing:-.02em;text-transform:none;line-height:1.15;}
.sub{font-size:13.5px;color:var(--dim);margin-top:6px;font-weight:600;line-height:1.45;}

/* ---------- chips / tabs ---------- */
.pickers{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap;}
.chiprow{display:flex;gap:6px;flex:1;}
.roadtbl{width:100%;border-collapse:collapse;font-size:11px;}
.roadtbl th{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:center;padding:4px 5px;border-bottom:1px solid var(--line);}
.roadtbl th:first-child{text-align:left;}
.roadtbl td{padding:6px 5px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
.roadtbl td:first-child{text-align:left;font-weight:700;}
.roadtbl td.now{color:var(--amber);font-weight:800;}
.drbtn.exx{opacity:.7;}
.drbtn.exx.warn{background:var(--red);border-color:var(--red);color:#fff;opacity:1;}
.hdr-id{display:flex;align-items:center;gap:12px;}
.hdr-tx{flex:1;min-width:0;}
.ava-mini{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--line);flex:0 0 auto;}
.hdr-nm{font-size:.62em;font-weight:600;color:var(--dim);letter-spacing:0;}
/* The identity card: everything - ring included - drawn INSIDE its own borders.
   overflow:hidden is a guarantee, not a style: nothing about a profile may ever spill. */
.profcard{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:16px;margin:10px 0 4px;overflow:hidden;box-shadow:var(--shadow);}
.profcard.pc-edit{display:block;}
.prof-tx{flex:1;min-width:0;}
.prof-nm{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prof-tag{font-size:12px;color:var(--dim);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.prof-edit{font-size:11px;color:var(--faint);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 2px;align-self:flex-start;flex:0 0 auto;}
.profcard.pc-empty{gap:12px;}
.prof-hint{font-size:11px;color:var(--faint);flex:1;line-height:1.45;}
.prof-acts{display:flex;align-items:center;gap:8px;margin-top:12px;}
.ava-row{display:flex;align-items:center;gap:12px;margin-top:10px;}
.ava{width:58px;height:58px;border-radius:50%;background:var(--panel2);border:2.5px solid var(--amber);
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;flex:0 0 auto;box-sizing:border-box;}
.ava img{width:100%;height:100%;object-fit:cover;}
.ava-init{font-size:22px;font-weight:800;color:var(--dim);letter-spacing:.04em;}
.ava-fields{flex:1;min-width:0;}
.ava-rm{font-size:11px;color:var(--faint);text-decoration:underline;text-underline-offset:3px;cursor:pointer;margin-top:6px;padding:4px 0;}
/* the set to press: a slow amber breath; locked sets recede until it is their turn */
.set.up{border-color:var(--amber);animation:setBreath 2.2s ease-in-out infinite;}
@keyframes setBreath{0%,100%{box-shadow:0 0 0 0 rgba(230,177,80,0);}50%{box-shadow:0 0 0 4px rgba(230,177,80,.28);}}
.set.lk{opacity:.38;cursor:default;}
@media (prefers-reduced-motion: reduce){ .set.up{animation:none;box-shadow:0 0 0 2.5px rgba(230,177,80,.35);} }
.dayutil{text-align:center;margin:22px 0 6px;font-size:11px;color:var(--faint);}
.dayutil span[data-du]{cursor:pointer;padding:8px 6px;text-decoration:underline;text-underline-offset:3px;}
.dayutil span[data-du].warn{color:var(--red);font-weight:700;text-decoration:none;}
.du-dot{padding:0 4px;}
.tabrow{display:flex;gap:2px;margin:8px 2px 0;border-bottom:1px solid var(--line);}
.tab{flex:1;text-align:center;padding:8px 0 9px;font-size:11px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint);cursor:pointer;position:relative;}
.tab.on{color:var(--chalk);}
.tab.on::after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:2.5px;
  border-radius:2px;background:var(--amber);}
.chip{flex:1;min-width:42px;padding:12px 0;text-align:center;border:2px solid var(--line);
  border-radius:var(--r-sm);background:var(--panel);color:var(--dim);font-weight:800;font-size:14px;cursor:pointer;
  transition:transform .12s,background .18s,border-color .18s;}
.chip:active{transform:scale(.95);}
.chip.on{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);}
.weekrow .chip{font-size:13px;padding:10px 0;}

/* ---------- cards ---------- */
.ex,.block{margin-top:14px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);}
.block{padding:16px;}
.block h3{margin:0 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);font-weight:800;}
.ex-head{padding:18px 18px 0;}
.ex-name{font-size:21px;font-weight:800;letter-spacing:-.02em;text-transform:none;line-height:1.2;}
.subtag{display:inline-block;padding:5px 10px;border-radius:20px;font-size:10px;font-weight:800;
  letter-spacing:.04em;background:var(--accent-soft);color:var(--amber);vertical-align:2px;}

/* ---------- THE HERO: put this on the bar ---------- */
.target-label{font-size:11px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;
  font-weight:800;margin-top:16px;text-align:center;}
.ex-rx{display:block;margin-top:0;background:var(--panel2);border-radius:var(--r-sm);
  padding:16px 14px 14px;margin:8px 0 0;text-align:center;}
.ex-rx>.target-label{margin-top:0;}
.loadbtn{border:0;background:none;padding:0;color:var(--chalk);cursor:pointer;display:block;width:100%;
  text-align:center;font-family:inherit;}
.load{font-size:64px;font-weight:800;line-height:.94;letter-spacing:-.04em;
  font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums;}
.load small{font-size:17px;color:var(--dim);font-weight:700;letter-spacing:0;margin-left:5px;
  font-family:inherit;}
.rx{font-size:14px;color:var(--dim);margin-top:12px;font-weight:600;
  display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.rx b{color:var(--chalk);font-weight:800;}

/* ---------- plate diagram ---------- */
.sleeve{display:flex;align-items:center;justify-content:center;gap:2px;margin:14px auto 0;height:50px;}
.bar{width:30px;height:5px;background:#9AA3AC;border-radius:3px;}
.sleeve-label{font-size:12.5px;color:var(--dim);margin:9px 18px 0;font-weight:600;line-height:1.6;}
.ex-rx .sleeve-label{margin-left:0;margin-right:0;justify-content:center;}

/* ---------- warm-up, cue, notes ---------- */
.warm{font-size:13.5px;color:var(--dim);margin:12px 18px 0;padding:12px 14px;
  background:var(--panel2);border-radius:var(--r-sm);font-weight:600;line-height:1.5;}
.cue{font-size:14.5px;color:var(--chalk);padding:12px 18px 0;line-height:1.55;}
.ex .cue{margin:14px 18px 0;padding:14px 16px;background:var(--accent-soft);
  border-radius:var(--r-sm);font-weight:600;}
.exnote{font-size:13px;color:var(--dim);padding:10px 18px 0;line-height:1.55;font-style:normal;font-weight:600;}

/* ---------- sets ---------- */
.sets{display:flex;gap:9px;padding:16px 18px 18px;flex-wrap:wrap;}
.set{flex:1;min-width:56px;border:2px solid var(--line);border-radius:var(--r-sm);background:var(--panel);
  padding:12px 2px;text-align:center;cursor:pointer;transition:transform .12s,background .2s,border-color .2s;}
.set:active{transform:scale(.95);}
.set .n{font-size:9px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase;font-weight:800;}
.set .v{font-size:22px;font-weight:800;margin-top:2px;}
.set.hit{background:var(--green);border-color:var(--green);color:#fff;}
.set.hit .n{color:rgba(255,255,255,.75);}
.set.dev{background:var(--amber);border-color:var(--amber);color:var(--amber-ink);}
.set.dev .n{color:rgba(255,255,255,.75);}

/* ---------- editors ---------- */
.editor{display:none;padding:0 18px 18px;} .editor.open{display:block;}
.ed-row{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap;}
.ed-label{font-size:11px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase;
  width:82px;font-weight:800;}
.step{display:flex;align-items:center;gap:10px;}
.step button{width:50px;height:46px;border-radius:var(--r-xs);border:2px solid var(--line);
  background:var(--panel);color:var(--chalk);font-size:20px;font-weight:800;cursor:pointer;font-family:inherit;}
.step button:active{transform:scale(.94);}
.step .val{min-width:70px;text-align:center;font-size:18px;font-weight:800;}
.rirchips,.feelchips{display:flex;gap:7px;flex:1;}
.rirchips .rc,.feelchips .fc{flex:1;padding:12px 4px;border-radius:var(--r-xs);border:2px solid var(--line);
  background:var(--panel);color:var(--dim);font-weight:800;font-size:13px;cursor:pointer;font-family:inherit;}
.rirchips .rc.on,.feelchips .fc.on{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);}
.ed-done{width:100%;margin-top:14px;padding:15px;border-radius:var(--r-sm);border:0;background:var(--amber);
  color:var(--amber-ink);font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;}

/* ---------- inputs ---------- */
.dtin{background:var(--panel);border:2px solid var(--line);color:var(--chalk);border-radius:var(--r-xs);
  padding:12px;font-size:15px;font-family:inherit;font-weight:600;}
select.dtin{-webkit-appearance:none;appearance:none;}
textarea{width:100%;min-height:78px;background:var(--panel);border:2px solid var(--line);
  border-radius:var(--r-sm);color:var(--chalk);padding:12px;font-size:15px;font-family:inherit;resize:vertical;}
.cardio-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.toggle{padding:11px 15px;border-radius:var(--r-xs);border:2px solid var(--line);background:var(--panel);
  color:var(--dim);font-weight:800;font-size:13px;cursor:pointer;}
.toggle.on{background:var(--amber);color:var(--amber-ink);border-color:var(--amber);}
.daybtn{padding:13px 15px;border-radius:var(--r-sm);border:2px solid var(--line);background:var(--panel);
  color:var(--chalk);font-weight:800;font-size:14px;cursor:pointer;text-align:center;font-family:inherit;}
.savelog{margin-top:10px;padding:15px;border-radius:var(--r-sm);border:2px solid var(--line);
  background:var(--panel);color:var(--chalk);font-weight:800;font-size:14px;text-align:center;cursor:pointer;}

/* ---------- deload / banners ---------- */
.deload-banner{display:none;margin:12px 0 0;padding:14px 16px;border:2px dashed var(--amber);
  border-radius:var(--r-sm);color:var(--amber);font-size:13.5px;font-weight:700;background:var(--accent-soft);}
.deload .deload-banner{display:block;}

/* ---------- logs ---------- */
.logrow{display:flex;align-items:center;gap:9px;margin-top:8px;padding:13px;border:2px solid var(--line);
  border-radius:var(--r-sm);background:var(--panel);cursor:pointer;}
.log-date{font-size:13px;flex:1;font-weight:700;} .log-meta{font-size:12px;color:var(--faint);font-weight:600;}
.xbtn{width:36px;height:36px;border-radius:var(--r-xs);border:2px solid var(--line);background:var(--panel);
  color:var(--faint);font-size:16px;cursor:pointer;font-family:inherit;}
.logview{margin-top:8px;padding:14px;background:var(--panel2);border-radius:var(--r-sm);font-size:12px;
  white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;color:var(--dim);max-height:300px;overflow:auto;}
.stchip{font-size:10px;padding:4px 9px;border-radius:20px;background:var(--panel2);color:var(--faint);
  margin-left:6px;font-weight:800;}
.stchip.ok{color:var(--green);background:var(--green-soft);} .stchip.bad{color:var(--red);background:var(--red-soft);}

/* ---------- footer ---------- */
.footer{position:fixed;left:0;right:0;bottom:0;
  background:linear-gradient(180deg,rgba(241,242,240,0),var(--bg) 30%);
  padding:16px 16px calc(18px + env(safe-area-inset-bottom));}
.footer-inner{max-width:520px;margin:0 auto;display:flex;gap:10px;}
.copybtn{flex:1;padding:19px;border-radius:17px;border:0;background:var(--amber);color:var(--amber-ink);
  font-weight:800;font-size:16px;cursor:pointer;font-family:inherit;letter-spacing:-.01em;
  box-shadow:0 8px 20px -8px color-mix(in srgb,var(--amber) 60%,transparent);}
.resetbtn{padding:19px 20px;border-radius:17px;border:2px solid var(--line);background:var(--panel);
  color:var(--dim);font-weight:800;font-size:15px;cursor:pointer;font-family:inherit;}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:var(--chalk);
  color:var(--bg);border-radius:var(--r-sm);padding:13px 18px;font-size:14px;font-weight:700;opacity:0;
  transition:opacity .2s;pointer-events:none;z-index:70;box-shadow:var(--shadow);}
.toast.show{opacity:1;}

/* ---------- THE REST SCREEN takes the whole display ---------- */
.restchip{position:fixed;inset:0;z-index:65;background:var(--amber);color:var(--amber-ink);
  border:0;border-radius:0;display:flex;flex-direction:column;align-items:center;
  /* flex-start + margin:auto on the child: centers when short, scrolls when tall.
     justify-content:center CLIPS overflow at both ends - that was the cut-off clock. */
  justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch;
  text-align:center;padding:18px 24px calc(22px + env(safe-area-inset-bottom));cursor:pointer;min-width:0;}
.restchip.go{background:var(--green);color:#fff;}
/* final ten seconds: the clock brightens and breathes in time with the countdown beeps */
/* transition gauge: ambient edge bars, read at a glance with no numbers.
   Colour alone is a bad signal (red/green is the most common colour-blindness), so phase is
   encoded three ways at once: fill height, colour, and pulse rate. */
.tbar{position:fixed;top:0;bottom:0;width:7px;z-index:40;pointer-events:none;
  opacity:0;transition:opacity .45s ease;}
.tbar.l{left:0;} .tbar.r{right:0;}
.tbar.on{opacity:1;}
.tbar .fl{position:absolute;left:0;right:0;bottom:0;height:4%;border-radius:4px;
  transition:height .9s linear, background-color .7s ease, box-shadow .7s ease;}
/* Literal colours on purpose: this theme's --amber is #1F4FD8 (blue), so the drift phase used to
   render as a second blue and amber never appeared at all. The gauge owns its own palette. */
.tbar.ph-settle .fl{background:#3B82C4;box-shadow:0 0 10px 1px rgba(59,130,196,.55);}
.tbar.ph-ready  .fl{background:#16A34A;box-shadow:0 0 15px 2px rgba(22,163,74,.70);}
.tbar.ph-drift  .fl{background:#F59E0B;box-shadow:0 0 16px 2px rgba(245,158,11,.75);
  animation:tbpulse 2.4s ease-in-out infinite;}
.tbar.ph-cold   .fl{background:#DC2626;box-shadow:0 0 18px 3px rgba(220,38,38,.80);
  animation:tbpulse 1s ease-in-out infinite;}
@keyframes tbpulse{0%,100%{opacity:1;}50%{opacity:.5;}}
@media (prefers-reduced-motion:reduce){
  .grr .rp{animation:none!important;}
  .grr-bar{animation:none!important;}
  .breath-ring{animation:none!important;}.tbar .fl{animation:none!important;transition:none!important;}}
@media print{.tbar{display:none!important;}}
/* ---- the send-off: high five + coach's offer ---- */
/* the finisher panel: one prescription, one button */
.adjhd{text-align:center;border:2px solid var(--amber);}
.finpanel{border:2px solid var(--green);text-align:center;}
.finpanel.fin-over{border-color:var(--amber);}
.fin-hd{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:800;}
.fin-rx{font-size:15px;font-weight:800;margin-top:4px;}
.fin-clock{font-size:58px;font-weight:800;letter-spacing:-.03em;line-height:1;margin:10px 0 4px;}
.finpanel.fin-over .fin-clock{color:var(--green);}
.fin-sub{font-size:12.5px;color:var(--dim);line-height:1.5;max-width:320px;margin:0 auto;}
.fin-btns{margin-top:14px;}
.fin-go{display:block;width:100%;padding:16px;border-radius:13px;border:0;background:var(--green);
  color:#fff;font-family:inherit;font-size:15.5px;font-weight:800;cursor:pointer;}
.fin-go:active{transform:scale(.99);}
.fin-min{display:flex;gap:8px;margin-top:8px;}
.fin-alt{flex:1;padding:11px;border-radius:11px;border:2px solid var(--line);background:transparent;
  color:var(--dim);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;margin-top:8px;}
.hifive-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0 2px;}
.hifive{position:relative;width:96px;height:96px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;cursor:pointer;background:var(--green-soft);border:2px solid var(--green);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .3s;}
.hifive .hf-palm{font-size:44px;line-height:1;transform:rotate(-8deg);
  animation:hfwave 1.9s ease-in-out infinite;transform-origin:60% 90%;}
.hifive:active{transform:scale(.9);}
.hifive .hf-ring{position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--green);opacity:0;}
.hifive.on{background:var(--green);border-color:var(--green);transform:scale(1.04);}
.hifive.on .hf-palm{animation:hfslap .45s cubic-bezier(.34,1.56,.64,1);}
.hifive.on .hf-ring{animation:hfburst .62s ease-out;}
@keyframes hfwave{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(9deg);}}
@keyframes hfslap{0%{transform:scale(1) rotate(-8deg);}35%{transform:scale(1.3) rotate(6deg);}100%{transform:scale(1) rotate(0deg);}}
@keyframes hfburst{0%{opacity:.9;transform:scale(1);}100%{opacity:0;transform:scale(1.85);}}
.hf-cap{font-size:14.5px;font-weight:800;letter-spacing:-.01em;text-align:center;}
.fin{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}

/* ---- the coach: first-run walkthrough ---- */
#coachHost{position:fixed;inset:0;z-index:90;}
.coach-scrim{position:absolute;inset:0;background:transparent;animation:coachFade .35s ease both;}
/* only used when a step points at nothing - then we dim the whole screen instead */
.coach-scrim.full{background:rgba(8,10,14,.62);}
/* The element being explained is lifted above the dimming and left completely sharp - but it is
   a DEMONSTRATION, not a live control. Tapping it during the tour must never log anything into a
   real session, so it is inert while the coach is talking about it. */
/* No z-lift: the spotlight reveals through the shadow-punched hole, so targets stay at
   their natural depth. Lifting them above the host was how big targets covered the
   panel and the finger - the guide must never lose the layering fight. */
.coach-target{pointer-events:none!important;}
.coach-ct{font-size:11px;font-weight:700;color:var(--faint);letter-spacing:.04em;}
/* it presses itself in time with the finger, so the athlete sees the result without causing it */
.coach-target.demo{animation:coachPress 1.9s cubic-bezier(.3,.8,.3,1) .5s infinite;}
@keyframes coachPress{0%,60%,100%{transform:scale(1);filter:none;}
  72%{transform:scale(.965);filter:brightness(1.15);}
  84%{transform:scale(1);filter:none;}}
/* a finger that travels to the control and taps it */
.coach-finger{position:absolute;z-index:3;pointer-events:none;width:44px;height:44px;
  margin-left:-8px;animation:fingerIn .45s cubic-bezier(.2,1.1,.3,1) both;}
.coach-finger svg{display:block;animation:fingerTap 1.9s cubic-bezier(.3,.8,.3,1) .5s infinite;}
.coach-ripple{position:absolute;z-index:2;pointer-events:none;border-radius:50%;
  border:2.5px solid var(--amber);width:36px;height:36px;margin:-18px 0 0 -18px;opacity:0;
  animation:fingerRipple 1.9s ease-out .5s infinite;}
/* the spotlight is a transparent box with a giant shadow - the shadow IS the dimming */
.coach-spot{position:absolute;z-index:1;border-radius:16px;pointer-events:none;
  box-shadow:0 0 0 9999px rgba(8,10,14,.62), 0 0 0 3px var(--amber), 0 0 26px 6px rgba(31,79,216,.55);
  animation:coachSpot .45s cubic-bezier(.2,1.1,.3,1) both, coachRing 2.2s ease-in-out .5s infinite;
  transition:top .35s cubic-bezier(.2,.9,.25,1), left .35s cubic-bezier(.2,.9,.25,1),
             width .35s cubic-bezier(.2,.9,.25,1), height .35s cubic-bezier(.2,.9,.25,1);}
.coach-panel{position:absolute;z-index:4;max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch;left:12px;right:12px;max-width:460px;margin:0 auto;
  background:var(--panel);border:2px solid var(--amber);border-radius:20px;padding:18px;
  box-shadow:0 26px 60px -14px rgba(0,0,0,.6);
  animation:coachIn .5s cubic-bezier(.18,1.25,.35,1) both;}
.coach-panel.bottom{bottom:20px;}
.coach-panel.top{top:20px;}
.coach-row{display:flex;gap:14px;align-items:flex-start;}
.coach-av{flex:0 0 46px;animation:coachBob 3.2s ease-in-out infinite;}
.coach-whistle{animation:coachPip 3.2s ease-in-out infinite;transform-origin:center;}
.coach-txt{flex:1;min-width:0;animation:coachText .4s ease .08s both;}
.coach-t{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.2;}
.coach-b{font-size:14px;line-height:1.55;color:var(--dim);margin-top:6px;font-weight:600;}
.coach-dots{display:flex;gap:5px;margin:16px 0 12px;align-items:center;}
.coach-count{margin-left:auto;font-size:10px;color:var(--dim);font-weight:700;letter-spacing:.06em;}
.coach-dots i{height:4px;flex:1;border-radius:3px;background:var(--line);transition:background .3s,transform .3s;}
.coach-dots i.past{background:var(--amber);opacity:.45;}
.coach-dots i.on{background:var(--amber);transform:scaleY(2);}
.coach-btns{display:flex;gap:9px;}
.coach-b1{flex:2;padding:15px;border-radius:14px;border:0;background:var(--amber);color:var(--amber-ink);
  font-family:inherit;font-size:15.5px;font-weight:800;cursor:pointer;}
.coach-b2{flex:1;padding:15px;border-radius:14px;border:2px solid var(--line);background:transparent;
  color:var(--dim);font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;}
.coach-b1:active,.coach-b2:active{transform:scale(.97);}
.coach-skip{position:absolute;top:6px;right:6px;padding:8px 12px;border:0;background:none;
  color:var(--faint);font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;}
@keyframes coachFade{from{opacity:0;}to{opacity:1;}}
@keyframes coachIn{from{opacity:0;transform:translateX(58px) scale(.94);}to{opacity:1;transform:none;}}
@keyframes coachText{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
@keyframes coachSpot{from{opacity:0;transform:scale(1.1);}to{opacity:1;transform:none;}}
@keyframes coachRing{0%,100%{box-shadow:0 0 0 9999px rgba(8,10,14,.62),0 0 0 3px var(--amber),0 0 26px 6px rgba(31,79,216,.55);}
  50%{box-shadow:0 0 0 9999px rgba(8,10,14,.62),0 0 0 5px var(--amber),0 0 34px 10px rgba(31,79,216,.75);}}
@keyframes fingerIn{from{opacity:0;transform:translate(14px,18px) scale(.7);}to{opacity:1;transform:none;}}
@keyframes fingerTap{0%,55%,100%{transform:translate(0,0) scale(1);}
  62%{transform:translate(-3px,-9px) scale(1.06);}
  72%{transform:translate(0,3px) scale(.93);}
  82%{transform:translate(0,0) scale(1);}}
@keyframes fingerRipple{0%,60%{opacity:0;transform:scale(.4);}
  74%{opacity:.85;transform:scale(1);}
  100%{opacity:0;transform:scale(1.9);}}
@keyframes coachBob{0%,100%{transform:translateY(0) rotate(-2deg);}50%{transform:translateY(-5px) rotate(2deg);}}
@keyframes coachPip{0%,88%,100%{transform:scale(1);opacity:1;}92%{transform:scale(1.5);opacity:.75;}}
@media (prefers-reduced-motion:reduce){
  .coach-scrim,.coach-spot,.coach-panel,.coach-av,.coach-txt,.coach-whistle,
  .coach-finger,.coach-finger svg,.coach-ripple,.coach-target.demo{animation:none!important;}
  .coach-spot{transition:none!important;}
}

/* ================= FOCUS MODE ================= */
.deckhead{margin-top:14px;}

/* ================= PRINT SHEET ================= */
#printSheet{display:none;}
body.printing #printSheet{display:block;position:fixed;inset:0;z-index:9999;overflow:auto;
  background:#fff;color:#111;
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;}
/* Printing shows the sheet and nothing else. This was a hand-maintained list of things to hide,
   which meant every new body-level element (the mascot, the enlarged photo) silently started
   printing on the plan. Inverted: hide everything that is not the sheet, so anything added later
   is covered without anyone remembering to come back here. */
body.printing>*:not(#printSheet){display:none!important;}
.sh-toolbar{position:sticky;top:0;display:flex;gap:10px;padding:12px 16px;background:#f2f2ef;
  border-bottom:1px solid #ccc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}

  padding:11px 16px;font-weight:800;font-size:14px;cursor:pointer;}

  padding-bottom:9px;border-bottom:2.5px solid #111;}

  font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:#444;}
.sh-who{font-size:23pt;font-weight:700;line-height:1.1;margin-top:2px;letter-spacing:-.01em;}
.sh-meta{font-size:10pt;color:#555;margin-top:3px;}
.sh-r{text-align:right;flex:0 0 auto;}
.sh-wk{font-size:20pt;font-weight:700;line-height:1;}
.sh-wk span{font-size:11pt;font-weight:400;color:#666;}
.sh-dates{font-size:10pt;color:#555;margin-top:3px;}
.sh-badge{display:inline-block;margin-top:6px;padding:3px 9px;border:1.5px solid #111;border-radius:3px;
  font-size:8.5pt;font-weight:700;letter-spacing:.12em;
  font-family:-apple-system,"Segoe UI",Roboto,sans-serif;}
.sh-bar{margin-top:9px;font-size:10pt;color:#222;padding:7px 10px;background:#f4f4f1;border-radius:4px;}
.sh-bar b{letter-spacing:.06em;text-transform:uppercase;font-size:8.5pt;color:#555;
  font-family:-apple-system,"Segoe UI",Roboto,sans-serif;}
.sh-note{margin-top:8px;font-size:9.5pt;font-style:italic;color:#444;

.sh-day{margin-top:15px;break-inside:avoid;page-break-inside:avoid;}

.sheet table{width:100%;border-collapse:collapse;}

  font-weight:700;text-align:left;padding:0 6px 4px;border-bottom:1.5px solid #111;
  font-family:-apple-system,"Segoe UI",Roboto,sans-serif;}
.sheet tbody td{padding:7px 6px;border-bottom:1px solid #ddd;vertical-align:top;font-size:10.5pt;}
.sheet tbody tr:nth-child(even) td{background:#fafaf8;}
.c-n{width:9%;text-align:center;font-variant-numeric:tabular-nums;}
.sheet thead .c-n{text-align:center;}
.c-w{width:19%;font-variant-numeric:tabular-nums;font-weight:700;}

@page{ size:letter portrait; margin:12mm; }
@media print{
  html,body{background:#fff!important;}
  body.printing #printSheet{position:static;overflow:visible;}
  .noprint,.sh-toolbar{display:none!important;}
  .sheet{max-width:none;margin:0;padding:0;}
  .sheet tbody tr:nth-child(even) td{background:transparent;}
  .sh-day{margin-top:11px;}
  a[href]:after{content:"";}
}






.rest-in{width:100%;max-width:400px;text-align:center;margin:auto 0;}   /* centers short content, yields to scroll when tall */
.rest-clock{font-size:88px;font-weight:800;line-height:.9;letter-spacing:-.04em;}
.rest-cap{font-size:12px;letter-spacing:.2em;font-weight:800;opacity:.72;margin-top:8px;text-transform:uppercase;}
.rest-next{font-size:16px;font-weight:700;margin-top:20px;line-height:1.45;opacity:.96;}
.rest-edit{margin-top:22px;background:rgba(255,255,255,.16);border-radius:16px;padding:14px 14px 16px;}
.rest-lab{font-size:11.5px;font-weight:700;opacity:.8;line-height:1.4;}
.rest-row{display:flex;align-items:center;gap:9px;margin-top:11px;justify-content:center;}
.rest-k{font-size:10px;letter-spacing:.13em;font-weight:800;opacity:.72;width:72px;text-align:left;
  text-transform:uppercase;}
.rest-step{width:48px;height:44px;border-radius:12px;border:2px solid currentColor;background:transparent;
  color:inherit;font-size:22px;font-weight:800;font-family:inherit;cursor:pointer;}
.rest-step:active{transform:scale(.93);}
.rest-val{min-width:56px;font-size:26px;font-weight:800;}
/* Ghost reps: the RIR answer drawn as what it means - reps taken solid, reps left in the
   tank dashed, and the wall at the end is failure. The pulse sweeps left to right with a
   SLOWING cadence (Jerry's design): quick through the early reps, stretching toward the tank,
   the way rep spacing grows as the bar slows in a real hard set. Anchored to wall-clock time
   so the once-a-second rest repaint resumes the wave instead of restarting it. */
.grr{display:flex;align-items:center;justify-content:center;gap:6px;margin:2px 0 4px;flex-wrap:wrap;}
.grr-stage{position:relative;width:34px;height:30px;flex:0 0 auto;margin-right:2px;}
.grr-bar{position:absolute;left:2px;bottom:2px;width:30px;height:10px;will-change:transform;}
.grr .rp{width:13px;height:13px;border-radius:50%;background:currentColor;}
.grr .rp.ghost{background:transparent;border:2px dashed currentColor;opacity:.55;width:11px;height:11px;}
.grr .rp-wall{width:4px;height:20px;border-radius:2px;background:currentColor;opacity:.9;margin-left:2px;}
.grr-cap{font-size:10.5px;opacity:.85;text-align:center;margin-bottom:8px;}
@keyframes grrP{0%{transform:scale(1);opacity:1;}3.5%{transform:scale(1.4);}7%{transform:scale(1);}100%{transform:scale(1);}}
@keyframes grrPg{0%{transform:scale(1);opacity:.55;}3.5%{transform:scale(1.4);opacity:.95;}7%{transform:scale(1);opacity:.55;}100%{transform:scale(1);opacity:.55;}}
.rest-loaded{margin:8px 0 0;}
.rest-lw{font-size:30px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;cursor:pointer;}
/* The rest screen's field IS amber - anything drawn on it speaks amber-ink or it vanishes.
   (v1 drew these amber-on-amber: present, tappable, invisible. Jerry found them by feel.) */
.ra-hint{font-size:10px;font-weight:600;color:var(--amber-ink);opacity:.55;letter-spacing:.04em;}
.rest-adj{display:flex;align-items:center;justify-content:center;gap:14px;}
.ra-b{min-width:52px;padding:12px 0;border-radius:12px;border:2px solid var(--amber-ink);background:transparent;
  color:var(--amber-ink);font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;}
.ra-b:active{background:var(--amber-ink);color:var(--amber);}
.rest-go,.rest-kill,.wipe-fire{position:relative;overflow:hidden;}
.rest-go.holding::after,.rest-kill.holding::after,.wipe-fire.holding::after{content:"";position:absolute;inset:0;
  background:rgba(0,0,0,.22);transform-origin:left;transform:scaleX(0);
  animation:holdFill var(--hd,650ms) linear forwards;animation-delay:var(--he,0ms);}
@keyframes holdFill{from{transform:scaleX(0);}to{transform:scaleX(1);}}
@media (prefers-reduced-motion: reduce){
  .rest-go.holding::after,.rest-kill.holding::after,.wipe-fire.holding::after{animation:none;transform:scaleX(1);opacity:.15;} }
.wipe-link{font-size:12.5px;color:var(--faint);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 4px;}

  background:var(--red-soft);color:var(--red);font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;}
.wipe-fire.holding{background:var(--red);color:#fff;}
.rest-lw small{font-size:13px;font-weight:700;opacity:.8;margin-left:4px;}

.rest-cue{font-size:11px;font-style:italic;opacity:.8;margin-top:8px;line-height:1.45;max-width:300px;margin-left:auto;margin-right:auto;}
.rest-ext{display:block;margin:12px auto 2px;padding:9px 18px;border:2px solid currentColor;border-radius:11px;

.onb-back{display:inline-block;font-size:12.5px;font-weight:700;color:var(--dim);cursor:pointer;padding:2px 2px 10px;letter-spacing:.02em;-webkit-tap-highlight-color:transparent;}

.vol-fix{grid-column:2/-1;justify-self:start;font-size:11.5px;font-weight:700;color:var(--amber);cursor:pointer;padding:1px 0 3px;-webkit-tap-highlight-color:transparent;}
/* ===== anatomy map ===== */
.ana-wrap{margin:2px 0 14px;}
.ana-chart{position:relative;width:100%;border-radius:12px;overflow:hidden;background:#fff;}
.ana-zoom{position:absolute;transition:width .3s ease,height .3s ease,left .3s ease,top .3s ease;}
.ana-img{display:block;width:100%;height:100%;}
.ana-heat{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:hard-light;}
.ana-views{margin-top:10px;}
.ana-heat ellipse{transition:opacity .45s ease,fill .45s ease;}
.ana-key{display:flex;justify-content:center;align-items:center;gap:9px;margin-top:12px;}
.ana-key span{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--dim);}

.ana-sex{display:flex;justify-content:center;gap:6px;margin-top:9px;}
.ana-chip{font-size:11px;font-weight:700;color:var(--dim);border:1px solid var(--line);border-radius:999px;

.ana-chip.on{color:var(--amber);border-color:var(--amber);}
@media (prefers-reduced-motion: reduce){ .ana-heat ellipse{transition:none} }
.vol-reset{margin-top:10px;font-size:12px;font-weight:700;color:var(--dim);cursor:pointer;display:inline-block;padding:4px 0;-webkit-tap-highlight-color:transparent;}

/* ===== how-to clips ===== */
.hw-btn{display:inline-block;margin-left:8px;font-size:10.5px;font-weight:800;letter-spacing:.06em;

.hw-sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--panel);

@media (prefers-reduced-motion: reduce){

/* ===== gummy bear ===== */
#gbHost{position:fixed;left:0;top:0;z-index:80;width:114px;height:195px;touch-action:none;cursor:grab;
  will-change:transform;filter:drop-shadow(0 7px 15px rgba(0,0,0,.45));-webkit-tap-highlight-color:transparent;}
#gbHost:active{cursor:grabbing;}
.gb-stage{position:relative;width:100%;height:100%;transform-origin:50% 92%;}
.gb-view{position:absolute;inset:0;display:none;}
.gb-view.on{display:block;}
.gb-base{position:absolute;inset:0;background:var(--gbimg) center/contain no-repeat;}
.gb-tail{position:absolute;inset:0;pointer-events:none;
  background:var(--gbtail) center/contain no-repeat;
  animation:gbWag 1.1s ease-in-out infinite;}
@keyframes gbWag{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(11deg)}}
.gb-glow{position:absolute;inset:0;-webkit-mask:var(--gbimg) center/contain no-repeat;
  mask:var(--gbimg) center/contain no-repeat;mix-blend-mode:screen;pointer-events:none;}
.gb-glow svg{display:block;width:100%;height:100%;}
.gb-r{opacity:0;transition:opacity .55s ease;transform-box:fill-box;transform-origin:center;}
.gb-lids{position:absolute;inset:0;pointer-events:none;}
.gb-lids svg{display:block;width:100%;height:100%;}
.gb-lid{transform-box:fill-box;transform-origin:50% 50%;transform:scaleY(0);
  animation:gbBlink 6.4s ease-in-out infinite;}
@keyframes gbBlink{0%,93.0%{transform:scaleY(0)}94.2%{transform:scaleY(1.05)}
  95.4%{transform:scaleY(0)}96.6%{transform:scaleY(1.05)}97.8%,100%{transform:scaleY(0)}}
#gbHost.gb-pose .gb-r.on{opacity:var(--i,.9);animation:gbPulse 1.8s ease-in-out infinite;}
@keyframes gbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
/* Parked at the edge he leans out every few seconds, has a look around, and tucks back in.
   A CSS animation outranks the inline transform the physics loop writes, so this only plays
   while docked - the moment he is grabbed the class comes off and the springs take over. */
/* 25s apart, but the peek itself still takes ~2s - stretching it across the whole cycle would
   turn a glance into a slow crawl. He is tucked away for 91% of the loop. */
#gbHost.gb-docked .gb-stage{animation:gbPeek 25s ease-in-out infinite;}
@keyframes gbPeek{
  0%,91%{transform:translateX(0) rotate(0)}
  93.2%{transform:translateX(38px) rotate(6deg)}
  95%{transform:translateX(34px) rotate(-4deg)}
  96.8%{transform:translateX(37px) rotate(3deg)}
  98.5%{transform:translateX(30px) rotate(-2deg)}
  100%{transform:translateX(0) rotate(0)}}
@media (prefers-reduced-motion: reduce){
  #gbHost.gb-docked .gb-stage{animation:none}
  #gbHost.gb-pose .gb-r.on{animation:none}
  .gb-lid{animation:none}
  .gb-tail{animation:none}
}

/* ---- audit: tap targets ----
   These read as small text controls but must still be hittable with a sweaty thumb. The hit box
   is expanded with a pseudo-element so the LAYOUT does not move; guidance is 44px, these reach
   ~40px vertically. Row-adjacent controls grow vertically only, so neighbours cannot overlap. */
.hw-btn,.vol-fix,.vol-reset,.ana-chip,.calc-x,.ava-rm,.prof-edit,.tab{position:relative;}
.hw-btn::after,.vol-fix::after,.vol-reset::after,.ana-chip::after,.calc-x::after,
.ava-rm::after,.prof-edit::after{content:"";position:absolute;inset:-12px -10px;}
.tab::after{content:"";position:absolute;inset:-8px 0;}

/* ---- audit: reduced motion ----
   36 animations were declared and only some were individually guarded. This is the catch-all:
   anyone who asks their phone for less motion gets none of it, anywhere. Targeted rules further
   up still handle the cases where the CONTENT must survive the animation being removed. */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important;scroll-behavior:auto!important;}
}

/* ---- press response ----
   Two separate things make a button feel slow, and only one of them is render speed.
   1. touch-action:manipulation tells the browser this is not a double-tap-to-zoom target, so it

   2. The press must SHOW immediately. :active fires on touchdown, before any JavaScript runs, so

.set,.savelog,.toggle,.chip,.tab,.daybtn,.hw-btn,.rpt-kind,.ros-row,.ana-chip,

@media (prefers-reduced-motion: reduce){

<body>
<div class="wrap" id="app"></div>
<div class="footer"><div class="footer-inner" id="footInner"></div></div>
<div id="handlers" hidden><button class="copybtn" id="copyBtn">Copy error report</button><button class="resetbtn" id="resetBtn">Reset day</button></div>
<div class="toast" id="toast"></div>
<div class="restchip" id="restTick" style="display:none"></div>
<script>
// ================= STORAGE =================
// The host's storage bridge can fail or answer in ways we do not expect. None of
// that should crash the app, alarm the user on a first run, or silently eat a session.
var stBroken=false, stWarned=false, stLastErr='';
function stFresh(msg){ return /missing|not ?found|no such|undefined|unexpected response|no value|null/i.test(String(msg||'')); }
// ===== WHERE DATA ACTUALLY LIVES =====
// Three possibilities, decided once at boot:
//   bridge  - running inside Claude, which provides window.storage
//   local   - a hosted or local page with a usable localStorage
//   none    - storage is blocked (private browsing, or a file:// page on iOS)
// The third case used to be silent: the card looked like it was saving and wrote nothing at all.
// It now says so plainly, because losing a training log without warning is the worst outcome here.
var ST_MODE=window.ST_MODE=(function(){
  try{ if(window.storage&&window.storage.get) return 'bridge'; }catch(e){}
  try{
    var probe='__st_probe__';
    window.localStorage.setItem(probe,'1');
    if(window.localStorage.getItem(probe)!=='1') return 'none';
    window.localStorage.removeItem(probe);
    return 'local';
  }catch(e){ return 'none'; }
})();
function stLocalKey(k){ return 'nsc:'+k; }
async function stGet(k){
  if(ST_MODE==='local'){
    try{ var v=window.localStorage.getItem(stLocalKey(k)); return v==null? null : v; }catch(e){ return null; }
  }
  if(ST_MODE==='none') return null;
  if(!window.storage||!window.storage.get) return null;
  for(var a=0;a<2;a++){
    try{ var r=await window.storage.get(k);
      if(r&&typeof r.value==='string') return r.value;
      if(r&&r.value!=null) return String(r.value);
      return null;                                  // answered, but empty: treat as no data
    }catch(e){ stLastErr=String(e&&e.message||e);
      if(stFresh(stLastErr)) return null;           // no data yet is not a fault
      if(a===0) await new Promise(function(r2){ setTimeout(r2,120); });
    }
  }
  return null;
}
async function stSet(k,v){
  if(ST_MODE==='local'){
    try{ window.localStorage.setItem(stLocalKey(k), v); if(stBroken) stRecover(); return true; }
    catch(e){ stLastErr=String(e&&e.message||e); stFail(); return false; }   // quota, usually
  }
  if(ST_MODE==='none'){ stFail(); return false; }
  if(!window.storage||!window.storage.set){ stFail(); return false; }
  for(var a=0;a<2;a++){
    try{ await window.storage.set(k,v); if(stBroken) stRecover(); return true; }
    catch(e){ stLastErr=String(e&&e.message||e);
      if(a===0) await new Promise(function(r){ setTimeout(r,150); }); }
  }
  stFail(); return false;
}
async function stDel(k){
  if(ST_MODE==='local'){ try{ window.localStorage.removeItem(stLocalKey(k)); }catch(e){} return; }
  try{ if(window.storage&&window.storage.delete) await window.storage.delete(k); }catch(e){}
}
async function stList(p){
  if(ST_MODE==='local'){
    try{ var out=[], pre=stLocalKey(p||'');
      for(var i=0;i<window.localStorage.length;i++){ var kk=window.localStorage.key(i);
        if(kk&&kk.indexOf(pre)===0) out.push(kk.slice(4)); }
      return out; }catch(e){ return []; }
  }
  if(ST_MODE==='none') return [];
  try{ if(!window.storage||!window.storage.list) return [];
    var r=await window.storage.list(p); return (r&&r.keys)||[]; }catch(e){ return []; }
}
var stFails=0;
function stFail(){                       // a single blip on a flaky connection is not a diagnosis
  stBroken=true; stFails++;
  if(stFails<2||stWarned) return;
  stWarned=true; try{ stBanner(); }catch(e){}
}
function stFailHard(){                   // the probe is authoritative: storage really is unavailable
  stBroken=true; stFails=99;
  if(stWarned) return; stWarned=true; try{ stBanner(); }catch(e){}
}

// ===== AUTO-CALIBRATION FROM REAL SETS =====
// The onboarding ramp is a starting hypothesis, not a measurement. Actual working sets are far
// better evidence: more of them, at prescribed rep ranges, under normal fatigue. Once a lift has
// enough logged evidence, its training max is revised from performance and the initial guess stops
// mattering. This is the standard autoregulation idea - Helms et al. (2018) found RPE-driven load
// adjustment produced strength outcomes at least as good as fixed percentage prescription.
const AC_MIN_SETS=3;        // evidence required before touching a training max
const AC_MAX_JUMP=0.15;     // never move a max more than 15% at once
function autoCalibrate(){
  try{
    if(!S.genPlan || !S.genPlan.days) return null;      // only for generated programs
    if(!S.e1rmH) return null;
    var changed=[];
    Object.keys(S.maxes||{}).forEach(function(k){
      var H=(S.e1rmH[k]||[]).filter(function(x){
        // measured session-date to session-date, like every other evidence window - wall-clock
        // maths made morning sets invisible to auto-calibration until after noon
        var age=(new Date(shiftDate()+'T12:00:00').getTime()-new Date(x.d+'T12:00:00').getTime())/86400000;
        return age>=0 && age<=28; });
      if(H.length<AC_MIN_SETS) return;
      // RIR judgement is most reliable close to failure, so prefer that evidence when there is
      // enough of it and fall back to everything only when there is not.
      var near=H.filter(function(x){ return x.r!=null && x.r<=2; });
      if(near.length>=AC_MIN_SETS) H=near;
      // median of recent estimates: one fluke set should not move a training max
      var vals=H.map(function(x){ return x.v; }).sort(function(a,b){ return a-b; });
      var med=vals[Math.floor(vals.length/2)];
      var factor=(S.onb&&S.onb.exp==='vet')?0.90:(S.onb&&S.onb.exp==='some'?0.87:0.85);
      var want=Math.round(med*factor/5)*5;
      var cur=S.maxes[k];
      if(!cur||!want) return;
      var delta=(want-cur)/cur;
      if(Math.abs(delta)<0.04) return;                  // inside the noise band, leave it alone
      var capped=Math.round(cur*(1+Math.max(-AC_MAX_JUMP,Math.min(AC_MAX_JUMP,delta)))/5)*5;
      if(capped===cur) return;
      S.maxes[k]=capped;
      changed.push({k:k, from:cur, to:capped, n:H.length});
    });
    if(!changed.length) return null;
    applyMaxesToPlan();
    S.acLog=(S.acLog||[]).concat([{d:shiftDate(), changed:changed}]).slice(-12);
    save();
    return changed;
  }catch(e){ return null; }
}

    S.genPlan.maxes=Object.assign({}, S.maxes);

// ===== RIR CALIBRATION DRILL =====
// The largest error in this whole system is not the maths, it is the number the lifter reports.
// Steele et al. (2017) found novices underestimate reps remaining by ~4-5 and experienced lifters
// by ~1-2, which means RIR-based prescriptions land lighter than intended. Helms et al. (2016)
// give the remedy: take a set, predict your proximity to failure, then verify it against actual
// failure, and repeat until the estimate sharpens.
//
// Protocol here is a SINGLE set to failure rather than two sets. Two sets at the same load
// confounds the comparison, because the second is performed fatigued and understates capacity.
// Instead: go to failure, and remember the rep at which you believed two remained. Actual RIR at
// that moment is (total reps - that rep), so the measurement comes free of any fatigue penalty.
//
// Isolation movements only. Nobody is asked to take a heavy barbell lift to failure for this.
const RIR_DRILL_DAYS=42;      // roughly every six weeks, per the "practice until accurate" advice
const RIR_DRILL_EX=[
 {n:'Hammer Curls', hint:'Pick a weight you could get about 12-15 times.'},
 {n:'Rope Pushdowns', hint:'Pick a weight you could get about 12-15 times.'},
 {n:'Lateral Raises', hint:'Light. This one gets hard faster than you expect.'},
 {n:'Seated Leg Curl', hint:'Pick a weight you could get about 12-15 times.'}
];
function rirLog(){ if(!S.rirLog) S.rirLog=[]; return S.rirLog; }
// Positive bias = they stop earlier than they think, i.e. more left in the tank than reported.
function rirBias(){
  try{
    var L=rirLog().slice(-3); if(!L.length) return 0;
    var sum=0; L.forEach(function(x){ sum+=(x.actual-x.pred); });
    var b=sum/L.length;
    return Math.max(-2, Math.min(4, Math.round(b*10)/10));
  }catch(e){ return 0; }
}
// Apply the personal correction to a reported RIR before it reaches the chart.
function rirAdjust(reported){
  var b=rirBias();
  if(!b) return reported;
  return Math.max(0, Math.min(4, Math.round(reported+b)));
}
function rirDrillDue(){

// ===== SCHEDULE HELPERS =====
// Present only when the plan carries a weekday map. Builds without one behave exactly as before.
function schedTodayCode(){
  // Kept deliberately: schedMap() returns null since the move to a weekday-free rotation, so this
  // always returns null. test-schedule asserts exactly that - it is the tripwire proving nothing
  // calendar-derived drives the session pointer. Do not delete it as "dead code".
  var m=schedMap(); if(!m) return null;
  var idx=new Date(shiftDate()+'T12:00:00').getDay();      // 0=Sun
  var key=['SU','MO','TU','WE','TH','FR','SA'][idx];
  return m[key]||null;
}
function schedMap(){ return null; }   // weekday scheduling removed — kept as a null accessor so every no-map fallback below stays live
// ===== SESSION ROTATION (weekday-free) =====
// You do sessions in order and the card points at the next one you have not yet saved a log
// for THIS block. Nothing is tied to a weekday: a missed day just shifts the whole rotation right.
function sessionLogged(week, code){
  var C=cyc();
  return (logKeys||[]).some(function(k){
    var m=k.slice(LOGP.length).match(/-([A-Za-z]+)-W(\d+)B(\d+)$/);   // DATE-CODE-WweekBcycle
    return !!m && (+m[3])===C && (+m[2])===week && m[1]===code;
  });
}
function nextSession(){
  try{
    var codes=PLAN.days.map(function(d){ return d.code; }), W=PLAN.weeks;
    for(var w=1; w<=W; w++) for(var i=0;i<codes.length;i++)
      if(!sessionLogged(w, codes[i])) return {week:w, code:codes[i]};
  }catch(e){}
  return null;                        // every session this block is banked — block-end review takes over
}
function syncToNext(){
  // On open, land on the next unsaved session. Never hijack a tab (YOU/RATE/CAL/PLAN) or a
  // session still in progress (no saved log yet) — only advance once the current one is banked.
  try{
    if(!PLAN.days.some(function(d){ return d.code===S.day; })) return;
    if(!sessionLogged(S.week, S.day)) return;
    var nx=nextSession(); if(nx){ S.day=nx.code; S.week=nx.week; }
  }catch(e){}
}
function nextLineHTML(){
  try{
    var nx=nextSession();
    if(!nx) return '<div class=\"sub\" style=\"margin-top:6px\">Block complete \u2014 the PLAN tab has your review and the next block.</div>';
    var d=PLAN.days.filter(function(x){ return x.code===nx.code; })[0]; if(!d) return '';
    var here=(nx.code===S.day && nx.week===S.week);
    return '<div class=\"sub\" style=\"margin-top:6px\">Next up: Week '+nx.week+' \u00b7 '+esc(d.title)
      +(here? ' \u00b7 you\u2019re on it' : ' \u00b7 <span class=\"toggle\" data-nextgo=\"1\" style=\"padding:2px 8px;font-size:11px\">open it</span>')+'</div>';
  }catch(e){ return ''; }
}
function schedFor(code){
  var m=schedMap(); if(!m) return null;
  var out=null; Object.keys(m).forEach(function(d){ if(m[d]===code) out=d; });
  return out;
}

// ===== FLOATING CALCULATOR =====
// Mid-session you often need one number - 80% of something, two plates plus a change, how many
// left to hit a rep target. Leaving the app to find the phone calculator loses your place and,
// on iOS, can suspend the audio that runs the rest timer. This keeps it in-app.
// Sits above the rest chip on purpose: rest is exactly when you do the arithmetic.
var CALC={open:false, cur:'0', acc:null, op:null, fresh:true};
function calcFmt(v){
  if(v===null||v===undefined||v==='') return '0';
  var n=(typeof v==='number')? v : parseFloat(v);
  if(!isFinite(n)) return 'error';
  if(typeof v==='string' && /\.$|\.\d*0$/.test(v)) return v;   // preserve a trailing decimal being typed
  var r=Math.round(n*1e6)/1e6;
  return String(r);
}
function calcApply(){
  if(CALC.op===null||CALC.acc===null) return parseFloat(CALC.cur)||0;
  var a=CALC.acc, b=parseFloat(CALC.cur)||0, r=a;
  if(CALC.op==='+') r=a+b;
  else if(CALC.op==='-') r=a-b;
  else if(CALC.op==='*') r=a*b;
  else if(CALC.op==='/') r=(b===0? NaN : a/b);
  return r;
}
function calcKey(k){
  try{
    if(k==='C'){ CALC={open:true, cur:'0', acc:null, op:null, fresh:true}; return; }
    if(k==='back'){
      if(CALC.fresh) return;
      CALC.cur=CALC.cur.length>1? CALC.cur.slice(0,-1) : '0';
      if(CALC.cur==='-'||CALC.cur==='') CALC.cur='0';
      return;
    }
    if(k==='.'){
      if(CALC.fresh){ CALC.cur='0.'; CALC.fresh=false; return; }
      if(CALC.cur.indexOf('.')<0) CALC.cur+='.';
      return;
    }
    if(/^[0-9]$/.test(k)){
      if(CALC.fresh||CALC.cur==='0'){ CALC.cur=k; CALC.fresh=false; }
      else if(CALC.cur.length<12) CALC.cur+=k;
      return;
    }
    if(k==='+'||k==='-'||k==='*'||k==='/'){
      if(CALC.op!==null && !CALC.fresh){ CALC.acc=calcApply(); CALC.cur=calcFmt(CALC.acc); }
      else CALC.acc=parseFloat(CALC.cur)||0;
      CALC.op=k; CALC.fresh=true;
      return;
    }
    if(k==='='){
      if(CALC.op!==null){ var r=calcApply(); CALC.cur=calcFmt(r); CALC.acc=null; CALC.op=null; CALC.fresh=true; }
      return;
    }
    if(k==='%'){
      // 225 x 80 % -> 80% of 225, which is how a lifter reads it. Bare % divides by 100.
      var c=parseFloat(CALC.cur)||0;
      if(CALC.op!==null && CALC.acc!==null) CALC.cur=calcFmt(CALC.acc*(c/100));
      else CALC.cur=calcFmt(c/100);
      CALC.fresh=true;
      return;
    }
    if(k==='r5'){ var v=parseFloat(CALC.cur)||0, r5=isKg()?2.5:5; CALC.cur=calcFmt(Math.round(v/r5)*r5); CALC.fresh=true; return; }
    if(k==='r25'){ var v2=parseFloat(CALC.cur)||0; CALC.cur=calcFmt(Math.round(v2/2.5)*2.5); CALC.fresh=true; return; }
  }catch(e){}
}
function calcPaint(){
  try{
    var fab=document.getElementById('calcFab');
    if(!fab){
      fab=document.createElement('div'); fab.id='calcFab'; fab.className='calcfab';
      fab.setAttribute('role','button'); fab.setAttribute('aria-label','Calculator');
      fab.innerHTML='<svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">'
        +'<rect x="4" y="2.5" width="16" height="19" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/>'
        +'<rect x="7" y="5.5" width="10" height="3.5" rx="1" fill="currentColor"/>'
        +'<circle cx="8.6" cy="12.6" r="1.15" fill="currentColor"/><circle cx="12" cy="12.6" r="1.15" fill="currentColor"/>'
        +'<circle cx="15.4" cy="12.6" r="1.15" fill="currentColor"/>'
        +'<circle cx="8.6" cy="16.4" r="1.15" fill="currentColor"/><circle cx="12" cy="16.4" r="1.15" fill="currentColor"/>'
        +'<circle cx="15.4" cy="16.4" r="1.15" fill="currentColor"/></svg>';
      document.body.appendChild(fab);
      fab.addEventListener('click', function(ev){ ev.stopPropagation(); CALC.open=!CALC.open;
        if(CALC.open){ CALC.cur='0'; CALC.acc=null; CALC.op=null; CALC.fresh=true; } calcPaint(); });
    }
    var pan=document.getElementById('calcPanel');
    if(!CALC.open){ if(pan) pan.remove(); fab.classList.remove('on'); return; }

    }
    var pend=(CALC.op!==null && CALC.acc!==null)
      ? calcFmt(CALC.acc)+' '+({'+':'+','-':'\u2212','*':'\u00d7','/':'\u00f7'})[CALC.op] : '';
    function key(k,label,cls){ return '<button class="ck'+(cls?' '+cls:'')+'" data-ck="'+k+'">'+label+'</button>'; }
    pan.innerHTML='<div class="calc-hd"><span>Calculator</span><span class="calc-x" data-ck="close">\u2715</span></div>'
      +'<div class="calc-pend">'+esc(pend)+'</div>'

      +'<div class="calc-grid">'
      +key('C','C','fn')+key('back','\u232b','fn')+key('%','%','fn')+key('/','\u00f7','op')
      +key('7','7')+key('8','8')+key('9','9')+key('*','\u00d7','op')
      +key('4','4')+key('5','5')+key('6','6')+key('-','\u2212','op')
      +key('1','1')+key('2','2')+key('3','3')+key('+','+','op')
      +key('r5','\u21925','fn')+key('0','0')+key('.','.')+key('=','=','eq')
      +'</div>'
      +'<div class="calc-note">\u21925 rounds to the nearest '+(isKg()?'2.5 kg':'5 lb')+' \u00b7 enter '+(isKg()?'100':'225')+' \u00d7 80 % for a percentage</div>';
  }catch(e){}
}

// ===== VISUAL WARM-UP =====
// Reading "bar x10, 135 x5, 185 x3, 215 x1" means holding the phone close mid-session. Same
// information drawn as a loaded bar per side, big enough to read standing at the rack.
var WU={open:null};      // index of the exercise whose warm-up is expanded

// "bar x10, 135 x5, 185 x3" -> [{w:null,reps:10},{w:135,reps:5},...]
function wuParse(str){
  if(!str) return [];
  return String(str).split(',').map(function(part){
    var t=String(part).trim(); if(!t) return null;
    var m=t.match(/^(bar|\d+(?:\.\d+)?)\s*[x\u00d7]\s*(\d+)/i);
    if(!m) return null;
    return {w:(/^bar$/i.test(m[1])? null : parseFloat(m[1])), reps:parseInt(m[2],10)};
  }).filter(Boolean);
}
// For a lift with no written ramp: bar, then roughly 55% and 80% of the work weight.
function wuDerive(target){
  if(!(target>barLb())) return [];
  // plateRound, not round-to-5: a warm-up weight you cannot actually load is useless
  function near(x){ var v=plateRound(x), b0=barLb(); return v<b0? b0 : v; }
  var out=[{w:null,reps:8}];
  var a=near(target*0.55), b=near(target*0.80);
  if(a>barLb()+1e-6) out.push({w:a,reps:5});
  if(b>a+1e-6) out.push({w:b,reps:3});
  return out;
}
// Lighter implements: two feel-sets at roughly half and three-quarters of the work weight,
// on the increments that implement actually comes in. Dumbbells step in fives per hand;
// stacks and fixed bars in tens.
function wuDeriveLight(target, eq){
  if(!(target>0)) return [];
  var step=(eq==='dumbbell')?5:10, mn=step;
  function near(x){ return Math.max(mn, Math.round(x/step)*step); }
  var a=near(target*0.5), b=near(target*0.75), out=[];
  if(a<target) out.push({w:a,reps:8,eq:eq});
  if(b>a && b<target) out.push({w:b,reps:5,eq:eq});
  return out;
}
function wuSets(ex, target, st){
  // a substitute warms up as what it IS, not as what it replaced
  var sub=st&&st.sub;
  if(sub){
    var seq=exEquip(sub);
    if(seq==='barbell') return wuDerive(target);
    if(seq==='dumbbell'||seq==='machine'||seq==='cable') return wuDeriveLight(target, seq);
    return [];
  }
  var written=wuParse(ex&&ex.warmup);
  if(written.length) return written;
  if(ex&&ex.barbell) return wuDerive(target);
  var eq=exEquip(ex&&ex.name);
  if(eq==='dumbbell'||eq==='machine'||eq==='cable') return wuDeriveLight(target, eq);
  return [];
}
// the picture for one warm-up set on a non-barbell implement
function wuLightFigure(w, eq, name){
  if(eq==='dumbbell') return dbSVG(w,56);
  if(eq==='cable'||eq==='machine') return (loadStyleOf(name)==='plates')? pegSVG(w,72) : stackSVG(w,72);
  return '';
}
// One barbell, drawn with plates sized and coloured by denomination.
// Anatomy matters: real bars are THIN in the middle (the shaft you grip) and FAT at the ends
// (the sleeves the plates ride on). An earlier version drew the thick piece in the centre and
// loaded plates a third of the way in - which the eye read as a zoomed-in half bar. This view
// is the whole bar: shaft, collar steps, sleeves to the edges, plates from the collar outward,
// empty sleeve visible past the last plate.
function wuBarSVG(total, dispH){
  var W=320, H=104, MID=52;
  var CL=68, CR=252;                 // collar faces - plates stack outward from these
  var SLEEVE=CL-8-10;                // sleeve per side: collar outer face down to the end cap
  var pl=(total==null)? [] : platesFor(total);
  var unmatched=(total!=null && pl===null);
  if(pl===null) pl=[];
  var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+(dispH||H)+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="'
    +(total==null?'empty bar':WV(total)+(isKg()?' kilograms':' pounds'))+'">';
  svg+='<rect x="76" y="48" width="168" height="8" rx="3" fill="#9AA0A6"/>';                       // shaft (thin)
  svg+='<rect x="10" y="45" width="58" height="14" rx="3" fill="#C3C8CE"/>';                       // left sleeve (fat)
  svg+='<rect x="252" y="45" width="58" height="14" rx="3" fill="#C3C8CE"/>';                      // right sleeve
  svg+='<rect x="6" y="43" width="4" height="18" rx="1.5" fill="#71787F"/>';                       // end caps
  svg+='<rect x="310" y="43" width="4" height="18" rx="1.5" fill="#71787F"/>';
  svg+='<rect x="'+(CL-8)+'" y="39" width="8" height="26" rx="2" fill="#71787F"/>';                // collar steps
  svg+='<rect x="'+CR+'" y="39" width="8" height="26" rx="2" fill="#71787F"/>';
  // plate widths, compressed together only if a monster load would overrun the sleeve -
  // compression scales every plate equally so both sides stay perfect mirrors
  var PM=isKg()? PLATE_KG : PLATE_LB;
  var GAP=3, ws=pl.map(function(p){ var c=PM[p]||['#7A828C','#fff',16]; return Math.max(9, Math.round(c[2]*0.42)); });
  var need=ws.reduce(function(a,b){ return a+b; },0)+GAP*Math.max(0,ws.length-1);
  if(need>SLEEVE && need>0){ var f=SLEEVE/need; ws=ws.map(function(w2){ return Math.max(5, Math.floor(w2*f)); }); }
  var x1=CL-8, x2=CR+8;               // outer face of each collar - equal sleeve budget both sides
  pl.forEach(function(p,i){
    var c=PM[p]||['#7A828C','#fff',16];
    var hh=2*Math.round(c[2]*2.35/2), w=ws[i];       // even heights: every plate centres on the bar axis
    var y=(H-hh)/2;
    x1-=w;
    // rim in the card's own text colour: guaranteed to contrast with whatever theme is on,
    // so a black plate still reads on a dark card and a white plate on a light one
    svg+='<rect x="'+x1+'" y="'+y+'" width="'+w+'" height="'+hh+'" rx="3" fill="'+c[0]+'" stroke="var(--chalk)" stroke-opacity=".8" stroke-width="1.6"/>';
    svg+='<rect x="'+x2+'" y="'+y+'" width="'+w+'" height="'+hh+'" rx="3" fill="'+c[0]+'" stroke="var(--chalk)" stroke-opacity=".8" stroke-width="1.6"/>';
    x1-=GAP; x2+=w+GAP;
  });
  svg+='</svg>';
  return {svg:svg, plates:pl, unmatched:unmatched};
}
function wuHTML(i, ex, st, target){
  try{
    var sets=wuSets(ex, target, st);
    if(!sets.length) return '';
    var open=(WU.open===i);
    var light=!!(sets[0]&&sets[0].eq);
    var nm=(st&&st.sub)||ex.name;
    var h='<div class="wu-wrap">'
     +'<button class="wu-btn'+(open?' on':'')+'" data-wuopen="'+i+'">'
     +'<span>Warm-up</span><span class="wu-sub">'+sets.length+(sets.length===1?' set':' sets')+' \u00b7 tap for '+(light?'loads':'plates')+'</span>'
     +'<span class="wu-car">'+(open?'\u2715':'\u203a')+'</span></button>';
    if(open){
      h+='<div class="wu-body">';
      sets.forEach(function(s2,k){
        if(s2.eq){
          h+='<div class="wu-set">'
           +'<div class="wu-hd"><span class="wu-n">'+(k+1)+'</span>'
           +'<span class="wu-w mono">'+WV(s2.w)+' '+uLbl()+(s2.eq==='dumbbell'?' / hand':'')+'</span>'
           +'<span class="wu-r">\u00d7 '+s2.reps+'</span></div>'
           +'<div style="margin:6px auto 0">'+wuLightFigure(s2.w, s2.eq, nm)+'</div>'
           +'</div>';
          return;
        }
        var bar=wuBarSVG(s2.w);
        var label=(s2.w==null? 'Empty bar' : WV(s2.w)+' '+uLbl());
        h+='<div class="wu-set">'
         +'<div class="wu-hd"><span class="wu-n">'+(k+1)+'</span>'
         +'<span class="wu-w mono">'+label+'</span>'
         +'<span class="wu-r">\u00d7 '+s2.reps+'</span></div>'
         +bar.svg
         +'<div class="wu-pl">'+(s2.w==null? 'Nothing on the bar'
            : bar.unmatched? 'Not loadable from standard plates \u2014 use the closest you can make'
            : (bar.plates.length? '<span style="margin-right:5px">Per side:</span>'
                 +bar.plates.map(function(x){ return plateChip(x,isKg()); }).join('')
               : 'Bar only'))+'</div>'
         +'</div>';
      });
      h+='<div class="wu-note">'+(light? 'Work up briskly and stop well short of hard \u2014 this is preparation, not training.'
         : 'Same plates on each end. Work up briskly and stop well short of hard \u2014 this is preparation, not training.')+'</div>';
      h+='</div>';
    }
    return h+'</div>';
  }catch(e){ return ''; }
}

// ===== the tour's demo rest screen =====
// A faithful, INERT replica of the real rest takeover, so the tour can walk it piece by
// piece. It is a DEMONSTRATION, not a live control. Tapping it during the tour must never log
// anything into a real training history - tourGuard already swallows every interaction.
function tourRestShow(){

      +'<div class="rest-plates"><span>Per side:</span><span>45</span><span>45</span><span>10</span></div></div>'

      +'<button class="rest-min" data-restmin="1">Minimise \u2014 keep it running</button>'
      +'</div>';

function tourRestHide(){
  try{
    var el=document.getElementById('restTick'); if(!el || el.dataset.tourDemo!=='1') return;
    delete el.dataset.tourDemo;
    el.style.display='none'; el.innerHTML=''; el.className='restchip';
  }catch(e){}
}
function tourGuard(ev){
  try{
    // key off the coach actually being on screen - a stale live flag must never
    // be able to lock the whole card out of accepting taps
    if(!TOUR.live || !document.getElementById('coachHost')) return;
    if(ev.target && ev.target.closest && ev.target.closest('#coachHost')) return;
    ev.stopPropagation();
    if(ev.cancelable) ev.preventDefault();
    // if the swallowed tap was on the very element this step spotlights, that is the athlete
    // following the instruction - advance instead of ignoring them
    try{
      if(ev.type==='click'){
        var stC=tourStep();
        if(stC && stC.sel && ev.target.closest && ev.target.closest(stC.sel)){
          setTimeout(function(){ tourMove(1); },0);
        }
      }
    }catch(e2){}
  }catch(e){}
}
// every input channel, not just click - the swipe gesture and any touch-wired control must be
// as unable to act beneath the tour as click handlers are
try{ ['click','pointerdown','mousedown','touchstart','touchend'].forEach(function(evt){
  document.addEventListener(evt, tourGuard, {capture:true, passive:false}); }); }catch(e){}
function tourAvailable(){
  try{ return !(S.tour&&S.tour.done); }catch(e){ return false; }
}
// The guide is a walk through a TRAINING day - most of what it points at only exists there.
// Starting it from the You or Plan screen used to skip the whole opening run of steps, so it
// moves to a training day first and puts you back where you were at the end.
function tourStart(){
  var back=S.day, backV=S.view;
  try{
    var codes=(typeof dayCodes==='function')? dayCodes() : [];
    if(codes.length && codes.indexOf(S.day)<0){ S.day=codes[0]; S.view=null; }
  }catch(e){ oops('tourStart',e); }
  S.tour={done:false};
  TOUR={i:0, live:true, day0:S.day, view0:S.view, back:back, backV:backV};
  save(); render(); coachPaint();
}
function tourEnd(){
  try{ tourRestHide(); }catch(e){}
  try{ document.querySelectorAll('.coach-target').forEach(function(x){
    x.classList.remove('coach-target'); x.classList.remove('demo'); }); }catch(e){}
  S.tour={done:true}; TOUR.live=false;
  try{ var bk=(TOUR.back!=null)? TOUR.back : TOUR.day0; if(bk!=null && S.day!==bk){ S.day=bk; } }catch(e){}
  try{ var bv=(TOUR.backV!==undefined)? TOUR.backV : TOUR.view0; if(S.view!==bv){ S.view=bv; } }catch(e){}
  save(); try{ render(); }catch(e){} coachPaint();
}
function tourStep(){ return TOUR_STEPS[Math.max(0,Math.min(TOUR_STEPS.length-1,TOUR.i))]; }
// Walk forward or back, skipping any step whose target genuinely is not there.
// A step that declares go/view lives on ANOTHER screen, so it has to be navigated to BEFORE
// asking whether its target exists - testing first silently dropped every one of them (the deck
// steps, the backup step, the log step: 8 of 50 never appeared).
function tourReachable(st){
  if(!st.sel) return true;
  if(document.querySelector(st.sel)) return true;
  if(!st.go && !st.view) return false;
  try{
    var goTo=(st.go==='@day')? (TOUR.day0||(dayCodes&&dayCodes()[0])||S.day) : st.go;
    if(goTo && S.day!==goTo){ S.day=goTo; render(); }
    if(st.view!==undefined && S.view!==st.view){ S.view=st.view; render(); }
    return !!document.querySelector(st.sel);
  }catch(e){ return false; }
}
function tourMove(dir){
  var i=TOUR.i;
  for(var guard=0; guard<TOUR_STEPS.length; guard++){
    i+=dir;
    if(i<0){ i=0; break; }
    if(i>=TOUR_STEPS.length){ tourEnd(); return; }
    if(tourReachable(TOUR_STEPS[i])) break;
  }
  TOUR.i=i;
  try{ var stG=TOUR_STEPS[i];
    var goG=(stG&&stG.go==='@day')? (TOUR.day0||(dayCodes&&dayCodes()[0])||S.day) : (stG&&stG.go);
    if(goG && S.day!==goG){ S.day=goG; save(); render(); }   // the tour shows the room, not just the door
    if(stG && stG.view && S.view!==stG.view){ S.view=stG.view; render(); }   // and opens the deck when a step lives there
    if(stG && stG.demo==='rest') tourRestShow(); else tourRestHide();
  }catch(e){}
  coachPaint();
}
function coachPaint(){
  try{
    var host=document.getElementById('coachHost');
    var show=TOUR.live && tourAvailable();
    if(!show){
      TOUR.live=false;                       // stay honest: not on screen means not running
      try{ document.querySelectorAll('.coach-target').forEach(function(x){
        x.classList.remove('coach-target'); x.classList.remove('demo'); }); }catch(e){}
      if(host) host.remove();
      return;
    }
    if(!host){
      host=document.createElement('div'); host.id='coachHost';
      document.body.appendChild(host);
      host.addEventListener('click', function(ev){
        var b=ev.target.closest && ev.target.closest('[data-tour]');
        if(!b){ ev.stopPropagation();
          // a tap on the thing the step is pointing at is the athlete doing what we asked -
          // it advances the tour instead of dying on the scrim
          var bx=TOUR.box;
          if(bx && ev.clientX>=bx.l && ev.clientX<=bx.l+bx.w && ev.clientY>=bx.t && ev.clientY<=bx.t+bx.h){
            setTimeout(function(){ tourMove(1); },0);
          }
          return; }
        ev.stopPropagation();
        var k=b.getAttribute('data-tour');
        if(k==='skip'||k==='done') tourEnd();
        else if(k==='next') tourMove(1);
        else if(k==='back') tourMove(-1);
      });
    }
    var st=tourStep(), last=(TOUR.i===TOUR_STEPS.length-1);
    var pad=10;
    // release whatever was lifted for the previous step
    try{ document.querySelectorAll('.coach-target').forEach(function(x){
      x.classList.remove('coach-target'); x.classList.remove('demo'); }); }catch(e){}
    var el=st.sel? document.querySelector(st.sel) : null;
    // a step about a SECTION spotlights the section, not the one stepper it anchored on
    if(el && st.closest){ try{ var up=el.closest(st.closest); if(up) el=up; }catch(e){} }
    var box=null;
    if(el){
      // INSTANT scroll, then measure on the next frame - measuring during a smooth scroll
      // draws the spotlight where the element USED to be (the way-off-focus bug).
      try{ el.scrollIntoView({block:'center'}); }catch(e){}
      var r=el.getBoundingClientRect();
      if(r.width>0&&r.height>0){
        box={t:r.top, l:r.left, w:r.width, h:r.height};
        el.classList.add('coach-target');      // revealed through the hole at natural depth
        if(st.tap) el.classList.add('demo');   // and presses itself in time with the finger
      }
    }
    // the world can move under the tour (keyboard, rotation, late layout) - follow it
    if(!TOUR._wired){ TOUR._wired=true;
      var relayout=function(){ if(!TOUR.live||TOUR._raf) return;
        TOUR._raf=requestAnimationFrame(function(){ TOUR._raf=null; try{ coachPaint(); }catch(e){} }); };
      window.addEventListener('resize', relayout, {passive:true});
      window.addEventListener('scroll', relayout, {passive:true, capture:true});
    }
    // keep the panel clear of whatever is being pointed at
    TOUR.box=box? {t:box.t-pad, l:box.l-pad, w:box.w+pad*2, h:box.h+pad*2} : null;
    var lowerHalf = box? (box.t+box.h/2) > (window.innerHeight/2) : false;
    var pos = lowerHalf? 'top' : 'bottom';
    var dots=TOUR_STEPS.map(function(_,k){ return '<i class="'+(k===TOUR.i?'on':(k<TOUR.i?'past':''))+'"></i>'; }).join('');
    var fx=box? (box.l+box.w/2) : 0, fy=box? (box.t+box.h*0.72) : 0;
    var finger = (box && st.tap)
      ? '<div class="coach-ripple" style="top:'+fy+'px;left:'+fx+'px"></div>'
        +'<div class="coach-finger" style="top:'+fy+'px;left:'+fx+'px">'
        +'<svg viewBox="0 0 40 46" width="44" height="46">'
        +'<path d="M15 26V8a4 4 0 018 0v12h2.5a4 4 0 014 4v10c0 6-4 11-10 11h-4c-5 0-9-4-9-9v-8a3.5 3.5 0 017 0z" '
        +'fill="#fff" stroke="rgba(0,0,0,.45)" stroke-width="1.6" stroke-linejoin="round"/>'
        +'</svg></div>'
      : '';
    host.innerHTML=
      '<div class="coach-scrim'+(box?'':' full')+'"></div>'
      +(box? '<div class="coach-spot" style="top:'+(box.t-pad)+'px;left:'+(box.l-pad)+'px;width:'+(box.w+pad*2)+'px;height:'+(box.h+pad*2)+'px"></div>' : '')
      +finger
      +'<div class="coach-panel '+pos+'" key="'+TOUR.i+'">'
      +'<span class="coach-ct">'+(TOUR.i+1)+' / '+TOUR_STEPS.length+'</span>'
      +(last? '' : '<button class="coach-skip" data-tour="skip">Skip</button>')
      +'<div class="coach-row">'
      +'<div class="coach-av" aria-hidden="true">'
      +'<svg viewBox="0 0 64 64" width="46" height="46">'
      +'<circle cx="32" cy="32" r="30" fill="var(--amber)"/>'
      +'<circle cx="32" cy="24" r="9" fill="var(--amber-ink)" opacity=".92"/>'
      +'<path d="M14 54c2-11 9-16 18-16s16 5 18 16z" fill="var(--amber-ink)" opacity=".92"/>'
      +'<circle class="coach-whistle" cx="45" cy="38" r="4.6" fill="#fff"/>'
      +'</svg></div>'
      +'<div class="coach-txt"><div class="coach-t">'+esc(st.t)+'</div>'
      +'<div class="coach-b">'+esc(st.b)+'</div></div></div>'
      +'<div class="coach-dots">'+dots+'<span class="coach-count">'+(TOUR.i+1)+' / '+TOUR_STEPS.length+'</span></div>'
      +'<div class="coach-btns">'
      +(TOUR.i>0? '<button class="coach-b2" data-tour="back">Back</button>':'')
      +'<button class="coach-b1" data-tour="'+(last?'done':'next')+'">'+(last?'Start training':'Next')+'</button>'
      +'</div>'

      +'</div>';
  }catch(e){}
}

// Safari deletes a site's local storage after seven days without interaction (ITP, iOS 13.4+).
// A card used from a browser tab can therefore lose a training log over a deload week. Web apps
// added to the Home Screen are outside Safari and keep their own use counter, so they are exempt.
// This banner exists to get people across that line, not to push an install for its own sake.
function isInstalled(){
  try{
    if(window.navigator.standalone===true) return true;                 // iOS home-screen app
    if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
    if(window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) return true;
  }catch(e){}
  return false;
}
function isIOS(){
  try{ var ua=navigator.userAgent||'';
    if(/iPad|iPhone|iPod/.test(ua)) return true;
    return /Mac/.test(ua) && 'ontouchend' in document;                   // iPadOS reports as Mac
  }catch(e){ return false; }
}
function onHTTP(){ try{ return String(location.protocol).indexOf('http')===0; }catch(e){ return false; } }
function installBarHTML(){
  try{
    if(ST_MODE!=='local') return '';        // inside Claude, or nothing is being saved anyway
    if(!onHTTP()) return '';                 // a file:// page cannot be installed
    if(isInstalled()) return '';
    if(S.installAck) return '';
    var ios=isIOS();
    return '<div class="block" style="border-color:var(--amber)">'
     +'<h3 style="color:var(--amber)">Put this on your home screen</h3>'
     +'<div style="font-size:13.5px;line-height:1.6">'
     +(ios
       ? 'On iPhone, Safari clears a website\u2019s saved data after about a week without a visit \u2014 which would take your training history with it. '
         +'Added to the home screen it counts as an app instead, and your log is kept.'
         +'<br><br><b>Share \u2192 Add to Home Screen.</b> Takes five seconds.'
       : 'Installing it keeps your training log safe from browser clean-ups, opens it full screen, and lets it work with no signal.'
         +'<br><br>Use your browser\u2019s <b>Install</b> or <b>Add to Home screen</b> option.')
     +'</div>'
     +'<div class="cue" style="padding:8px 0 0">Either way, keep taking the backups \u2014 that is what survives a lost phone.</div>'
     +'<div class="daybtn" data-installack="1" style="margin-top:10px;display:inline-block;padding:8px 14px;font-size:12px">Got it, hide this</div>'
     +'</div>';
  }catch(e){ return ''; }
}

// Backstop for the read-only lock. CSS pointer-events covers the markup we know about; this

function lockGuard(ev){

    if(!t || !t.closest) return;
    if(t.closest('[data-unlock]') || t.closest('.tabrow') || t.closest('.chiprow')
       || t.closest('.weekrow') || t.closest('#coachHost') || t.closest('.wn-wrap')

function restNextTarget(b){
  // where does one tap take you from the rest chip? Mirrors restNextInfo's superset-aware order:
  // pending set on the superset partner first, then the next pending set of this exercise,
  // otherwise the next exercise in the day that still has work left.
  try{
    const d=(typeof effDay==='function')? effDay() : dayObj();
    const prArr=(S.pairs&&S.pairs[S.day])||[];
    let pi=null; if(prArr.indexOf(b.exi)>-1) pi=b.exi+1; else if(prArr.indexOf(b.exi-1)>-1) pi=b.exi-1;
    if(pi!=null && d.exercises[pi] && !isOut(d.exercises[pi].name)){
      const pst=exState(pi,d.exercises[pi]);
      const pj=pst.sets.findIndex(s=>s.st==='pend');
      if(pj>-1) return {kind:'set', i:pi, j:pj, st:pst};
    }
    const st=S.data[exKey(b.exi)];
    if(st){ const nj=st.sets.findIndex(s=>s.st==='pend');
      if(nj>-1) return {kind:'set', i:b.exi, j:nj, st:st}; }
    for(let i=b.exi+1;i<d.exercises.length;i++){
      if(isOut(d.exercises[i].name)) continue;
      const ns=exState(i,d.exercises[i]);
      if(ns.sets.some(s=>s.st==='pend')) return {kind:'ex', i:i};
    }
  }catch(e){}
  return {kind:'done'};
}
function restLogNext(b){

    const s=tgt.st.sets[tgt.j];
    s.st='hit'; s.reps=null; s.rir=null; s.t=Date.now(); tgt.st.open=-1; tgt.st.wopen=false;
    if(tgt.i!==focusIdx()) S.focus=tgt.i; // superset partner or continued exercise — keep the card in step
    save(); render(); return;

// The next set, fully loaded: the weight and the exact plates, so the bar gets loaded DURING
