// Opt-in breathing pacer: in 4, out 6 - exhale-biased, the pattern that actually drops heart
// rate between heavy sets. Wall-clock anchored like everything else on this screen.
function breathRing(){
  var T=10000, d=-(Date.now()%T);
  return '<div class="breath-wrap"><div class="breath-ring" style="animation-delay:'+d+'ms"></div>'
    +'<div class="breath-lab">in 4 \u00b7 out 6</div></div>';
}
function ghostRow(taken, rir){
  taken=Math.max(0,Math.min(15,Math.round(+taken||0)));
  rir=(rir==null||!isFinite(rir))? null : Math.max(0,Math.min(6,Math.round(+rir)));
  var G=(rir==null)? 0 : rir;
  var N=taken+G;
  // A real set's clock, not a light show (Jerry's spec): each rep is concentric+eccentric at
  // honest speed, every rep a little slower, the last taken rep a visible grind, ghost reps
  // slower and faint. High-rep sets compress so the loop stays watchable.
  var f=Math.min(1, 8/Math.max(1,taken));
  var reps=[], pauses=[], t=0, lock=[];
  for(var i2=0;i2<N;i2++){
    var g2=i2>=taken;
    var dur=(1.55 + i2*0.34 + (i2===taken-1?0.6:0) + (g2?0.9:0))*1000*f;   // ms, slower every rep
    var pause=(0.35 + i2*0.09)*1000*f;
    reps.push({start:t, dur:dur, ghost:g2});
    lock.push(t + dur*0.55);                                               // lockout: the rep is made
    t+=dur+pause; pauses.push(pause);
  }
  var T=Math.max(4200, t+2200);                                            // breath before it repeats
  var sig=taken+'x'+G;
  // keyframes for the bar: rise to lockout (slower portion), return, hold between reps
  var pct=function(ms){ return Math.max(0,Math.min(100,(ms/T)*100)).toFixed(2); };
  var kf='@keyframes grrBar'+sig+'{0%{transform:translateY(0);opacity:1;}';
  reps.forEach(function(r2){
    var o=r2.ghost? '.32':'1';
    kf+=pct(r2.start)+'%{transform:translateY(0);opacity:'+o+';}'
      +pct(r2.start+r2.dur*0.55)+'%{transform:translateY(-15px);opacity:'+o+';}'
      +pct(r2.start+r2.dur)+'%{transform:translateY(0);opacity:'+o+';}';
  });
  kf+=pct(t)+'%{transform:translateY(0);opacity:1;}100%{transform:translateY(0);opacity:1;}}';
  var now=Date.now()%T;
  function delay(startMs){ var d=-(now)+startMs; if(d>0) d-=T; return Math.round(d); }
  function pip(i3,ghost){
    return '<div class="rp'+(ghost?' ghost':'')+'" style="animation:'+(ghost?'grrPg':'grrP')+' '+Math.round(T)+'ms linear infinite;animation-delay:'+delay(lock[i3])+'ms"></div>';
  }
  var bar='<div class="grr-stage"><svg class="grr-bar" viewBox="0 0 30 10" style="animation:grrBar'+sig+' '+Math.round(T)+'ms linear infinite;animation-delay:'+delay(0)+'ms">'
    +'<rect x="6" y="4" width="18" height="2.4" rx="1.1" fill="currentColor"/>'
    +'<rect x="2.5" y="0.6" width="3" height="8.8" rx="1.2" fill="currentColor"/>'
    +'<rect x="24.5" y="0.6" width="3" height="8.8" rx="1.2" fill="currentColor"/>'
    +'</svg></div>';
  var s='<style>'+kf+'</style><div class="grr">'+bar;
  for(var a=0;a<taken;a++) s+=pip(a,false);
  for(var g3=0;g3<G;g3++) s+=pip(taken+g3,true);
  s+='<div class="rp-wall"></div></div>';
  var cap = (rir==null)? taken+' to take \u00b7 the wall is failure'
    : (rir===0? taken+' taken \u00b7 nothing left \u2014 that was the wall'
       : taken+' taken \u00b7 '+rir+' in the tank \u00b7 the wall is failure');
  return s+'<div class="grr-cap">'+cap+'</div>';
}
function restHoldBtn(cls, attr, label){

    if(tgt.kind==='ex') return restHoldBtn('rest-go','data-restnext','Next exercise \u2192 hold');
    return restHoldBtn('rest-go','data-restnext','Day done \u2014 hold to clear'); })();
  h+='<div class="rest-acts">'
   +'<button class="rest-min" data-restmin="1">Minimise \u2014 keep it running</button>'
   +restHoldBtn('rest-kill','data-restkill','Skip rest \u2014 hold')

  return h;

function paintRest(force){

    ? '<div class="mini-in"><span class="mono mini-clock">'+(go?'GO':fmtDur(rem))+'</span>'

function wireRest(){
  var el=document.getElementById('restTick'); if(!el) return;

    el.addEventListener('pointerdown', function(ev){
      var b=lastCompletion(); if(!b) return;
      var t=ev.target, n=t.closest? t.closest('[data-hold]') : null; if(!n) return;
      var k=n.hasAttribute('data-restnext')? 'data-restnext':'data-restkill';
      holdK=k; holdT0=Date.now();

      }, HOLD_MS);

          var stp3=wStepLb(ex3.barbell);

    if((n=hit('data-restrep'))){ restEditReps(b,+n.dataset.restrep); return; }
    if((n=hit('data-restrir'))){ restSetRir(b,+n.dataset.restrir); return; }
    if(hit('data-restgrind')){ restToggleGrind(b); return; }
    if(hit('data-restnext')||hit('data-restkill')){
      // taps don't fire these anymore - holds do. A click right after a completed hold is

      if(Date.now()-holdFired<600) return;

      return; }
    if(hit('data-restmin')){ S.restMin=b.t; save(); paintRest(true); return; }

window.__ERRS=[];
function __logErr(kind,msg,src,line,col,err){
  var e={kind:kind,msg:String(msg||''),src:String(src||''),line:line,col:col,
    stack:(err&&err.stack)?String(err.stack).split('\n').slice(0,6).join('\n'):'',
    at:new Date().toISOString()};
  // opaque errors ("Script error." with no file/line) carry zero actionable info — on iOS they're
  // usually WebKit audio/wake-lock noise after a screen lock, not a real fault. Log for the report,
  // but never alarm the lifter mid-session with the red bar.
  var opaque = /^script error\.?$/i.test(e.msg) && !e.src && !e.line && !e.stack;
  if(opaque) e.kind='opaque';
  var prev=window.__ERRS[window.__ERRS.length-1];
  if(prev && prev.msg===e.msg && prev.kind===e.kind && (Date.now()-new Date(prev.at).getTime())<10000){
    prev.n=(prev.n||1)+1; prev.at=e.at; // collapse rapid repeats of the same error into one entry
  } else {
    window.__ERRS.push(e); if(window.__ERRS.length>20) window.__ERRS.shift();
  }
  if(!opaque){ try{ __showErrBar(); }catch(x){} }
}
window.onerror=function(m,s,l,c,e){ __logErr('error',m,s,l,c,e); };
window.addEventListener('unhandledrejection',function(ev){
  var r=ev.reason; __logErr('promise',(r&&r.message)||r,'',0,0,r); });
function __showErrBar(){
  var b=document.getElementById('errBar');
  if(!b){ b=document.createElement('div'); b.id='errBar';
    b.style.cssText='position:fixed;left:8px;right:8px;bottom:96px;z-index:80;background:#2A1414;'
     +'border:1px solid #E05C4B;border-radius:10px;padding:10px 12px;font-size:12px;color:#FFD9D3;'
     +'font-family:-apple-system,sans-serif;line-height:1.45';
    document.body.appendChild(b); }
  var last=window.__ERRS[window.__ERRS.length-1]||{};
  b.innerHTML='<b style="color:#E05C4B">Something went wrong</b> \u2014 the card kept running. '
   +'<div style="margin-top:4px;font-family:ui-monospace,Menlo,monospace;font-size:11px;opacity:.9">'
   +(last.msg||'?').slice(0,180)+(last.line?(' @ line '+last.line):'')+'</div>'
   +'<div style="display:flex;gap:6px;margin-top:8px">'
   +'<span id="errCopy" style="flex:1;text-align:center;padding:8px;border:1px solid #E05C4B;border-radius:8px;cursor:pointer">Copy details</span>'
   +'<span id="errHide" style="padding:8px 12px;border:1px solid #5a3a36;border-radius:8px;cursor:pointer;opacity:.8">Hide</span></div>';
  document.getElementById('errHide').onclick=function(){ b.remove(); };
  document.getElementById('errCopy').onclick=function(){
    var t='TRAINING CARD ERROR REPORT \u00b7 build '+(typeof BUILD!=='undefined'?BUILD:'?')+'\n'+navigator.userAgent+'\n\n'
      +window.__ERRS.map(function(e){ return '['+e.kind+(e.n>1?' \u00d7'+e.n:'')+'] '+e.msg+'\n  '+e.src+':'+e.line+':'+e.col+'\n'+e.stack; }).join('\n\n');
    var done=function(){ var c=document.getElementById('errCopy'); if(c) c.textContent='Copied'; };
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done,function(){ __errFallback(t); }); return; } }catch(x){}
    __errFallback(t);
  };
}
function __errFallback(t){
  var ta=document.createElement('textarea'); ta.value=t;
  ta.style.cssText='position:fixed;left:5%;top:10%;width:90%;height:60%;z-index:99;font-size:12px';
  document.body.appendChild(ta); ta.focus(); ta.select();
}

// Storage is namespaced per athlete. The rule that makes this safe: with NO athlete selected the

// untouched by this feature existing. A coached athlete's state lives at SKEY+':a:<id>' and their
// logs at curLOGP()+'<id>:' - separate drawers in the same cabinet, never overlapping.
// The roster itself sits outside every athlete's state, so switching never disturbs it.
var ROSTER_KEY='training-card-roster-v1';

function rosterAthlete(id){
  for(var i=0;i<ROSTER.athletes.length;i++) if(ROSTER.athletes[i].id===id) return ROSTER.athletes[i];
  return null;

function activeAthlete(){ return ROSTER.active? rosterAthlete(ROSTER.active) : null; }
function curSKEY(){ return ROSTER.active? SKEY+':a:'+ROSTER.active : SKEY; }
function curLOGP(){ return ROSTER.active? LOGP+ROSTER.active+':' : LOGP; }
async function rosterLoad(){
  try{
    var v=await stGet(ROSTER_KEY);
    if(v){ var r=JSON.parse(v);
      ROSTER.mode=(r.mode==='coach')?'coach':'solo';
      ROSTER.athletes=Array.isArray(r.athletes)? r.athletes : [];
      ROSTER.active=r.active||null;
      if(ROSTER.mode!=='coach') ROSTER.active=null;          // solo never reads a namespaced drawer
      if(ROSTER.active && !rosterAthlete(ROSTER.active)) ROSTER.active=null;
    }
  }catch(e){ oops('rosterLoad',e); }
}
function rosterSave(){

function rosterAdd(name){

// ===== ADAPTATION =====
// Three things the card previously noticed but never acted on. Each one is a rule with a stated
// reason and a hard limit, not a model: the athlete can read exactly why a number moved, and undo
// it. Nothing here fires silently, and nothing fires more than once a week.
//
// HONEST LIMITS, so nobody oversells this: it reads self-reported RIR and readiness at face value,
// it has no per-muscle recovery model, and none of it is learned from data. It is a coach's
// heuristics written down, which is what makes it inspectable.
var AD_STALL_DROP=0.08;        // a stalled lift resets 8% - the standard 5/3/1-style back-off
var AD_STALL_MIN_SESSIONS=3;   // three sessions of flat-or-falling before we touch anything
var AD_STALL_COOLDOWN=21;      // days before the same lift can be reset again
var AD_DEBT_DELOAD=6;          // recovery-debt score that earns an early deload
var AD_VOL_STEP=1;             // sets added or removed per muscle per adaptation, never more
var AD_VOL_MIN=8, AD_VOL_MAX=20;

function adDays(a,b){
  try{ return (new Date(b+'T12:00:00').getTime()-new Date(a+'T12:00:00').getTime())/86400000; }
  catch(e){ return 999; }
}
// ---- 1. a stalled lift gets reset, not just reported ----
function adStalled(){
  var out=[];
  try{
    Object.keys(S.e1rmH||{}).forEach(function(k){
      var h=(S.e1rmH[k]||[]).slice(-6);
      if(h.length<AD_STALL_MIN_SESSIONS) return;
      var last=h[h.length-1].v, prev=h[h.length-AD_STALL_MIN_SESSIONS].v;
      if(last>prev) return;                                  // still climbing, leave it alone
      var lastReset=(S.adLog||[]).filter(function(x){ return x.kind==='stall' && x.lift===k; }).pop();
      if(lastReset && adDays(lastReset.d, shiftDate())<AD_STALL_COOLDOWN) return;
      out.push({lift:k, from:prev, to:last, n:h.length});
    });
  }catch(e){ oops('adStalled',e); }
  return out;
}
// ---- 2. fatigue, measured from what the athlete already told us ----
// Readiness answers and near-failure grinding are the two honest signals here. This is a debt
// counter, not a physiological model - it says "you have been running on empty", nothing more.
function adRecoveryDebt(){
  try{
    var today=shiftDate(), debt=0, why=[];
    var recent=(S.readyH||[]).filter(function(x){ return adDays(x.d, today)<=10; });
    var red=recent.filter(function(x){ return x.s<3; }).length;
    var amber=recent.filter(function(x){ return x.s>=3 && x.s<5; }).length;
    if(red){ debt+=red*2; why.push(red+' day'+(red===1?'':'s')+' reporting badly recovered'); }
    if(amber){ debt+=amber; why.push(amber+' day'+(amber===1?'':'s')+' short on sleep or beaten up'); }
    // strength going backwards across MORE THAN ONE lift is the clearest systemic signal there is
    var down=adStalledLifts();
    if(down.length>=2){ debt+=3; why.push('strength flat or falling on '+down.length+' lifts at once'); }
    return {debt:debt, why:why, red:red, amber:amber};
  }catch(e){ oops('adRecoveryDebt',e); return {debt:0, why:[]}; }
}
function adStalledLifts(){
  var out=[];
  try{
    Object.keys(S.e1rmH||{}).forEach(function(k){
      var h=(S.e1rmH[k]||[]).slice(-3);
      if(h.length<3) return;
      if(h[2].v<=h[0].v) out.push(k);
    });
  }catch(e){}
  return out;
}
// ---- 3. per-muscle volume drifts toward what is actually being tolerated ----
// Only inside the evidence band, only one set at a time, and only when the signal is unambiguous.
// How much training has actually been logged. Volume is the most invasive thing here - it
// reshapes the program rather than nudging a number - so it needs real history behind it, not one
// good week. A brand new athlete gets left completely alone.
function adEvidence(){
  try{
    var n=0;
    Object.keys(S.e1rmH||{}).forEach(function(k){ n+=(S.e1rmH[k]||[]).length; });
    return n;
  }catch(e){ return 0; }
}
var AD_VOL_MIN_EVIDENCE=8;
function adVolumeDrift(){
  var moves=[];
  try{
    if(!S.genPlan) return moves;                       // fixed templates are not ours to reshape
    if(adEvidence()<AD_VOL_MIN_EVIDENCE) return moves; // too early to have an opinion
    var v=plannedVolume(), debt=adRecoveryDebt();
    var stalledSet={}; adStalledLifts().forEach(function(k){ stalledSet[k]=true; });
    for(var m in v){
      var sets=v[m];
      if(!(sets>0)) continue;
      if(debt.debt>=AD_DEBT_DELOAD && sets>AD_VOL_MIN){
        moves.push({muscle:m, dir:-1, from:sets, why:'you are carrying fatigue'});
      } else if(sets<12 && debt.debt<=1 && !Object.keys(stalledSet).length){
        moves.push({muscle:m, dir:+1, from:sets, why:'recovering well and on the light side'});
      }
    }
    moves=moves.slice(0,2);                            // never reshape a whole program at once
  }catch(e){ oops('adVolumeDrift',e); }
  return moves;
}
// ---- 4. every lift climbs at ITS OWN rate ----
// A template gives everyone the same weekly percentage. Real lifters do not work that way: the
// same person can add 5lb a week to a squat and half that to a press. This fits a slope through
// the lift's own recent estimates and lets it climb at the rate IT has actually been climbing,
// bounded hard so a lucky fortnight cannot run away with the programme.
var AD_RATE_DAYS=56;           // roughly two blocks of evidence
var AD_RATE_MIN_PTS=4;
var AD_RATE_CAP=0.015;         // never more than 1.5% of the training max per week
function adRate(lift){
  try{
    var today=shiftDate();
    var H=(S.e1rmH&&S.e1rmH[lift]||[]).filter(function(x){
      var a=adDays(x.d, today); return a>=0 && a<=AD_RATE_DAYS; });
    if(H.length<AD_RATE_MIN_PTS) return null;
    // least squares on (weeks ago, estimate) - slope is lb per week
    var n=H.length, sx=0, sy=0, sxx=0, sxy=0;
    H.forEach(function(p){
      var x=-adDays(p.d, today)/7, y=p.v;
      sx+=x; sy+=y; sxx+=x*x; sxy+=x*y; });
    var den=(n*sxx - sx*sx);
    if(Math.abs(den)<1e-9) return null;
    var slope=(n*sxy - sx*sy)/den;
    return Math.round(slope*10)/10;                 // lb per week
  }catch(e){ oops('adRate',e); return null; }
}
function adRateMove(lift){
  try{
    var cur=(S.maxes||{})[lift]; if(!cur) return null;
    var r=adRate(lift); if(r==null) return null;
    if(r<=0) return null;                           // flat or falling is the stall rule's business
    var cap=cur*AD_RATE_CAP;
    var step=Math.min(r, cap);
    var to=Math.round((cur+step)/5)*5;
    if(to<=cur) return null;
    return {lift:lift, from:cur, to:to, rate:r, capped:(r>cap)};
  }catch(e){ return null; }
}
// ---- 5. coming back after time off ----
// Strength does not vanish in a fortnight, but it does fade, and resuming at the old load is how
// people get hurt on their first session back. Figures are deliberately conservative and the card
// says plainly that they are an estimate to train through, not a measurement.
function adLayoffDays(){
  try{
    var last=null;
    (logKeys||[]).forEach(function(k){
      var c=logCache[k]; if(c && c.date && (!last || c.date>last)) last=c.date; });
    if(!last) return 0;
    return Math.max(0, Math.round(adDays(last, shiftDate())));
  }catch(e){ return 0; }
}
function adLayoffCut(days){
  if(days<10) return 0;
  if(days<=20) return 0.05;
  if(days<=35) return 0.10;
  return 0.15;
}
function adLayoff(){
  try{
    var d=adLayoffDays();
    var cut=adLayoffCut(d);
    if(!cut) return null;
    var already=(S.adLog||[]).filter(function(x){ return x.kind==='layoff'; }).pop();
    if(already && adDays(already.d, shiftDate())<d) return null;   // already handled this break
    return {days:d, cut:cut};
  }catch(e){ oops('adLayoff',e); return null; }
}
// ---- 6. why a lift stalled, not just that it did ----
// The muscles each main lift leans on. When a lift stops moving and one of its drivers is
// under-dosed, the honest answer is "you are not training the thing that limits it" - and adding
// work there beats cutting the bar weight. This is the one piece a template cannot do for you.
var AD_DRIVERS={
  squat:['quads','glutes','back'],
  bench:['chest','triceps','fdelt'],
  dead: ['back','hams','glutes'],
  ohp:  ['fdelt','sdelt','triceps']
};
var AD_WEAK_SETS=10;           // below the evidence band is where a driver becomes suspect
function adWeakLink(lift){
  try{
    var drivers=AD_DRIVERS[lift]; if(!drivers) return null;
    var v=plannedVolume(); if(!v) return null;
    var weak=drivers.filter(function(m){ return (v[m]||0)<AD_WEAK_SETS; })
                    .sort(function(a,b){ return (v[a]||0)-(v[b]||0); });
    if(!weak.length) return null;
    return {lift:lift, muscle:weak[0], sets:v[weak[0]]||0, others:weak.slice(1)};
  }catch(e){ oops('adWeakLink',e); return null; }
}

// ---- the weekly pass ----
function adaptRun(force){
  try{
    // Stall resets and fatigue deloads work off maxes and check-ins, which every card has, so
    // they apply to a fixed template too. Only VOLUME drift needs a generated plan, because it
    // reshapes the program rather than moving a number - that stays gated inside adVolumeDrift.
    var today=shiftDate();
    if(!force && S.adLast && adDays(S.adLast, today)<7) return null;   // once a week, at most
    var acts=[];
    // Coming back from a break is judged before anything else: every other signal is read against
    // loads that are no longer true.
    var lay=adLayoff();
    if(lay){
      Object.keys(S.maxes||{}).forEach(function(k){
        var cur=S.maxes[k]; if(!cur) return;
        var to=Math.round(cur*(1-lay.cut)/5)*5;
        if(to>=cur) return;
        S.maxes[k]=to;
        acts.push({kind:'layoff', lift:k, from:cur, to:to, d:today, days:lay.days,
          why:lay.days+' days away \u2014 easing back in rather than picking up where you left off'});
      });
    }
    // Stalls next: a reset changes the loads everything else is judged against. But before cutting
    // the bar weight, ask WHY - if a driver of that lift is under-dosed, the volume is the problem.
    adStalled().forEach(function(s){
      var cur=(S.maxes||{})[s.lift]; if(!cur) return;
      var weak=adWeakLink(s.lift);
      if(weak && !S.adWeakTried){
        acts.push({kind:'weak', lift:s.lift, muscle:weak.muscle, sets:weak.sets, d:today,
          why:esc(s.lift)+' stalled and your '+weak.muscle+' work is light at '+weak.sets
             +' sets a week \u2014 feed that before cutting the bar'});
        S.adWeakTried=true;                       // one cycle to act on it, then we back off anyway
        return;
      }
      var to=Math.round(cur*(1-AD_STALL_DROP)/5)*5;
      if(to>=cur) return;
      S.maxes[s.lift]=to;
      S.adWeakTried=false;
      acts.push({kind:'stall', lift:s.lift, from:cur, to:to, d:today,
        why:'three sessions without progress \u2014 backed off to build a run-up again'});
    });
    // Lifts that ARE moving climb at their own measured rate rather than a template's.
    if(!lay){
      Object.keys(S.maxes||{}).forEach(function(k){
        if(acts.some(function(a){ return a.lift===k; })) return;   // already handled this lift
        var mv=adRateMove(k); if(!mv) return;
        S.maxes[k]=mv.to;
        acts.push({kind:'rate', lift:k, from:mv.from, to:mv.to, rate:mv.rate, d:today,
          why:'climbing about '+mv.rate+' '+uLbl()+' a week on your own numbers'
             +(mv.capped?' (held to a safe step)':'')});
      });
    }
    var debt=adRecoveryDebt();
    if(debt.debt>=AD_DEBT_DELOAD && !S.adDeloadDue){
      S.adDeloadDue=true;
      acts.push({kind:'deload', d:today, debt:debt.debt,
        why:'recovery debt: '+debt.why.join('; ')});
    } else if(debt.debt<2 && S.adDeloadDue){
      S.adDeloadDue=false;
    }
    adVolumeDrift().forEach(function(mv){
      acts.push({kind:'volume', muscle:mv.muscle, dir:mv.dir, from:mv.from, d:today, why:mv.why});
    });
    if(acts.length){
      try{ if(S.genPlan) applyMaxesToPlan(); }catch(e){}
      S.adLog=(S.adLog||[]).concat(acts).slice(-30);
      S.adNew=acts.length;
      S.adLast=today;
      save();
      return acts;
    }
    S.adLast=today; save();
    return null;
  }catch(e){ oops('adaptRun',e); return null; }
}
// undo the most recent pass, for anyone who disagrees with it
function adaptUndo(){
  try{
    var log=S.adLog||[]; if(!log.length) return;
    var d=log[log.length-1].d;
    var batch=log.filter(function(x){ return x.d===d; });
    batch.slice().reverse().forEach(function(a){
      if((a.kind==='stall'||a.kind==='rate'||a.kind==='layoff') && S.maxes && a.from) S.maxes[a.lift]=a.from;
      if(a.kind==='weak') S.adWeakTried=false;
      if(a.kind==='deload') S.adDeloadDue=false;
    });
    S.adLog=log.filter(function(x){ return x.d!==d; });
    S.adNew=0;
    try{ if(S.genPlan) applyMaxesToPlan(); }catch(e){}
    save();
  }catch(e){ oops('adaptUndo',e); }
}
function adaptHTML(){
  try{
    var log=S.adLog||[];
    if(!log.length && !S.adDeloadDue) return '';
    var d=log.length? log[log.length-1].d : null;
    var batch=log.filter(function(x){ return x.d===d; });
    var LN={squat:'Back Squat', bench:'Bench Press', dead:'Deadlift', ohp:'Overhead Press'};
    var rows=batch.map(function(a){
      if(a.kind==='stall') return '<li><b>'+esc(LN[a.lift]||a.lift)+'</b> '+WV(a.from)+' \u2192 '
        +WV(a.to)+' '+uLbl()+' \u2014 '+esc(a.why)+'</li>';
      if(a.kind==='deload') return '<li><b>Deload earned early</b> \u2014 '+esc(a.why)+'</li>';
      if(a.kind==='volume') return '<li><b>'+esc(a.muscle)+'</b> '
        +(a.dir>0?'room for another set':'one set lighter')+' \u2014 '+esc(a.why)+'</li>';
      if(a.kind==='rate') return '<li><b>'+esc(LN[a.lift]||a.lift)+'</b> '+WV(a.from)+' \u2192 '
        +WV(a.to)+' '+uLbl()+' \u2014 '+esc(a.why)+'</li>';
      if(a.kind==='layoff') return '<li><b>'+esc(LN[a.lift]||a.lift)+'</b> '+WV(a.from)+' \u2192 '
        +WV(a.to)+' '+uLbl()+' \u2014 '+esc(a.why)+'</li>';
      if(a.kind==='weak') return '<li><b>Likely cause</b> \u2014 '+esc(a.why)+'</li>';
      return '';
    }).join('');
    return '<div class="block adapt"><h3>What the card changed</h3>'
      +'<div class="cue" style="padding:0 0 6px">Adjusted from your own logged sets and check-ins. '
      +'Every change is listed with its reason \u2014 if you disagree, put it back.</div>'
      +'<ul class="adapt-list">'+rows+'</ul>'
      +(S.adDeloadDue? '<div class="cue" style="color:var(--amber);padding:6px 0 0">'
         +'A deload is recommended this week rather than waiting for the calendar.</div>':'')
      +'<div class="savelog" id="adaptUndoBtn">Put it back</div></div>';
  }catch(e){ return ''; }
}
function adaptWire(){
  var b=document.getElementById('adaptUndoBtn');
  if(b) b.onclick=function(){ adaptUndo(); alertToast('Reverted'); render(); };
}

// ===== WHAT'S NEW =====
// The service worker already serves the page network-first, so a deploy reaches a phone on the
// next open. This is the other half: telling people what changed. Entries are newest-first; on
// boot the card shows everything added since the build they last saw. Someone opening the card
// for the first time gets nothing - a changelog is meaningless before you have used the thing.
// TO CUT A RELEASE: add an entry at the TOP with a NEW `build:` tag (a date works well).
// That tag identifies the RELEASE and is what tells a returning card it has something to say.
// It is deliberately NOT the BUILD constant: BUILD names the CARD ('v59' vs 'c17'), both cards
// ship the same release, and BUILD is declared further down the file - referencing it here
// throws on load and takes the whole card with it.
var WHATSNEW=[
  {build:'2026.08.22', date:'2026-08-22', title:'Sessions close when you log them', items:[
    'Logging a session now locks it. A stray thumb cannot rewrite a day you have finished.',
    'Tap the lock on a closed day to reopen it \u2014 nothing is ever stuck.',
    'The high five stops greeting you every time you look back at a completed day.',
    'Session notes clear once saved, so Monday\u2019s note stays out of Wednesday\u2019s report.',
    'Editing your plan no longer rewrites sessions you already finished.',
    'A muscle map on the Plan tab shows where your week\u2019s work actually lands, with sets per muscle underneath.',
    'Buttons respond immediately \u2014 the old tap delay is gone.',
    'Report a problem or ask a question straight from the card.'
  ]}
];
function whatsNewPending(){
  try{
    if(!WHATSNEW.length) return [];
    if(!S.seenBuild) return [];                 // brand new here: nothing to catch up on
    if(S.seenBuild===WHATSNEW[0].build) return [];
    var out=[];
    for(var i=0;i<WHATSNEW.length;i++){
      if(WHATSNEW[i].build===S.seenBuild) break;
      out.push(WHATSNEW[i]);
    }
    return out;
  }catch(e){ return []; }
}
function whatsNewHTML(){
  try{
    if(!S.wnOpen || whatsNewBusy()) return '';
    var rel=whatsNewPending();
    if(!rel.length) return '';
    var body=rel.map(function(r){
      return '<div class="wn-rel"><div class="wn-h">'+esc(r.title)+'</div>'
        +'<ul class="wn-list">'+r.items.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul></div>';
    }).join('');
    return '<div class="wn-wrap" data-wnbg="1">'
     +'<div class="wn-sheet" role="dialog" aria-label="What changed in this update">'
       +'<div class="hw-grip" aria-hidden="true"></div>'
       +'<div class="wn-title">The card was updated</div>'
       +'<div class="wn-sub">Here is what changed since you last opened it.</div>'
       +body
       +'<div class="hw-done" data-wndone="1">Got it</div>'
     +'</div></div>';
  }catch(e){ return ''; }
}
function whatsNewDismiss(){
  try{ S.wnOpen=false; S.seenBuild=WHATSNEW.length? WHATSNEW[0].build : BUILD; save(); }
  catch(e){ oops('whatsNewClose',e); }
  render();
}
function whatsNewWire(){
  document.querySelectorAll('[data-wndone]').forEach(function(el){
    el.onclick=function(ev){ ev.stopPropagation(); whatsNewDismiss(); };
  });
  document.querySelectorAll('[data-wnbg]').forEach(function(el){
    el.onclick=function(ev){ if(ev.target===el) whatsNewDismiss(); };
  });
}
function whatsNewBusy(){
  // Never interrupt the walkthrough or onboarding. The tour installs a capture-phase guard that
  // swallows every tap, so a sheet shown on top of it cannot be dismissed - the user would be
  // trapped. A changelog can wait for the next open; a trap cannot be undone.
  try{
    if(typeof TOUR!=='undefined' && TOUR && TOUR.live) return true;
    if(S.tour && S.tour.done===false) return true;
    if(typeof ONB_ACTIVE==='function' && ONB_ACTIVE()) return true;
    if(typeof coachIdle==='function' && coachIdle()) return true;
  }catch(e){}
  return false;
}
function whatsNewBoot(){
  try{
    if(!S.seenBuild){ S.seenBuild=WHATSNEW.length? WHATSNEW[0].build : BUILD; save(); return; }
    if(whatsNewBusy()) return;
    if(whatsNewPending().length){ S.wnOpen=true; render(); }
  }catch(e){ oops('whatsNewBoot',e); }
}

// ===== SEND A REPORT =====
// There is no server behind this card, so nothing can be "submitted" anywhere. What the card CAN
// do is assemble everything useful into one block of text and hand it to the phone: the native
// share sheet, an email draft, or the clipboard. The athlete then sends it however they already
// talk to their coach. Set REPORT_TO before handing the card out and the email route is one tap.
// WHO REPORTS COME TO. Set these before handing the card to anyone; leave either blank to hide
// that button. Email must be a plain address (it builds a mailto: link). Phone must be a plain
// number, digits and + only - it builds an sms: link, so '555-0100' and '+15555550100' both work.
var REPORT_TO='manuel.g.grajeda@outlook.com';            // e.g. 'jerry@example.com'
var REPORT_SMS='+15202346160';           // e.g. '+15555550100'
var REPORT_KINDS=[['bug','Something looks wrong'],['question','I have a question'],['idea','A suggestion']];
function reportBundle(kind, msg){
  var L=[];
  L.push('--- '+(typeof CARD_NAME!=='undefined'?CARD_NAME:'TRAINING CARD')+' REPORT ---');
  L.push('type    : '+kind);
  try{ L.push('build   : '+(typeof BUILD!=='undefined'?BUILD:'?')); }catch(e){}
  try{ L.push('when    : '+new Date().toISOString()); }catch(e){}
  try{ L.push('screen  : '+(S.day||'?')+'  week '+(S.week||'?')+'  block '+cyc()); }catch(e){}
  try{ L.push('units   : '+(isKg()?'kg':'lb')); }catch(e){}
  try{ L.push('device  : '+navigator.userAgent); }catch(e){}
  L.push('');
  L.push('WHAT THEY SAID:');
  L.push(String(msg||'(no message)').slice(0,1500));
  try{
    if(ERR_LOG && ERR_LOG.length){
      L.push(''); L.push('RECENT PROBLEMS THE CARD RECORDED:');
      ERR_LOG.slice(-8).forEach(function(e){ L.push('  '+e.at+'  '+e.where+' - '+e.msg); });
    }
  }catch(e){}
  try{
    if(window.__ERRS && window.__ERRS.length){
      L.push(''); L.push('CRASHES:');
      window.__ERRS.slice(-4).forEach(function(e){
        L.push('  ['+e.kind+'] '+e.msg+'  '+e.src+':'+e.line+':'+e.col); });
    }
  }catch(e){}
  L.push('');
  L.push('(Their training data is NOT included. To send that too, use Backup on this screen.)');
  return L.join('\n');
}
function reportHTML(){
  if(!S.rptOpen) return '';
  var kind=S.rptKind||'bug';
  return '<div class="rpt-wrap" data-rptclose="1">'
   +'<div class="rpt-sheet" role="dialog" aria-label="Send a report">'
     +'<div class="hw-grip" aria-hidden="true"></div>'
     +'<div class="rpt-title">Send a report</div>'
     +'<div class="rpt-kinds">'+REPORT_KINDS.map(function(k){
         return '<span class="rpt-kind'+(kind===k[0]?' on':'')+'" data-rptkind="'+k[0]+'">'+k[1]+'</span>'; }).join('')+'</div>'
     +'<textarea id="rptMsg" class="rpt-msg" placeholder="What happened? What were you doing at the time?">'+esc(S.rptMsg||'')+'</textarea>'
     +'<div class="rpt-note">Your build, screen and any recorded problems are attached automatically. '
       +'Your training data is not.</div>'
     +'<div class="rpt-acts">'
       +'<span class="savelog" id="rptShare">Share\u2026</span>'
       +(REPORT_TO? '<span class="savelog" id="rptMail">Email it</span>':'')
       +(REPORT_SMS? '<span class="savelog" id="rptSms">Text it</span>':'')
       +'<span class="savelog" id="rptCopy">Copy to clipboard</span>'
     +'</div>'
     +'<div class="hw-done" data-rptclose="1">Close</div>'
   +'</div></div>';
}
// The links are built here rather than inline so they can be checked without a browser actually
// navigating. iOS wants sms:number&body=, Android wants sms:number?body= - '?' is the safer
// default, and the worst case is the message app opens with the number and an empty body.
function reportMailHref(body, kind){
  return 'mailto:'+REPORT_TO
    +'?subject='+encodeURIComponent('Training card report \u00b7 '+(kind||'bug'))
    +'&body='+encodeURIComponent(body||'');
}
function reportSmsHref(body){
  return 'sms:'+REPORT_SMS+'?body='+encodeURIComponent(body||'');
}
function reportWire(){
  document.querySelectorAll('[data-rptkind]').forEach(function(el){
    el.onclick=function(){ S.rptMsg=(document.getElementById('rptMsg')||{}).value||S.rptMsg;
      S.rptKind=el.dataset.rptkind; render(); }; });
  document.querySelectorAll('[data-rptclose]').forEach(function(el){
    el.onclick=function(ev){ if(ev.target!==el) return;
      S.rptMsg=(document.getElementById('rptMsg')||{}).value||''; S.rptOpen=false; save(); render(); }; });
  var open=document.getElementById('reportBtn');
  if(open) open.onclick=function(){ S.rptOpen=true; S.rptKind=S.rptKind||'bug'; render(); };
  var msg=function(){ return (document.getElementById('rptMsg')||{}).value||''; };
  var text=function(){ return reportBundle(S.rptKind||'bug', msg()); };
  var share=document.getElementById('rptShare');
  if(share) share.onclick=function(){
    var t=text();
    try{
      if(navigator.share){ navigator.share({title:'Training card report', text:t})
        .catch(function(e){ oops('reportShare',e); rptCopy(t); }); return; }
    }catch(e){ oops('reportShare',e); }
    rptCopy(t);
  };
  var mail=document.getElementById('rptMail');
  if(mail) mail.onclick=function(){
    try{ location.href=reportMailHref(text(), S.rptKind); }
    catch(e){ oops('reportMail',e); rptCopy(text()); }
  };
  var sms=document.getElementById('rptSms');
  if(sms) sms.onclick=function(){
    try{ location.href=reportSmsHref(text()); }
    catch(e){ oops('reportSms',e); rptCopy(text()); }
  };
  var cp=document.getElementById('rptCopy');
  if(cp) cp.onclick=function(){ rptCopy(text(), cp); };
}
function rptCopy(t, btn){
  var done=function(){ if(btn) btn.textContent='Copied \u2014 now paste it to your coach';
                       else alertToast('Report copied'); };
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(done, function(e){ oops('reportCopy',e); __errFallback(t); });
      return;
    }
  }catch(e){ oops('reportCopy',e); }
  __errFallback(t);
}

// ===== HOW-TO CLIPS =====
// Clips live beside the card as files (clips/bench-press.mp4 etc), not embedded, because video
// would blow up a single-file card. A manifest lists what's actually there; the How button only
// appears for movements that have one, so the library can be filled in a few at a time and
// nothing ever shows a broken placeholder. Opened from a bare file with no server, the fetch
// simply fails and the feature stays invisible.
var CLIPS={};
var howEx=null;
function exSlug(name){
  return String(name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
}
function hasClip(name){ return !!CLIPS[exSlug(name)]; }
function loadClips(){
  try{
    fetch('clips/index.json', {cache:'no-cache'}).then(function(r){
      return r.ok? r.json() : null;
    }).then(function(list){
      if(!list) return;
      var files=Array.isArray(list)? list : (list.files||[]);
      files.forEach(function(f){
        var base=String(f).replace(/^.*\//,'');
        CLIPS[base.replace(/\.[a-z0-9]+$/i,'')]=base;
      });
      if(Object.keys(CLIPS).length) render();
    }).catch(function(){});
  }catch(e){}

var GB_ORDER=['front','sideL','back','sideR'];   // a real quarter turn each, no mirroring
// Eye positions (percent of each view's box) with the candy colour immediately around them,

var GB={mode:'dock',px:0,py:0,vx:0,vy:0,rot:0,rotV:0,tx:0,ty:0,phase:0,t:0,raf:0,drag:null,
        stand:false,host:null,reduced:false,spin:0,spinV:0,spinT:0,lastX:0};
function gummyRegions(){
  try{
    var codes=PLAN.days.map(function(d){return d.code;});
    var code=(codes.indexOf(S.day)>-1)? S.day
      : ((typeof nextSession==='function'&&nextSession())? nextSession().code : codes[0]);

      armsF:acc.biceps||0, thighsF:acc.quads||0,

function gbDockPos(){ return {x:-88, y:Math.round((window.innerHeight||600)*0.56)}; }
function gbCenter(){ return {x:Math.round((window.innerWidth||360)/2-60), y:Math.round((window.innerHeight||600)/2-95)}; }
function gbInZone(){
  var c=gbCenter(); var R=Math.min(window.innerWidth||360, window.innerHeight||600)*0.18;
  return Math.hypot(GB.tx-c.x, GB.ty-c.y) < R;   // where he's being HELD, not where the jelly has caught up
}
function gbZoneSync(){
  if(!GB.drag || !GB.host) return;
  var inz=gbInZone();
  if(inz && !GB.stand){ GB.stand=true; GB.host.classList.add('gb-stand'); }
  else if(!inz && GB.stand){ GB.stand=false; GB.host.classList.remove('gb-stand'); }
}
// which quarter-turn he is facing, and how far past it (drives the turntable squeeze)
function gbFacing(){
  var s=((GB.spin%360)+360)%360;
  var idx=Math.round(s/90)%4;
  return {idx:idx, view:GB_ORDER[idx], off:s-idx*90, mirror:1};
}
function gbViewSync(){
  var h=GB.host; if(!h) return;
  var f=gbFacing();
  h.querySelectorAll('.gb-view').forEach(function(el){
    el.classList.toggle('on', el.getAttribute('data-gbv')===f.view);
  });
  GB.sx=Math.cos(f.off*Math.PI/180)*f.mirror;
  if(Math.abs(GB.sx)<0.04) GB.sx=0.04*(GB.sx<0?-1:1);
}
function gbApply(){
  var h=GB.host; if(!h) return;
  h.style.transform='translate('+GB.px.toFixed(1)+'px,'+GB.py.toFixed(1)+'px)';
  var st=h.querySelector('.gb-stage'); if(!st) return;
  var squash=GB.stand?1:(1-Math.min(.10, Math.abs(GB.vy)*0.00018));
  var sx=(GB.mode==='pose'&&GB.sx!=null)? GB.sx : 1;
  st.style.transform='rotate('+GB.rot.toFixed(1)+'deg) scale('+sx.toFixed(3)+','+squash.toFixed(3)+')';
}
function gbTick(now){
  GB.raf=0;
  now=now||((typeof performance!=='undefined'&&performance.now)? performance.now() : Date.now());
  var dt=Math.min(0.032, (now-(GB.t||now))/1000)||0.016; GB.t=now;
  var k=GB.drag?170:110, dmp=GB.drag?13:11;
  GB.vx+=((GB.tx-GB.px)*k-GB.vx*dmp)*dt; GB.vy+=((GB.ty-GB.py)*k-GB.vy*dmp)*dt;
  GB.px+=GB.vx*dt; GB.py+=GB.vy*dt;
  var rT=GB.stand?0:Math.max(-52, Math.min(52, -GB.vx*0.055));
  var rk=GB.stand?230:70, rd=GB.stand?22:5;          // underdamped while flopping, crisp when standing
  GB.rotV+=((rT-GB.rot)*rk-GB.rotV*rd)*dt; GB.rot+=GB.rotV*dt;
  GB.phase+=dt*(6+Math.min(13, Math.hypot(GB.vx,GB.vy)*0.02));
  if(GB.mode==='pose' && !GB.drag){                  // settle the turntable on a face
    GB.spinV+=((GB.spinT-GB.spin)*140-GB.spinV*16)*dt; GB.spin+=GB.spinV*dt;
  }
  if(GB.reduced){ GB.rot=0; GB.rotV=0; }
  gbZoneSync();
  if(GB.mode==='pose') gbViewSync();
  gbApply();
  var spinBusy=(GB.mode==='pose') && (Math.abs(GB.spinT-GB.spin)>0.6 || Math.abs(GB.spinV)>1);
  var still=!GB.drag && !spinBusy && Math.hypot(GB.vx,GB.vy)<3 && Math.abs(GB.rotV)<2
            && Math.hypot(GB.tx-GB.px, GB.ty-GB.py)<1.5;
  if(still){
    GB.px=GB.tx; GB.py=GB.ty; GB.vx=GB.vy=GB.rotV=0; if(GB.stand) GB.rot=0;
    if(GB.mode==='pose'){ GB.spin=GB.spinT; GB.spinV=0; gbViewSync(); }
    gbApply();
    if(GB.mode==='dock' && GB.host) GB.host.classList.add('gb-docked');
    return;
  }
  GB.raf=requestAnimationFrame(gbTick);
}
function gbWake(){ if(!GB.raf){ GB.t=0; GB.raf=requestAnimationFrame(gbTick); } }
function gbPose(){
  GB.mode='pose'; GB.stand=true; GB.spin=0; GB.spinT=0; GB.spinV=0;
  var c=gbCenter(); GB.tx=c.x; GB.ty=c.y;
  var h=GB.host; h.classList.remove('gb-docked'); h.classList.add('gb-stand','gb-pose');
  gbViewSync();
  var R=gummyRegions(), max=0, kk; for(kk in R) if(R[kk]>max) max=R[kk];
  h.querySelectorAll('.gb-r').forEach(function(el){
    var v=R[el.getAttribute('data-gr')]||0;
    if(max>0 && v>0.5){ el.classList.add('on'); el.style.setProperty('--i', (0.5+0.5*Math.min(1, v/max)).toFixed(2)); }
    else { el.classList.remove('on'); el.style.removeProperty('--i'); }
  });

}

function gummyInit(){
  try{
    if(document.getElementById('gbHost')) return;
    GB.reduced=!!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    var h=document.createElement('div'); h.id='gbHost'; h.setAttribute('role','button');
    h.setAttribute('aria-label','Gummy \u2014 pull him to the middle of the screen');
    h.innerHTML=gbLayers();
    document.body.appendChild(h); GB.host=h;
    var d0=gbDockPos(); GB.px=GB.tx=d0.x; GB.py=GB.ty=d0.y; GB.sx=1; gbApply(); h.classList.add('gb-docked');
    var down=window.PointerEvent?'pointerdown':'mousedown';
    var move=window.PointerEvent?'pointermove':'mousemove';
    var up=window.PointerEvent?'pointerup':'mouseup';
    var sx=0, sy=0, moved=false;
    h.addEventListener(down, function(ev){
      try{ if(typeof ONB_ACTIVE==='function' && ONB_ACTIVE()) return; }catch(e){}
      ev.preventDefault();
      GB.drag={ox:ev.clientX-GB.px, oy:ev.clientY-GB.py}; sx=ev.clientX; sy=ev.clientY; moved=false;
      GB.lastX=ev.clientX;
      if(GB.mode!=='pose') h.classList.remove('gb-docked');
      try{ if(ev.pointerId!=null && h.setPointerCapture) h.setPointerCapture(ev.pointerId); }catch(e){}
      gbWake();
    });
    var onMove=function(ev){
      if(!GB.drag) return;
      if(Math.hypot(ev.clientX-sx, ev.clientY-sy)>6) moved=true;
      if(GB.mode==='pose'){                            // posed: a sideways drag turns him
        GB.spin+=(ev.clientX-GB.lastX)*0.7; GB.lastX=ev.clientX;
        gbViewSync(); gbApply(); gbWake(); return;
      }
      GB.tx=ev.clientX-GB.drag.ox; GB.ty=ev.clientY-GB.drag.oy;
      gbZoneSync(); gbWake();
    };
    var onUp=function(){
      if(!GB.drag) return; GB.drag=null;
      if(GB.mode==='pose'){
        if(!moved){ gbDock(); return; }                // a tap on the posing bear sends him home
        GB.spinT=Math.round(GB.spin/90)*90;            // otherwise settle on the nearest face
        gbWake(); return;
      }
      if(gbInZone()) gbPose(); else gbDock();
    };
    window.addEventListener(move, onMove); window.addEventListener(up, onUp);
    try{
      if(typeof ONB_ACTIVE==='function' && ONB_ACTIVE()){
        h.style.display='none';
        var iv=setInterval(function(){ try{
          if(!ONB_ACTIVE()){ h.style.display=''; clearInterval(iv); }
        }catch(e){ clearInterval(iv); } }, 1200);
      }
    }catch(e){}
  }catch(e){}
}

  for(var i=1;i<=n;i++) h+='<div class="chip'+(i===cur?' on':'')+'" data-printwk="'+i+'">W'+i+(i===n?'':'')+'</div>';
  h+='</div>'
   +'<div class="exnote" style="padding-top:10px">Week '+n+' is the deload \u2014 it prints with the lighter loads and two sets.</div>'
   +'</div>';

}

function CUSTKEY(){ return (S.customs!==undefined)? 'customs' : 'custom'; }
function custList(c){ var o=S[CUSTKEY()]; if(!o){ o=S[CUSTKEY()]={}; }
  if(Array.isArray(o)) return [];

function outFlat(){ return Array.isArray(S.out); }

// ============ ORDERING, DRAG & SWAP ============
// Logged sets are keyed by position, so any reorder has to move the logged data
// with it. Nothing here changes an exercise's history.

function ordFor(code){ return (S.order&&S.order[code])||null; }
function applyOrder(code,list){
  var ord=ordFor(code); if(!ord||!ord.length) return list;
  var pos={}; ord.forEach(function(n,i){ pos[n]=i; });
  var out=list.slice();
  out.sort(function(a,b){
    var ai=(pos[a.name]!=null)? pos[a.name] : 1000+list.indexOf(a);
    var bi=(pos[b.name]!=null)? pos[b.name] : 1000+list.indexOf(b);
    return ai-bi; });
  return out;
}
// the display order of a day, as names
function dayOrderNames(code){
  var keep=S.day, res=[];
  try{ S.day=code; res=dayObjRaw().exercises.map(function(e){ return e.name; });
    custList(code).forEach(function(c){ if(res.indexOf(c.name)<0) res.push(c.name); }); }
  catch(e){ res=res||[]; }
  S.day=keep;
  return applyOrder(code,res.map(function(n){ return {name:n}; })).map(function(x){ return x.name; });
}
// move logged sets so they follow their exercise
function remapData(code, oldNames, newNames, dropMissing){
  if(!S.data) return 0;
  var to={}; // oldIndex -> newIndex
  newNames.forEach(function(n,ni){ var oi=oldNames.indexOf(n); if(oi>-1) to[oi]=ni; });
  var moved=0, buckets={};
  Object.keys(S.data).forEach(function(k){
    var p=k.split('|'); if(p.length<4) return;
    if(p[2]!==code) return;
    var last=p[p.length-1]; if(!/^\d+$/.test(last)) return;
    var pre=p.slice(0,p.length-1).join('|');
    (buckets[pre]=buckets[pre]||[]).push({k:k,i:+last});
  });
  Object.keys(buckets).forEach(function(pre){
    var items=buckets[pre], stash={};
    items.forEach(function(it){ stash[it.i]=S.data[it.k]; delete S.data[it.k]; });
    Object.keys(stash).forEach(function(oi){
      if(to[oi]==null){ if(dropMissing) return; S.data[pre+'|'+oi]=stash[oi]; moved++; return; }
      S.data[pre+'|'+to[oi]]=stash[oi]; moved++; });
  });
  return moved;
}

// deleting an added movement really deletes it - and its logged sets go with it,
// because leaving orphaned data behind is how charts start lying
function isAdded(code,name){ return custList(code).some(function(x){ return x.name===name; }); }
function deleteAdded(code,name){
  var oldNames=dayOrderNames(code);
  var cs=custList(code);
  var i=cs.findIndex(function(x){ return x.name===name; });
  if(i>-1) cs.splice(i,1);
  var o=outList(code), oi=o.indexOf(name); if(oi>-1) o.splice(oi,1);
  if(S.order&&S.order[code]) S.order[code]=S.order[code].filter(function(n){ return n!==name; });
  var newNames=dayOrderNames(code);
  remapData(code, oldNames, newNames, true);
  save(); render(); alertToast(name+' deleted');
}
function setOrder(code, newNames){
  var oldNames=dayOrderNames(code);
  if(!S.order) S.order={};
  S.order[code]=newNames.slice();
  var n=remapData(code, oldNames, newNames);
  save();
  return n;
}
// The plan's original order lives in the code and cannot be forgotten - this is the door
// back to it. Logged sets ride the remap exactly like any other reorder; customs keep
// their place at the end. Two-tap armed, because it undoes every manual move at once.
function resetOrder(code){
  var oldNames=dayOrderNames(code);
  if(S.order) delete S.order[code];
  var newNames=dayOrderNames(code);        // with the override gone, this IS the plan's order
  remapData(code, oldNames, newNames);
  save(); render(); alertToast('Day '+code+' back to the plan\u2019s order');
}
function moveInDay(code, from, to){
  var names=dayOrderNames(code);
  if(to<0||to>=names.length||from===to) return false;
  var x=names.splice(from,1)[0];
  names.splice(to,0,x);
  setOrder(code,names); render(); return true;
}

// ---- swap one movement for another, in place ----
function swapInDay(code, oldName, newName){
  var names=dayOrderNames(code);
  var at=names.indexOf(oldName);
  // retire the old one
  var cs=custList(code);
  var ci=cs.findIndex(function(x){ return x.name===oldName; });
  if(ci>-1) cs.splice(ci,1);
  else { var o=outList(code); if(o.indexOf(oldName)<0) o.push(oldName); }
  // bring the new one in with a starting weight
  try{ libAdd(newName, code); }catch(e){}
  // and drop it into the slot the old one held
  var after=dayOrderNames(code).filter(function(n){ return n!==newName; });
  if(at<0||at>after.length) at=after.length;
  after.splice(at,0,newName);
  setOrder(code, after);
  S.swapFor=null; save(); render();
  alertToast(oldName+' \u2192 '+newName);
}

// ---- drag to reorder ----
var DRAG=null;
function wireDrag(){
  var rows=document.querySelectorAll('[data-rtidx]');
  if(!rows.length) return;
  var code=null;
  rows.forEach(function(row){
    code=row.dataset.rtc;
    var grip=row.querySelector('[data-grip]'); if(!grip) return;
    var start=function(clientY){
      DRAG={row:row, code:row.dataset.rtc, from:+row.dataset.rtidx, y0:clientY, moved:0};
      row.classList.add('dragging');
      document.body.style.userSelect='none';
    };
    var move=function(clientY){
      if(!DRAG) return;
      var dy=clientY-DRAG.y0;
      DRAG.row.style.transform='translateY('+dy+'px)';
      DRAG.row.style.zIndex=30;
      var h=DRAG.row.offsetHeight+9;
      var shift=Math.round(dy/h);
      if(shift!==DRAG.moved){
        DRAG.moved=shift;
        var all=[].slice.call(document.querySelectorAll('[data-rtidx]'));
        all.forEach(function(r){
          if(r===DRAG.row) return;
          var i=+r.dataset.rtidx, t=DRAG.from+shift;
          var off=0;
          if(DRAG.from<t && i>DRAG.from && i<=t) off=-h;
          else if(DRAG.from>t && i<DRAG.from && i>=t) off=h;
          r.style.transform=off? 'translateY('+off+'px)':'';
        });
      }
    };
    var end=function(){
      if(!DRAG) return;
      var to=Math.max(0,Math.min(document.querySelectorAll('[data-rtidx]').length-1, DRAG.from+DRAG.moved));
      var d=DRAG; DRAG=null;
      document.body.style.userSelect='';
      d.row.classList.remove('dragging');
      if(to!==d.from) moveInDay(d.code, d.from, to);
      else { d.row.style.transform=''; d.row.style.zIndex='';
        document.querySelectorAll('[data-rtidx]').forEach(function(r){ r.style.transform=''; }); }
    };
    grip.ontouchstart=function(e){ e.preventDefault(); start(e.touches[0].clientY); };
    grip.ontouchmove=function(e){ if(DRAG){ e.preventDefault(); move(e.touches[0].clientY); } };
    grip.ontouchend=function(e){ end(); };
    grip.onmousedown=function(e){ e.preventDefault(); start(e.clientY);
      var mm=function(ev){ move(ev.clientY); };
      var mu=function(){ document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu); end(); };
      document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu); };
  });
}
function wireOrder(){
  var q=function(s,f){ document.querySelectorAll(s).forEach(f); };
  q('[data-rtup]',function(el){ el.onclick=function(){ moveInDay(el.dataset.rtc,+el.dataset.rtup,+el.dataset.rtup-1); }; });
  q('[data-rtdown]',function(el){ el.onclick=function(){ moveInDay(el.dataset.rtc,+el.dataset.rtdown,+el.dataset.rtdown+1); }; });

  q('[data-swcancel]',function(el){ el.onclick=function(){ S.swapFor=null; save(); render(); }; });

}

function cycleHasLogs(){ try{ var C=cyc();
  return (logKeys||[]).some(function(k){ var m=k.slice(LOGP.length).match(/-([A-Za-z]+)-W(\d+)B(\d+)$/); return !!m && (+m[3])===C; });

function rebuildSplit(days){
  // Regenerate the plan on a new number of sessions, preserving the athlete's maxes, goal, emphasis,
  // limits and priority. A different split is a different block, so start a fresh cycle when the current
  // one already has logged work — old logs stay attached to the old cycle, the new split begins clean.
  try{
    if(typeof generatePlan!=='function' || !S.onb) return;
    days=Math.max(3, Math.min(7, days|0));
    var o=S.onb; o.days=days;
    var plan=generatePlan({maxes:S.maxes||{}, goal:o.goal||'general', days:days,
      limits:o.limits||[], emphasis:o.emph||'balanced', weak:o.weak||'auto',
      weekdays:(o.wd&&o.wd.length===days)? o.wd : null,   // old picks do not fit a new day count
      res:o.res||{}, prefs:o.prefs||{}});
    S.genPlan=plan; PLAN=plan;
    S.maxes=Object.assign({}, plan.maxes);
    if(cycleHasLogs()) S.cycle=cyc()+1;
    S.week=1; S.day=plan.days[0].code; S.data={};

}

// ===== WEEKLY VOLUME PER MUSCLE (planned, from the effective routine) =====

var VOL_ORDER=['chest','back','fdelt','sdelt','rdelt','biceps','triceps','quads','hams','glutes','calves','abs'];

function volMuscles(name){
  if(VOL_OVERRIDE[name]) return VOL_OVERRIDE[name];
  var r=libRow(name); if(!r) return null;
  var g=r[1], pat=r[3];
  if(g==='core') return {abs:1};
  if(g==='arms') return {biceps:1};
  if(g==='legs') return (pat==='squat')? {quads:1,glutes:.5} : {hams:1,glutes:.5};
  if(g==='push') return (pat==='ohp')? {fdelt:1,sdelt:.5,triceps:.5} : {chest:1,triceps:.5,fdelt:.5};
  if(g==='pull') return (pat==='dead')? {back:.5} : {back:1,biceps:.5};
  return null;
}
function effectiveExercises(c){
  var out=outList(c)||[];
  var base=(planExercises(c)||[]).filter(function(ex){ return out.indexOf(ex.name)<0; });
  return base.concat(custList(c)||[]);
}
function plannedVolume(){
  var acc={}; VOL_ORDER.forEach(function(m){ acc[m]=0; });

      effectiveExercises(c).forEach(function(ex){
        var sets=+ex.sets||0; if(!sets) return;

// ===== ANATOMY MAP =====

// waist and hip widths), not two separately hand-drawn figures, so muscle placement stays honest
// on both. Limbs are drawn as round-capped strokes - far cleaner than outlining every limb.
function anaSex(){

// colour + opacity for a muscle carrying n weekly sets
// One colour, varying only in strength: the chart answers "where does the work go", and the
// bars below answer "is that the right amount". Three bands here collided with the bars, where

function libDefaults(r){
  // sensible starting prescription by group and equipment
  var g=r[1], eq=r[2];
  if(g==='core') return {sets:3, reps:(r[0].indexOf('Plank')>-1?'max hold':'12-15')};
  if(g==='arms') return {sets:3, reps:'10-12'};
  if(eq==='barbell') return {sets:3, reps:'6-8'};
  if(eq==='machine'||eq==='cable') return {sets:3, reps:'10-12'};
  return {sets:3, reps:'8-12'};

  var d=libDefaults(r);

  if(est==null){ var an=libAnchor(name);
    if(an && S.maxes && S.maxes[an.base]!=null){
      var step=(an.unit==='sled')?10:5;
      est={val:Math.max(step,Math.round(an.f*S.maxes[an.base]/step)*step)}; } }
  custList(code).push({b:cyc(), w:S.week, cid:Date.now()+Math.floor(Math.random()*999), name:name,
    load:(r[5]==='bw'?'BW':(est&&est.val!=null? est.val : 25)),
    sets:d.sets, reps:d.reps, perHand:(r[5]==='perHand')});

// ================= PER-EXERCISE HISTORY =================
function histPush(name, rec){
  if(!S.exHist) S.exHist={};
  if(!S.order) S.order={};
  if(S.swapFor===undefined) S.swapFor=null;
  var a=S.exHist[name]||(S.exHist[name]=[]);
  var i=a.findIndex(function(x){ return x.d===rec.d; });
  if(i>-1) a[i]=rec; else a.push(rec);
  a.sort(function(x,y){ return x.d<y.d?-1:1; });
  if(a.length>80) S.exHist[name]=a.slice(-80);
}
function histFor(n){ return (S.exHist&&S.exHist[n])||[]; }
function histBest(n){ var a=histFor(n), b=null;
  a.forEach(function(x){ if(x.w!=null&&(!b||x.w>b.w)) b=x; }); return b; }
function histVolume(x){ return (x.sets||[]).reduce(function(s,r){ return s+((x.w||0)*(r||0)); },0); }

// records the finished exercise into history and returns any personal records set
function recordHistory(){
  var out=[]; var d;
  try{ d=dayObj(); }catch(e){ return out; }
  d.exercises.forEach(function(ex,i){
    var st=null; try{ st=S.data[exKey(i)]; }catch(e){}
    if(!st) return;
    var done=st.sets.filter(function(s){ return s.st!=='pend'; });
    if(!done.length) return;
    var nm=st.sub||ex.name;
    var w=null; try{ w=st.sub? st.w : ((ex.loadNum!=null||ex.maxKey)? curLoad(ex,st) : null); }catch(e){}
    var tgt=8; try{ tgt=defReps(ex); }catch(e){}
    var reps=done.map(function(s){ return s.st==='hit'? tgt : (s.reps!=null? s.reps : 0); });
    var topReps=Math.max.apply(null,reps.concat([0]));
    var e1=null;
    if(typeof w==='number' && topReps>0 && topReps<=12) e1=Math.round(w*(1+topReps/30));
    var date=(S.when&&S.when.date)||localDate();
    // records are judged against everything logged BEFORE today
    var prior=histFor(nm).filter(function(x){ return x.d!==date; });
    var bw=null, be=null, bv=null;
    prior.forEach(function(x){
      if(x.w!=null&&(bw==null||x.w>bw)) bw=x.w;
      if(x.e1!=null&&(be==null||x.e1>be)) be=x.e1;
      var v=histVolume(x); if(bv==null||v>bv) bv=v; });
    var rec={d:date, w:(typeof w==='number'?w:null), sets:reps, e1:e1};
    var vol=histVolume(rec);
    if(prior.length){
      if(rec.w!=null&&bw!=null&&rec.w>bw) out.push({ex:nm,kind:'weight',val:rec.w,prev:bw});
      if(e1!=null&&be!=null&&e1>be) out.push({ex:nm,kind:'estimated max',val:e1,prev:be});
      if(bv!=null&&vol>bv&&vol>0) out.push({ex:nm,kind:'volume',val:Math.round(vol),prev:Math.round(bv)});
    }
    histPush(nm,rec);
  });
  if(out.length){
    if(!S.prs) S.prs=[];
    var dt=(S.when&&S.when.date)||localDate();
    out.forEach(function(p){ S.prs.push({d:dt,ex:p.ex,kind:p.kind,val:p.val,prev:p.prev}); });
    if(S.prs.length>200) S.prs=S.prs.slice(-200);
    S.prShow=out;
  }
  return out;
}

  try{ return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  catch(e){ return false; }
}
// --- the spark burst that plays over a new personal record ---
function prSparksHTML(){
  if(fxReduced()) return '';
  var n=14, s='<div class="pr-fx" aria-hidden="true">';
  for(var i=0;i<n;i++){
    var ang=(360/n)*i + (i%2?7:-7);
    var dist=38+((i*13)%26);
    var delay=(i%5)*45;
    s+='<i style="--a:'+ang+'deg;--d:'+dist+'px;--t:'+delay+'ms"></i>';
  }
  return s+'</div>';
}
// --- consistency streak: how many days in a row carry at least one logged session ---
function streakDays(){
  try{
    if(!logKeys || !logKeys.length) return 0;
    var days={};
    logKeys.forEach(function(k){
      var m=k.slice(LOGP.length).match(/^(\d{4}-\d{2}-\d{2})/);
      if(m) days[m[1]]=true;
    });
    var today=localDate();
    // a streak survives today being unlogged - it only breaks once a full day has passed unlogged
    var cur=new Date(today+'T00:00:00');
    if(!days[today]) cur.setDate(cur.getDate()-1);
    var n=0;
    for(var guard=0; guard<400; guard++){
      var iso=new Date(cur.getTime()-cur.getTimezoneOffset()*60000).toISOString().slice(0,10);
      if(!days[iso]) break;
      n++; cur.setDate(cur.getDate()-1);
    }
    return n;
  }catch(e){ return 0; }
}
function streakHTML(){
  var n=streakDays();
  if(n<2) return '';                        // one session is not yet a streak - don't cheapen it
  var tier = n>=30? 4 : n>=14? 3 : n>=7? 2 : 1;
  var word = n>=30? 'unbroken' : n>=14? 'rolling' : n>=7? 'building' : 'going';
  return '<div class="streak t'+tier+'" data-streak="'+n+'">'
   +'<span class="stk-flame" aria-hidden="true">'
     +'<span class="stk-f1"></span><span class="stk-f2"></span><span class="stk-core"></span>'
   +'</span>'
   +'<span class="stk-n">'+n+'</span>'
   +'<span class="stk-w">day'+(n===1?'':'s')+' '+word+'</span>'
   +'</div>';
}

  try{ n=Object.keys(S.exHist||{}).length + (S.weightLog||[]).length + (S.cycleLog||[]).length; }catch(e){}
  return n; }
function backupDue(){
  if(dataAge()<3) return false;
  if(!S.lastBackup) return true;
  try{ return (new Date(localDate())-new Date(S.lastBackup))/86400000 >= 7; }catch(e){ return true; } }
function backupBarHTML(){
  // One quiet line, at the BOTTOM, only when there is something to lose. The old version was
  // a doom-copy amber box greeting the athlete at startup - right message, wrong delivery.
  if(!backupDue()||S.backupSnooze===localDate()) return '';
  var never=!S.lastBackup;
  return '<div class="bkline">'
   +(never? 'Your log lives only on this phone' : 'Last backup '+S.lastBackup)
   +' \u2014 <span data-bkgo="1">Back up</span><span class="du-dot">\u00b7</span><span data-bksnooze="1">Later</span></div>'; }
function markBackedUp(){ S.lastBackup=localDate(); save(); }

function installHTML(){
  var standalone=false;
  try{ standalone=(window.navigator.standalone===true)||
    (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches); }catch(e){}
  if(standalone||S.hideInstall) return '';
  var ios=/iPad|iPhone|iPod/.test(navigator.userAgent||'');
  return '<div class="block"><h3>Put this on your home screen</h3>'
   +'<div class="cue" style="padding:0">'+(ios
     ? 'Tap the Share button in Safari, then <b>Add to Home Screen</b>. It opens full screen with no browser bar, and works with no signal.'
     : 'Open your browser menu and choose <b>Add to Home screen</b> or <b>Install app</b>. It opens full screen and works with no signal.')
   +'</div><div class="ed-row"><div class="daybtn" data-noinstall="1" style="flex:1;color:var(--faint)">Got it, hide this</div></div></div>'; }
function wipeHTML(){
  // A quiet link at the very bottom of the plan tab, not a loud warning box greeting anyone -
  // same lesson the backup line already learned. It only gets loud once opened.
  if(!wipeArmed){
    return '<div class="block" style="text-align:center;padding-top:2px">'
     +'<span class="wipe-link" data-wipeopen="1">Start over on this phone</span></div>';
  }
  var last=S.lastBackup;
  var backupLine=last
   ? 'Last backup <b>'+last+'</b>.'
   : '<span style="color:var(--amber);font-weight:700">You have never backed up this phone.</span>';
  return '<div class="block wipe-zone">'
   +'<h3 style="color:var(--red)">Start over</h3>'
   +'<div class="cue" style="padding:0 0 8px">This permanently erases your plan, every logged session, and your '
   +'settings from THIS PHONE. It does not touch a backup file you have already saved to Files or Notes \u2014 '
   +'restore from that later if you change your mind. There is no undo.</div>'
   +'<div class="cue" style="padding:0 0 10px">'+backupLine+'</div>'
   +'<div class="ed-row" style="margin-bottom:10px">'
     +'<div class="daybtn" data-wipebackup="1" style="flex:1">Back up first</div>'
     +'<div class="daybtn" data-wipecancel="1" style="flex:0 0 auto;color:var(--faint)">Cancel</div>'
   +'</div>'
   +'<button class="wipe-fire" data-wipehold="1">Hold to erase everything</button>'
   +'</div>';
}
async function wipeEverything(){
  try{
    if(storageOK){
      var ks=await stList(LOGP);
      for(var i=0;i<ks.length;i++){ if(ks[i]!==curLOGP()+'probe'){ try{ await stDel(ks[i]); }catch(e){} } }
    }
    await stDel(curSKEY());
  }catch(e){}
  logCache={}; logKeys=[]; logOpen=null;
  try{ alertToast('Erased \\u2014 starting fresh \\u2713'); }catch(e){}
  setTimeout(function(){ try{ location.reload(); }catch(e){} }, 650);

function focusIdx(){ var i=S.focus; if(i==null||i<0) i=0; var m=focusMax(); return i>=m? m-1 : i; }

function exDone(i){ try{ var d=dayObj(), ex=d.exercises[i]; if(!ex) return false;

// ---- swipe between cards ----
function wireFocus(){
  document.querySelectorAll('[data-deck]').forEach(function(el){
    el.onclick=function(){ S.view=(S.view==='deck')?'focus':'deck'; save(); render(); }; });
  document.querySelectorAll('[data-focus]').forEach(function(el){
    el.onclick=function(ev){
      if(ev.target.closest && ev.target.closest('[data-ss],[data-exout]')) return; // control buttons win over row tap
      setFocus(+el.dataset.focus); }; });

  document.querySelectorAll('[data-fmove]').forEach(function(el){
    el.onclick=function(){ setFocus(focusIdx()+(+el.dataset.fmove)); }; });
  var app=document.getElementById('app'); if(!app||S.view==='deck') return;
  var x0=null,y0=null;
  app.ontouchstart=function(e){ if(e.touches.length!==1) return; x0=e.touches[0].clientX; y0=e.touches[0].clientY; };
  app.ontouchend=function(e){ if(x0==null) return;
    var t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    x0=null;
    // horizontal only - a vertical gesture is scrolling, never a command
    if(Math.abs(dx)>62 && Math.abs(dx)>Math.abs(dy)*1.6) setFocus(focusIdx()+(dx<0?1:-1)); }; }

async function probeStorage(){
  // Mode-aware: the round-trip below routes through whichever backend ST_MODE selected
  // (Claude bridge OR plain localStorage). The old first line demanded the bridge before
  // trying anything - so GitHub-hosted cards with perfectly working localStorage reported
  // "Storage unavailable" and benched the session-log feature for no reason.
  if(ST_MODE==='none'){ storageOK=false; stFailHard(); return; }
  var ok=await stSet(curLOGP()+'probe','1');
  if(ok){ var v=await stGet(curLOGP()+'probe'); await stDel(curLOGP()+'probe'); storageOK=(v==='1'); }
  else storageOK=false;
  if(!storageOK) stFailHard();
}
async function refreshLogs(){
  if(!storageOK){ logKeys=[]; return; }
  try{ const _ks=await stList(LOGP); logKeys=(_ks||[]).filter(k=>k!==curLOGP()+'probe').sort().reverse(); }
  catch(e){ logKeys=[]; }
}
async function saveSessionLog(quiet){
  try{ updateE1RM(); recordPerf(); recordHistory(); }catch(e){ oops("saveSessionLog",e); }
  try{ autoCalibrate(); }catch(e){ oops("saveSessionLog",e); }
  if(!storageOK){ if(!quiet) alertToast('Storage unavailable on this device'); return false; }
  const key=curLOGP()+S.when.date+'-'+S.day+'-W'+S.week+'B'+cyc();
  // Session notes belong to the session they were written for. They are cleared once safely
  // written into the log, so they can't bleed into the next session's report - but they are
  // stashed against this log key first, so re-saving the SAME session doesn't lose them.
  const noteBefore=S.notes;
  if(!String(S.notes||'').trim() && S.noteStashKey===key && S.noteStash) S.notes=S.noteStash;
  const snap={date:S.when.date, time:S.when.time, day:S.day, week:S.week, report:report()};
  try{
    await stSet(key, JSON.stringify(snap));
    delete logCache[key];
    try{ frzSnap(S.week, S.day); }catch(e){ oops("saveSessionLog",e); }
    // saving closes the day: the debrief stops greeting you and the sets stop responding
    try{ var dk=cyc()+'|'+S.week+'|'+S.day;
         S.dbf=S.dbf||{}; S.dbf[dk]=true;
         S.locked=S.locked||{}; S.locked[dk]=true; }catch(e){ oops('lockOnSave',e); }
    if(String(S.notes||'').trim()){ S.noteStash=S.notes; S.noteStashKey=key; }
    S.notes='';
    save();
    await refreshLogs();
    try{ blockDoneCheck(); }catch(e){ oops("saveSessionLog",e); }   // AFTER the write + refresh, so the final session counts
    // the evidence for adaptation just landed, so weigh it now
    try{ adaptRun(); }catch(e){ oops('adaptRun',e); }
    render();
    if(!quiet) alertToast('Session saved \u00b7 '+S.when.date);
    return true;
  }catch(e){ oops('saveSessionLog',e); S.notes=noteBefore; if(!quiet) alertToast('Save failed'); return false; }
}
async function openLog(k){
  if(logOpen===k){ logOpen=null; render(); return; }
  if(!logCache[k]){
    try{ const _v=await stGet(k);
      logCache[k]= _v ? JSON.parse(_v) : {error:'could not load'}; }
    catch(e){ logCache[k]={error:'could not load'}; }
  }
  logOpen=k; render();
}
async function exportAllLogs(){
  if(!storageOK || !logKeys.length){ alertToast(storageOK? 'No logs to export':'Storage unavailable'); return; }
  const parts=[];
  for(const k of logKeys){
    if(!logCache[k]){ try{ const _v=await stGet(k); if(!_v) continue;
logCache[k]=JSON.parse(_v); }catch(e){ continue; } }
    const c=logCache[k];
    parts.push('=== '+k.slice(LOGP.length)+' ===\n'+(c.report||JSON.stringify(c)));
  }
  const t='SESSION LOG EXPORT\n'+parts.join('\n\n');
  const copied=await tryCopy(t);
  showOverlay('All session logs', t, copied);
}

}

    // merge, never replace — a saved state missing a section must not take the app down
    S=Object.assign({}, DEF, saved);
    Object.keys(DEF).forEach(function(k){
      if(DEF[k] && typeof DEF[k]==='object' && !Array.isArray(DEF[k])){
        if(!S[k] || typeof S[k]!=='object' || Array.isArray(S[k])) S[k]=JSON.parse(JSON.stringify(DEF[k]));
        else S[k]=Object.assign({}, DEF[k], S[k]); }

// Photos are stored IN the card's state, so they ride every backup - which is exactly why
// they must be small. Downscale to a 256px square JPEG and hard-cap the stored size: a raw
// camera photo left as-is could crowd out actual training data, the unforgivable trade.
var AVA_MAX=100000;   // ~100 KB ceiling on the stored data URL
function setAvatar(dataUrl){
  if(!dataUrl || dataUrl.slice(0,10)!=='data:image'){ alertToast('That is not an image'); return false; }
  if(dataUrl.length>AVA_MAX){ alertToast('Photo too large even after shrinking'); return false; }
  S.avatar=dataUrl; save(); render(); return true;
}
function avatarFromFile(file){
  try{
    var rd=new FileReader();
    rd.onload=function(){
      var img=new Image();
      img.onload=function(){
        try{
          var side=256, c=document.createElement('canvas'); c.width=side; c.height=side;
          var ctx=c.getContext('2d');
          if(!ctx){ setAvatar(String(rd.result)); return; }   // environments without canvas: try as-is (cap still guards)
          var m=Math.min(img.width,img.height);
          ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,side,side);
          var out=c.toDataURL('image/jpeg',0.82);
          if(out.length>AVA_MAX) out=c.toDataURL('image/jpeg',0.55);
          setAvatar(out);
        }catch(e){ alertToast('Could not process that photo'); }
      };
      img.onerror=function(){ alertToast('Could not read that photo'); };
      img.src=String(rd.result);
    };
    rd.readAsDataURL(file);
  }catch(e){ alertToast('Could not read that photo'); }
}
